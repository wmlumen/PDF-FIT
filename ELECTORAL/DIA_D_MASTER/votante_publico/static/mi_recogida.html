<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tu recogida — DIA D MASTER</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <script src="vendor/tailwind.js"></script>
  <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <script src="vendor/leaflet/leaflet.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { background: #0a0a0f; }
    .fade-in { animation: fadeIn .3s ease-out; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body class="min-h-screen text-white">
  <div id="app" class="max-w-md mx-auto px-4 py-6"></div>

  <script>
    const API = '/api';
    const params = new URLSearchParams(location.search);
    const token = params.get('t') || '';
    let state = { cargando: true, error: '', datos: null, enviando: false, mensaje: '', ultimoEnvio: 0, editando: false, guardando: false, tapLat: null, tapLng: null, confirmando: false, seguimientoActivo: false, watchId: null, seguimientoExpira: 0 };
    let mapa = null, marcadorVotante = null, marcadorConductor = null, marcadorLocal = null, linea = null;
    let pollTimer = null;

    function distanciaKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
      return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
    }

    function compartirUbicacionYDestino() {
      const d = state.datos || {};
      const shareUrl = new URL('/ubicacion_votante_compartida.html', location.origin);
      shareUrl.searchParams.set('t', token);
      const destino = d.local_lat != null && d.local_lng != null
        ? `Destino: https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.local_lat + ',' + d.local_lng)}`
        : `Destino: ${d.local_nombre || 'local de votación'}`;
      const payload = { title: 'Ubicación y destino del votante', text: `Ubicación y destino se actualizan cada 5 minutos, sin compartir trayecto. ${destino}`, url: shareUrl.toString() };
      if (navigator.share) navigator.share(payload).catch(() => {});
      else if (navigator.clipboard?.writeText) navigator.clipboard.writeText(`${payload.text}\nUbicación actualizada: ${payload.url}`).then(() => alert('Enlace de ubicación y destino copiado.')).catch(() => alert(`${payload.text}\n${payload.url}`));
      else alert(`${payload.text}\n${payload.url}`);
    }

    async function cargar() {
      try {
        const r = await fetch(`${API}/votante_publico?t=${encodeURIComponent(token)}&v=${Date.now()}`);
        const d = await r.json();
        if (!d.success) { state.error = d.error || 'Enlace inválido'; state.cargando = false; render(); return; }
        state.datos = d;
        state.error = '';
      } catch (e) {
        state.error = 'No se pudo conectar. Probá de nuevo en un momento.';
      }
      state.cargando = false;
      render();
      setTimeout(initMapa, 50);
    }

    function formatearFecha(iso) {
  if (!iso) return '';
  const partes = iso.split('-');
  if (partes.length !== 3) return iso;
  const [y, m, d] = partes;
  return `${d}/${m}/${y}`;
}

function abrirEdicion() {
      state.editando = true;
      render();
      const h = document.getElementById('editHora');
      const u = document.getElementById('editUbicacion');
      if (h) h.value = state.datos.hora_recogida || '';
      if (u) u.value = state.datos.ubicacion || '';
    }

    function cerrarEdicion() { state.editando = false; render(); }

    async function guardarCambioHoraLugar() {
      const hora = document.getElementById('editHora').value;
      const ubicacion = document.getElementById('editUbicacion').value.trim();
      if (!hora || !ubicacion) { state.mensaje = '⚠️ Completá la hora y el lugar'; render(); return; }
      state.guardando = true; render();
      try {
        const r = await fetch(`${API}/votante_publico/editar`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, hora_recogida: hora, ubicacion })
        });
        const d = await r.json();
        state.mensaje = d.success ? '✅ Listo, avisamos el cambio' : '⚠️ ' + (d.error || 'No se pudo guardar');
      } catch (e) { state.mensaje = '⚠️ Error de conexión'; }
      state.guardando = false;
      state.editando = false;
      await cargar();
    }

    async function guardarUbicacion(lat, lng) {
      try {
        const r = await fetch(`${API}/votante_publico/ubicacion`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, lat, lng, seguimiento: state.seguimientoActivo })
        });
        const d = await r.json();
        if (!state.seguimientoActivo) state.mensaje = d.success ? '✅ Listo, ya compartiste tu ubicación' : '⚠️ ' + (d.error || 'No se pudo guardar');
      } catch (e) { state.mensaje = '⚠️ Error de conexión'; }
    }

    function compartirUbicacion() {
      if (!navigator.geolocation) { state.mensaje = '⚠️ Tu celular no permite compartir ubicación desde este navegador'; render(); return; }
      state.enviando = true; render();
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          await guardarUbicacion(pos.coords.latitude, pos.coords.longitude);
          state.enviando = false;
          state.tapLat = null; state.tapLng = null;
          await cargar();
        },
        (err) => { state.enviando = false; state.mensaje = '⚠️ No pudimos obtener tu ubicación: ' + err.message; render(); },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function iniciarSeguimientoVotante() {
      if (!navigator.geolocation) { state.mensaje = '⚠️ Este navegador no permite seguimiento GPS'; render(); return; }
      if (state.watchId != null) return;
      state.seguimientoActivo = true;
      state.seguimientoExpira = Date.now() + 12 * 60 * 60 * 1000;
      state.mensaje = 'Ubicación actualizada cada 5 minutos mientras la página siga abierta.';
      state.watchId = navigator.geolocation.watchPosition(async (pos) => {
        if (Date.now() >= state.seguimientoExpira) { detenerSeguimientoVotante(); return; }
        if (Date.now() - state.ultimoEnvio < 5 * 60 * 1000) return;
        await guardarUbicacion(pos.coords.latitude, pos.coords.longitude);
        state.ultimoEnvio = Date.now();
      }, (err) => {
        state.mensaje = 'No se pudo actualizar el GPS: ' + err.message;
        if (err.code === err.PERMISSION_DENIED) detenerSeguimientoVotante();
      }, { enableHighAccuracy: true, maximumAge: 5 * 60 * 1000, timeout: 20000 });
      state.intervaloSeguimiento = setInterval(() => {
        if (Date.now() >= state.seguimientoExpira) { detenerSeguimientoVotante(); return; }
        if (!navigator.geolocation || Date.now() - state.ultimoEnvio < 5 * 60 * 1000) return;
        navigator.geolocation.getCurrentPosition(async pos => {
          if (!state.seguimientoActivo) return;
          await guardarUbicacion(pos.coords.latitude, pos.coords.longitude);
          state.ultimoEnvio = Date.now();
        }, () => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
      }, 15000);
      render();
    }

    function detenerSeguimientoVotante() {
      if (state.watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(state.watchId);
      if (state.intervaloSeguimiento) clearInterval(state.intervaloSeguimiento);
      state.intervaloSeguimiento = null;
      state.watchId = null;
      state.seguimientoActivo = false;
      state.seguimientoExpira = 0;
      state.mensaje = 'Seguimiento GPS detenido.';
      render();
    }

    // Tocar/arrastrar el pin en el mapa, para cuando el GPS automático no da justo en el
    // punto donde te vas a esperar (o el navegador no da permiso de ubicación).
    function marcarEnMapa(lat, lng) {
      state.tapLat = lat; state.tapLng = lng;
      render();
      setTimeout(initMapa, 50);
    }

    async function confirmarUbicacionMapa() {
      if (state.tapLat == null) return;
      state.confirmando = true; render();
      await guardarUbicacion(state.tapLat, state.tapLng);
      state.confirmando = false;
      state.tapLat = null; state.tapLng = null;
      await cargar();
    }

    function hayAlgoParaElMapa(d) {
      return d.local_lat != null || d.votante_lat != null || !!d.conductor || state.tapLat != null || (d.local_nombre && d.local_nombre !== '');
    }

    function initMapa() {
      const el = document.getElementById('mapa');
      if (!el || typeof L === 'undefined' || !state.datos) return;
      const d = state.datos;
      const tieneLocal = d.local_lat != null;
      const tienePin = state.tapLat != null || d.votante_lat != null;
      const pinLat = state.tapLat != null ? state.tapLat : d.votante_lat;
      const pinLng = state.tapLat != null ? state.tapLng : d.votante_lng;
      const tieneConductor = !!d.conductor;
      const tieneNombreLocal = d.local_nombre && d.local_nombre !== '';

      // Mostrar mapa si hay cualquier dato útil
      if (!tieneLocal && !tienePin && !tieneConductor && !tieneNombreLocal) return;

      // Centro: local > votante > conductor > Asunción por defecto
      const centro = tieneLocal ? [d.local_lat, d.local_lng]
                    : tienePin ? [pinLat, pinLng]
                    : tieneConductor ? [d.conductor.lat, d.conductor.lng]
                    : [-25.2637, -57.5759]; // Asunción

      if (!mapa) {
        mapa = L.map('mapa').setView(centro, tieneLocal || tienePin ? 16 : 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapa);
        mapa.on('click', (e) => marcarEnMapa(e.latlng.lat, e.latlng.lng));
      }

      // Marcador del local de votación (verde)
      if (tieneLocal) {
        const p = [d.local_lat, d.local_lng];
        if (marcadorLocal) marcadorLocal.setLatLng(p);
        else marcadorLocal = L.marker(p, { icon: L.divIcon({ className: '', html: '<div style="background:#22c55e;width:16px;height:16px;border-radius:4px;border:2px solid #09090b;display:flex;align-items:center;justify-content:center;"></div>', iconSize: [16, 16] }) })
          .addTo(mapa).bindPopup(d.local_nombre ? `🏫 ${d.local_nombre}` : '🏫 Tu local de votación');
      } else if (tieneNombreLocal) {
        // Sin coordenadas: mostrar un marcador arrastrable genérico
        if (!marcadorLocal) {
          marcadorLocal = L.marker(centro, { draggable: true }).addTo(mapa).bindPopup(`🏫 ${d.local_nombre} (arrastrá el pin al lugar exacto)`);
          marcadorLocal.on('dragend', () => { const ll = marcadorLocal.getLatLng(); marcarEnMapa(ll.lat, ll.lng); });
        }
      }

      // Marcador del votante
      if (tienePin) {
        const p = [pinLat, pinLng];
        if (marcadorVotante) marcadorVotante.setLatLng(p);
        else {
          marcadorVotante = L.marker(p, { draggable: true }).addTo(mapa).bindPopup('Vos (arrastrame si no es exacto)');
          marcadorVotante.on('dragend', () => { const ll = marcadorVotante.getLatLng(); marcarEnMapa(ll.lat, ll.lng); });
        }
      }

      // Marcador del conductor
      if (tieneConductor) {
        const p = [d.conductor.lat, d.conductor.lng];
        if (marcadorConductor) marcadorConductor.setLatLng(p);
        else marcadorConductor = L.marker(p, { icon: L.divIcon({ className: '', html: '<div style="background:#dfc07b;width:14px;height:14px;border-radius:50%;border:2px solid #09090b;"></div>' }) }).addTo(mapa).bindPopup('Tu conductor');
      }

      // La pantalla muestra ubicaciones puntuales; no dibuja el trayecto.
      const puntos = [];
      if (tienePin) puntos.push([pinLat, pinLng]);
      if (tieneLocal) puntos.push([d.local_lat, d.local_lng]);
      if (puntos.length > 1) mapa.fitBounds(puntos, { padding: [30, 30] });
    }

    function iniciarPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(cargar, 20000);
    }

    window.addEventListener('pagehide', () => {
      if (state.watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(state.watchId);
    });

    function render() {
      const app = document.getElementById('app');
      if (state.cargando) {
        app.innerHTML = `<div class="text-center py-20"><i class="fas fa-spinner fa-spin text-3xl text-amber-400"></i></div>`;
        return;
      }
      if (state.error) {
        app.innerHTML = `
          <div class="text-center py-16 fade-in">
            <i class="fas fa-link-slash text-4xl text-slate-600 mb-3"></i>
            <p class="text-slate-400 font-bold">${state.error}</p>
          </div>`;
        return;
      }
      const d = state.datos;
      const yaComparti = d.votante_lat != null;
      // El polling vuelve a escribir todo el HTML, lo que destruye el <div id="mapa">
      // anterior; si no se limpia la instancia de Leaflet, initMapa() la deja intacta
      // pero apuntando a un contenedor que ya no existe y el mapa nunca se vuelve a pintar.
      if (mapa) { mapa.remove(); mapa = null; marcadorVotante = null; marcadorConductor = null; marcadorLocal = null; linea = null; }
      app.innerHTML = `
        <div class="fade-in">
          <div class="text-center mb-6">
            <div class="w-14 h-14 mx-auto mb-2 rounded-2xl bg-gradient-to-br from-amber-500/20 to-black border border-amber-500/40 flex items-center justify-center">
              <i class="fas fa-car text-amber-400 text-xl"></i>
            </div>
            <h1 class="text-lg font-black uppercase tracking-tight">DIA D <span class="text-amber-400">MASTER</span></h1>
            <p class="text-slate-400 text-xs">Te vamos a ayudar a llegar a votar</p>
          </div>

          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-4">
            <p class="text-sm text-slate-400">Hola,</p>
            <p class="text-xl font-black mb-3">${d.nombre || ''}</p>
            <div class="grid grid-cols-2 gap-2 text-center mb-3">
              <div class="bg-slate-950 rounded-xl p-2.5"><p class="text-lg font-black">${d.mesa || '—'}</p><p class="text-[10px] text-slate-500 uppercase font-bold">Mesa</p></div>
              <div class="bg-slate-950 rounded-xl p-2.5"><p class="text-lg font-black">${d.orden || '—'}</p><p class="text-[10px] text-slate-500 uppercase font-bold">Orden</p></div>
            </div>
            ${d.local_nombre ? `<p class="text-xs text-slate-400"><i class="fas fa-map-marker-alt text-amber-500 mr-1"></i>${d.local_nombre}</p>` : ''}

            ${!state.editando ? `
              <div class="mt-3 bg-amber-500/10 border border-amber-500/30 rounded-xl p-3">
                <div class="flex items-center justify-between">
                  <p class="text-[10px] text-amber-400 font-bold uppercase">Te pasan a buscar</p>
                  <button onclick="abrirEdicion()" class="text-[10px] font-bold text-amber-300 hover:text-amber-100"><i class="fas fa-pen mr-1"></i>Cambiar</button>
                </div>
                ${d.fecha_recogida ? `<p class="text-xs text-amber-200/80 text-center mt-1"><i class="far fa-calendar-alt mr-1"></i>${formatearFecha(d.fecha_recogida)}</p>` : ''}
                <p class="text-2xl font-black text-amber-300 text-center">${d.hora_recogida || 'A confirmar'}</p>
                ${d.ubicacion ? `<p class="text-xs text-amber-200/80 text-center mt-1"><i class="fas fa-map-marker-alt mr-1"></i>${d.ubicacion}</p>` : ''}
              </div>
            ` : `
              <div class="mt-3 bg-slate-950 border border-slate-700 rounded-xl p-3 space-y-2">
                <p class="text-[10px] text-slate-400 font-bold uppercase">Pedir otra hora / lugar</p>
                <input id="editHora" type="time" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-bold text-white">
                <input id="editUbicacion" type="text" placeholder="Dirección donde te pasamos a buscar" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-bold text-white">
                <div class="flex gap-2">
                  <button onclick="cerrarEdicion()" class="flex-1 py-2.5 bg-slate-800 text-slate-300 font-bold rounded-lg text-xs">Cancelar</button>
                  <button onclick="guardarCambioHoraLugar()" ${state.guardando ? 'disabled' : ''} class="flex-1 py-2.5 bg-amber-500 text-slate-950 font-black rounded-lg text-xs disabled:opacity-50">
                    ${state.guardando ? '<i class="fas fa-spinner fa-spin"></i>' : 'Guardar'}
                  </button>
                </div>
              </div>
            `}
            ${d.dirigente_nombre ? `<p class="text-[11px] text-slate-500 mt-2">Tu contacto: ${d.dirigente_nombre}</p>` : ''}
          </div>

          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
            <p class="text-sm font-bold mb-2"><i class="fas fa-location-dot text-amber-400 mr-1"></i>Compartí dónde estás</p>
            <p class="text-xs text-slate-400 mb-3">Así sabemos exactamente dónde pasar a buscarte.</p>
            <button onclick="compartirUbicacion()" ${state.enviando ? 'disabled' : ''}
              class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black rounded-xl text-sm disabled:opacity-50">
              ${state.enviando ? '<i class="fas fa-spinner fa-spin mr-1"></i>Obteniendo ubicación...' : (yaComparti ? '<i class="fas fa-rotate mr-1"></i>Actualizar mi ubicación' : '<i class="fas fa-location-crosshairs mr-1"></i>Compartir mi ubicación')}
            </button>
            ${state.mensaje ? `<p class="text-xs text-center mt-2 font-bold">${state.mensaje}</p>` : ''}
          </div>

          ${d.conductor && d.conductor.activo ? `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4"><p class="text-sm font-bold mb-1"><i class="fas fa-satellite-dish text-amber-400 mr-1"></i>Seguimiento del traslado</p><p class="text-xs text-slate-400 mb-3">Comparte GPS mientras mantengas abierta esta página. Si el conductor deja de reportar ubicación, mostraremos un aviso.</p><button onclick="${state.seguimientoActivo ? 'detenerSeguimientoVotante()' : 'iniciarSeguimientoVotante()'}" class="w-full py-3 ${state.seguimientoActivo ? 'bg-rose-700' : 'bg-emerald-700'} text-white font-black rounded-xl text-sm">${state.seguimientoActivo ? 'Detener seguimiento GPS' : 'Activar seguimiento GPS'}</button></div>` : ''}

          ${d.seguimiento?.estado === 'conductor_sin_senal' ? `<div role="alert" class="bg-rose-950 border border-rose-700 rounded-2xl p-4 mb-4"><p class="text-sm font-black text-rose-300"><i class="fas fa-triangle-exclamation mr-1"></i>Atención: el conductor dejó de reportar GPS</p><p class="text-xs text-rose-100 mt-1">Última señal hace ${Math.max(1, Math.round((d.seguimiento.segundos_sin_gps || 0) / 60))} min. Si estás esperando el traslado, contactá a tu dirigente.</p></div>` : ''}
          ${d.seguimiento?.estado === 'ubicaciones_coinciden' ? `<div class="bg-emerald-950 border border-emerald-800 rounded-2xl p-3 mb-4"><p class="text-xs font-bold text-emerald-300"><i class="fas fa-location-dot mr-1"></i>Ambos teléfonos reportan posiciones cercanas (${d.seguimiento.distancia_km} km)</p></div>` : ''}
          <button onclick="compartirUbicacionYDestino()" class="w-full py-3 mb-4 bg-sky-800 hover:bg-sky-700 text-white font-black rounded-xl text-sm"><i class="fas fa-share-nodes mr-2"></i>Compartir ubicación y destino</button>
          ${d.conductor ? `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
              <p class="text-sm font-bold mb-1"><i class="fas fa-car-side text-amber-400 mr-1"></i>Tu conductor: ${d.conductor.nombre || ''}</p>
              <p class="text-xs text-slate-400">${d.conductor.placa || ''}</p>
              ${d.seguimiento ? `<p class="text-xs text-amber-300 mt-1">Distancia entre últimas ubicaciones: ${d.seguimiento.distancia_km} km · ${d.seguimiento.estado === 'conductor_sin_senal' ? 'GPS del conductor detenido' : d.seguimiento.estado === 'ubicaciones_coinciden' ? 'posiciones cercanas' : d.seguimiento.estado === 'ubicaciones_separadas' ? 'posiciones separadas' : 'sin traslado activo'}</p>` : (yaComparti ? `<p class="text-xs text-amber-300 mt-1">Distancia aprox. en línea recta: ${distanciaKm(d.votante_lat, d.votante_lng, d.conductor.lat, d.conductor.lng)} km</p>` : '')}
            </div>
          ` : (yaComparti ? `<p class="text-xs text-slate-500 text-center mb-4">Todavía no te asignaron conductor. En cuanto lo tengas, lo vas a ver acá.</p>` : '')}

          ${hayAlgoParaElMapa(d) ? `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
            <p class="text-sm font-bold mb-1"><i class="fas fa-map-location-dot text-amber-400 mr-1"></i>Tocá el mapa donde te vamos a buscar</p>
            <p class="text-xs text-slate-400 mb-3">${d.local_nombre ? `🟩 ${d.local_nombre} (tu colegio) · ` : ''}Tocá o arrastrá el pin para marcar el lugar exacto.</p>
            <div id="mapa" style="height:260px;border-radius:16px;overflow:hidden;"></div>
            ${state.tapLat != null ? `
            <button onclick="confirmarUbicacionMapa()" ${state.confirmando ? 'disabled' : ''}
              class="w-full mt-3 py-3 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black rounded-xl text-sm disabled:opacity-50">
              ${state.confirmando ? '<i class="fas fa-spinner fa-spin mr-1"></i>Guardando...' : '<i class="fas fa-check mr-1"></i>Confirmar esta ubicación'}
            </button>
            ` : ''}
          </div>
          ` : ''}

          <p class="text-center text-[10px] text-slate-600">La ubicación compartida se actualiza cada 5 minutos hasta 12 horas, mientras el teléfono y la página permanezcan activos. No compartimos el trayecto.</p>
        </div>`;
    }

    cargar().then(iniciarPolling);
  </script>
</body>
</html>
