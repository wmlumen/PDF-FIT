<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DIA D MASTER - Admin General</title>
  <script src="vendor/tailwind.js"></script>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <script src="vendor/leaflet/leaflet.js"></script>
  <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="party_theme.js"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .card { @apply bg-white rounded-2xl p-4 shadow-md border border-slate-100 transition-all; }
    .card:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
    .stat-value { @apply text-2xl md:text-3xl font-black; }
    .stat-label { @apply text-[10px] font-black uppercase tracking-wider; }
    .btn-primary { @apply px-4 py-2 bg-amber-500 hover:bg-amber-600 text-black font-bold rounded-xl text-xs transition-all; }
    .btn-danger { @apply px-4 py-2 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl text-xs transition-all; }
    .btn-secondary { @apply px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-xl text-xs transition-all; }
    .input { @apply w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500; }
    .badge { @apply px-2 py-0.5 rounded-full text-[10px] font-bold; }
    .badge-green { @apply bg-green-100 text-green-700; }
    .badge-red { @apply bg-red-100 text-red-700; }
    .badge-amber { @apply bg-amber-100 text-amber-700; }
    .badge-slate { @apply bg-slate-100 text-slate-600; }
    .tab-btn { @apply px-3 py-1.5 rounded-xl text-[10px] font-black transition-all whitespace-nowrap cursor-pointer; }
    .admin-nav .tab-btn { flex: 0 0 auto; text-align: left; }
    @media (min-width: 1024px) { .admin-nav .tab-btn { width: 100%; white-space: normal; padding: .65rem .75rem; } }
    @media (min-width: 1024px) {
      .admin-nav .tab-active { background: #0f172a; color: #fcd34d; }
      .admin-nav .tab-inactive { background: transparent; color: #475569; }
      .admin-nav .tab-inactive:hover { background: #f1f5f9; color: #0f172a; }
    }
    .admin-nav { border: 0 !important; box-shadow: none !important; }
    .admin-nav-group { border: 1px solid #e2e8f0; border-radius: .9rem; background: #fff; overflow: hidden; }
    .admin-nav-group summary { list-style: none; cursor: pointer; }
    .admin-nav-group summary::-webkit-details-marker { display: none; }
    .admin-nav-group[open] summary { border-bottom: 1px solid #f1f5f9; }
    .admin-nav-group .tab-btn { width: 100%; text-align: left; border-radius: .65rem; padding: .6rem .7rem; color: #475569; font-size: 11px; }
    .admin-nav-group .tab-btn:hover { background: #f1f5f9; color: #0f172a; }
    .admin-nav-group .tab-btn.tab-active { background: #0f172a; color: #fcd34d; }
    .tab-active { @apply bg-white text-slate-900; }
    .tab-inactive { @apply bg-slate-800/50 text-slate-300 hover:bg-slate-700; }
    table.admin-table { @apply w-full text-xs; }
    table.admin-table th { @apply text-left py-2 px-3 bg-slate-50 border-b border-slate-200 font-black uppercase tracking-wider text-[10px] text-slate-500; }
    table.admin-table td { @apply py-2 px-3 border-b border-slate-100; }
    table.admin-table tr:hover td { @apply bg-slate-50; }
  </style>
  <link rel="stylesheet" id="tema-cliente" href="tema-cliente.css">
</head>
<body>
  <div id="app"></div>
  <script src="config.js"></script>
    <script src="auth.js"></script>
  <script>
    const API_URL = '/api';

    let state = {
      autenticado: isLoggedIn(),
      usuario: getSessionUser(),
      cargando: false,
      mensaje: '',
      msgTipo: 'info',
      loginCargando: false,
      loginError: '',
      tab: 'dashboard',
      // Datos
      stats: null,
      jerarquia: null,
      estadisticasGenerales: null,
      estadoSistema: null,
      // Usuarios
      usuarios: [],
      usuarioEditando: null,
      rolesDisponibles: [],
      permisos: [],
      sesiones: [],
      sesionesCargando: false,
      seguridadEstado: null,
      // Candidatos
      candidatosAgrupados: [],
      candidatoBusqueda: { departamento: '', distrito: '', partido: '', cargo: '' },
      departamentos: [],
      distritos: [],
      // Partidos
      partidos: [],
      partidoSeleccionado: null,
      // Geografia
      unidades: [],
      circunscripciones: [],
      // CRM
      clientes: [],
      clienteDetalle: null,
      clienteBusqueda: '',
      clienteEstado: 'todos',
      // Elecciones
      elecciones: [],
      tiposEleccion: [],
      eleccionProcesando: false,
      eleccionesVista: sessionStorage.getItem('admin_elecciones_vista') || 'tarjetas',
      // Transporte
      transportes: [],
      rutas: [],
      solicitudesRecogida: [],
      // Veedores
      veedores: [],
      mesas: [],
      // Gamificacion
      puestosComando: [],
      ranking: [],
      // Padron
      padronResultados: [],
      // Auditoria
      auditoria: [],
      // UI helpers
      modal: null,
      modalData: null,
    };

    // ============ LOGIN ============
    async function login() {
      const ced = limpiarCedula(document.getElementById('cedulaLogin')?.value || '');
      const pw = document.getElementById('passwordLogin')?.value || '';
      if (!ced || !pw) { state.loginError = !ced ? 'Ingresá tu cédula para continuar.' : 'Ingresá tu contraseña para continuar.'; render(); document.getElementById(!ced ? 'cedulaLogin' : 'passwordLogin')?.focus(); return; }
      if (state.loginCargando) return;
      state.loginCargando = true; state.loginError = ''; render();
      try {
        const d = await apiPost('login', { cedula: ced, password: pw });
        if (d.success && d.usuario) {
          sessionStorage.setItem('user_pw', pw);
          if (d.usuario.session_id) sessionStorage.setItem('dia_d_session_id', d.usuario.session_id);
          state.usuario = d.usuario;
          state.autenticado = true;
          sessionStorage.setItem(AUTH_SHARED_KEY, JSON.stringify(state.usuario));
          await cargaInicial();
        } else {
          state.loginError = d.error || 'No se pudo validar el acceso. Revisá las credenciales.';
        }
      } catch(e) { state.loginError = e.message || 'No se pudo conectar con el sistema.'; }
      finally { state.loginCargando = false; if (!state.autenticado) render(); }
    }

    function alternarVisibilidadClave() {
      const input = document.getElementById('passwordLogin');
      const boton = document.getElementById('mostrarClaveLogin');
      if (!input || !boton) return;
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      boton.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
      boton.innerHTML = `<i class="fas fa-eye${visible ? '-slash' : ''}"></i>`;
      input.focus();
    }

    // ============ CARGA INICIAL ============
    async function cargaInicial() {
      state.cargando = true; state.mensaje = ''; state.msgTipo = 'info'; render();
      try {
        const statsData = await apiGet('dashboard');
        state.stats = statsData;
      } catch(e) {
        if (e.status === 401) {
          state.autenticado = false; state.usuario = null;
          state.loginError = 'Tu sesión venció. Iniciá sesión nuevamente.';
          sessionStorage.removeItem(AUTH_SHARED_KEY); sessionStorage.removeItem('dia_d_session_id'); sessionStorage.removeItem('user_pw');
        } else { state.mensaje = 'No se pudo cargar el resumen: ' + e.message; state.msgTipo = 'error'; }
      }
      state.cargando = false; render();
      if (state.autenticado) {
        cargarEstadoSistema().then(() => render());
        cargarEstadisticasGenerales().then(() => render()).catch(e => {
          if (e.status === 401) {
            state.autenticado = false; state.usuario = null;
            state.loginError = 'Tu sesión venció. Iniciá sesión nuevamente.';
            sessionStorage.removeItem(AUTH_SHARED_KEY); sessionStorage.removeItem('dia_d_session_id'); sessionStorage.removeItem('user_pw');
          } else { state.mensaje = 'El resumen general no se pudo cargar: ' + e.message; state.msgTipo = 'error'; }
          render();
        });
      }
    }

    function sessionHeaders() {
      const u = getSessionUser() || state.usuario;
      const sid = u?.session_id || sessionStorage.getItem('dia_d_session_id') || '';
      return sid ? { 'x-session-id': sid } : {};
    }

    function authPayload(body = {}) {
      const u = getSessionUser() || state.usuario;
      if (!u) return body;
      return { ...body, cedula_auth: u.cedula, password_auth: sessionStorage.getItem('user_pw') || '', session_id: u.session_id || sessionStorage.getItem('dia_d_session_id') || '' };
    }

    async function respuestaApi(r) {
      const txt = await r.text();
      const ct = (r.headers.get('content-type') || '').toLowerCase();
      if (ct.includes('text/html') || txt.trim().startsWith('<!doctype')) throw new Error('El servidor devolvió una página en vez de datos. Recargá e intentá otra vez.');
      let data;
      try { data = JSON.parse(txt); } catch { throw new Error('Respuesta inválida del servidor.'); }
      if (!r.ok) { const error = new Error(data.detail || data.error || `Error HTTP ${r.status}`); error.status = r.status; throw error; }
      return data;
    }

    // ============ API HELPERS ============
    async function apiGet(action) {
      const [actionName, ...queryParts] = String(action).split('&');
      const params = new URLSearchParams({ action: actionName });
      queryParts.forEach(part => { const [key, ...valueParts] = part.split('='); if (key) params.set(key, valueParts.join('=')); });
      params.set('v', String(Date.now()));
      const r = await fetch(API_URL + '?' + params.toString(), { headers: sessionHeaders() });
      return respuestaApi(r);
    }

    async function apiPost(action, body) {
      const u = getSessionUser();
      const auth = u ? { cedula_auth: u.cedula, password_auth: sessionStorage.getItem('user_pw') || '', session_id: u.session_id || sessionStorage.getItem('dia_d_session_id') || '' } : {};
      const r = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...sessionHeaders() },
        body: JSON.stringify({ action, ...auth, ...body })
      });
      return respuestaApi(r);
    }

    async function apiGetRuta(ruta) {
      const r = await fetch(ruta + (ruta.includes('?') ? '&' : '?') + 'v=' + Date.now(), { headers: sessionHeaders() });
      return respuestaApi(r);
    }

    async function apiPostRuta(ruta, body) {
      const r = await fetch(ruta, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...sessionHeaders() },
        body: JSON.stringify(authPayload(body))
      });
      return respuestaApi(r);
    }

    // ============ HELPERS ============
    function limpiarCedula(c) { return (c || '').replace(/[.\s,-]/g, '').trim(); }
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function n(v) { return v || 0; }
    function fmt(v) { return n(v).toLocaleString('es-PY'); }

    // ============ ESTADISTICAS ============
    async function cargarEstadisticasGenerales() {
      try {
        const d = await apiGetRuta('/api/admin/estadisticas_generales');
        state.estadisticasGenerales = d;
      } catch(e) {
        state.estadisticasGenerales = null;
        if (e.status === 401) throw e;
        state.mensaje = 'El resumen general no se pudo cargar: ' + e.message;
        state.msgTipo = 'error';
      }
    }

    async function cargarEstadoSistema() {
      try {
        state.estadoSistema = await apiGetRuta('/api/health');
      } catch (e) {
        state.estadoSistema = { status: 'error', detail: e.message };
      }
    }

    // ============ RENDER PRINCIPAL ============
    function render() {
      const app = document.getElementById('app');
      if (!state.autenticado) { app.innerHTML = renderLogin(); return; }
      app.innerHTML = renderDashboard();
      if (state.tab === 'mapa') requestAnimationFrame(() => initMapa());
    }

    function renderLogin() {
      return `
        <main class="min-h-screen bg-slate-950 text-white lg:grid lg:grid-cols-[1.05fr_.95fr]">
          <section class="relative hidden min-h-screen overflow-hidden border-r border-white/10 bg-[radial-gradient(ellipse_at_25%_20%,rgba(245,158,11,.16),transparent_45%),linear-gradient(145deg,#020617,#111827_65%,#0f172a)] p-12 lg:flex lg:flex-col lg:justify-between xl:p-16">
            <div><div class="flex items-center gap-3"><span class="flex h-11 w-11 items-center justify-center rounded-xl border border-amber-400/30 bg-amber-400/10"><i class="fas fa-shield-alt text-amber-300"></i></span><span class="text-sm font-black tracking-[.18em]">DIA D MASTER</span></div>
              <div class="mt-28 max-w-lg"><p class="text-xs font-bold uppercase tracking-[.22em] text-amber-300">Centro de control electoral</p><h1 class="mt-4 text-4xl font-black leading-tight xl:text-5xl">Coordinación clara para cada jornada.</h1><p class="mt-5 max-w-md text-sm leading-6 text-slate-300">Administrá equipos, territorio y operación desde un único espacio de trabajo.</p>
                <div class="mt-10 grid max-w-md grid-cols-2 gap-3"><div class="rounded-2xl border border-white/10 bg-white/[.04] p-4"><i class="fas fa-users text-amber-300"></i><p class="mt-3 text-xs font-bold">Equipos y clientes</p><p class="mt-1 text-[11px] text-slate-400">Accesos organizados por función</p></div><div class="rounded-2xl border border-white/10 bg-white/[.04] p-4"><i class="fas fa-map-marked-alt text-amber-300"></i><p class="mt-3 text-xs font-bold">Operación territorial</p><p class="mt-1 text-[11px] text-slate-400">Información en un mismo panel</p></div></div>
              </div>
            </div><p class="text-[10px] text-slate-500">Acceso institucional · Sesión protegida</p>
          </section>
          <section class="flex min-h-screen items-center justify-center bg-slate-50 px-5 py-10 text-slate-900 sm:px-8">
            <div class="w-full max-w-md">
              <div class="mb-8 lg:hidden"><span class="inline-flex h-11 w-11 items-center justify-center rounded-xl bg-slate-900 text-amber-300"><i class="fas fa-shield-alt"></i></span><p class="mt-4 text-xs font-black tracking-[.18em] text-slate-500">DIA D MASTER</p></div>
              <div class="mb-7"><p class="text-xs font-bold uppercase tracking-widest text-amber-700">Administración General</p><h2 class="mt-2 text-2xl font-black tracking-tight sm:text-3xl">Ingresar al panel</h2><p class="mt-2 text-sm text-slate-500">Usá tus credenciales institucionales para continuar.</p></div>
              <form class="rounded-2xl border border-slate-200 bg-white p-5 shadow-xl shadow-slate-900/5 sm:p-7" onsubmit="event.preventDefault();login()">
                <div class="space-y-5">
                  <div><label for="cedulaLogin" class="mb-1.5 block text-xs font-bold text-slate-700">Cédula</label><div class="relative"><i class="fas fa-id-card absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i><input id="cedulaLogin" name="username" type="text" inputmode="numeric" autocomplete="username" autocapitalize="off" spellcheck="false" class="input !py-3 !pl-10" placeholder="Número de cédula" autofocus required ${state.loginCargando ? 'disabled' : ''}></div></div>
                  <div><label for="passwordLogin" class="mb-1.5 block text-xs font-bold text-slate-700">Contraseña</label><div class="relative"><i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i><input id="passwordLogin" name="password" type="password" autocomplete="current-password" class="input !py-3 !pl-10 !pr-12" placeholder="Tu contraseña" required ${state.loginCargando ? 'disabled' : ''}><button id="mostrarClaveLogin" type="button" onclick="alternarVisibilidadClave()" aria-label="Mostrar contraseña" class="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg px-3 py-2 text-slate-500 hover:bg-slate-100 hover:text-slate-900" ${state.loginCargando ? 'disabled' : ''}><i class="fas fa-eye"></i></button></div></div>
                  <p class="min-h-5 rounded-lg text-xs ${state.loginError ? 'bg-rose-50 p-2 text-rose-700' : 'text-slate-500'}" role="alert" aria-live="polite">${escapeHtml(state.loginError || (state.loginCargando ? 'Verificando credenciales…' : 'Acceso reservado a personal autorizado.'))}</p>
                  <button type="submit" ${state.loginCargando ? 'disabled' : ''} class="flex w-full items-center justify-center gap-2 rounded-xl bg-slate-950 px-4 py-3.5 text-sm font-black text-amber-300 shadow-lg shadow-slate-900/10 transition hover:bg-slate-800 focus:outline-none focus:ring-4 focus:ring-amber-400/30 disabled:cursor-wait disabled:opacity-60"><i class="fas ${state.loginCargando ? 'fa-circle-notch fa-spin' : 'fa-arrow-right-to-bracket'}"></i>${state.loginCargando ? 'Verificando…' : 'Ingresar al panel'}</button>
                  <div class="flex items-center justify-center gap-2 text-[10px] text-slate-400"><i class="fas fa-shield-alt"></i>Conexión protegida · No compartas tu contraseña</div>
                </div>
              </form>
              <p class="mt-5 text-center text-xs text-slate-500">¿Problemas para ingresar? Contactá al administrador del sistema.</p>
            </div>
          </section>
        </div>`;
    }

    // ============ DASHBOARD LAYOUT ============
    function renderDashboard() {
      const u = state.usuario;
      return `
        <header class="bg-slate-950 text-white sticky top-0 z-40 shadow-xl border-b border-amber-500/20">
          <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="p-2.5 bg-gradient-to-br from-amber-500/20 to-black border border-amber-500/30 rounded-xl flex-shrink-0">
                <i class="fas fa-shield-alt text-amber-400 text-xl"></i>
              </div>
              <div class="min-w-0">
                <h1 class="text-lg font-black uppercase tracking-tight truncate">${u?.nombre || 'Admin General'}</h1>
                <p class="text-[10px] text-slate-400 font-bold">
                  <i class="fas fa-id-card mr-1"></i>${u?.cedula || ''} ·
                  <span class="text-amber-400 font-black">${(u?.nivel || '').toUpperCase()}</span>
                </p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="window.open('/roles.html','_blank')" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 hover:text-amber-400 border border-slate-700 rounded-xl text-[10px] font-bold transition-all" title="Roles">
                <i class="fas fa-sitemap"></i>
              </button>
              <button onclick="salirAdmin()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 hover:text-amber-400 border border-slate-700 rounded-xl text-xs font-bold transition-all">
                <i class="fas fa-sign-out-alt mr-1"></i> Salir
              </button>
            </div>
          </div>
        </header>
        <div class="max-w-7xl mx-auto px-4 py-4 lg:grid lg:grid-cols-[220px_minmax(0,1fr)] lg:gap-5">
          <nav aria-label="Secciones de administración" class="admin-nav mb-4 grid grid-cols-2 gap-2 sm:grid-cols-3 lg:sticky lg:top-4 lg:mb-0 lg:max-h-[calc(100vh-2rem)] lg:grid-cols-1 lg:content-start lg:overflow-y-auto lg:gap-2">
            ${renderTabs()}
          </nav>
          <main class="min-w-0">
            ${state.mensaje ? `<div role="alert" class="mb-4 flex items-start justify-between gap-3 rounded-xl border ${state.msgTipo==='error'?'border-rose-200 bg-rose-50 text-rose-800':'border-sky-200 bg-sky-50 text-sky-800'} p-3 text-sm"><span><i class="fas fa-circle-exclamation mr-2"></i>${escapeHtml(state.mensaje)}</span><button onclick="cargaInicial()" class="shrink-0 rounded-lg border border-current/20 px-3 py-1 text-xs font-bold">Reintentar</button></div>` : ''}
            ${state.cargando ? `<div class="mb-4 flex items-center gap-3 rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm text-amber-900"><i class="fas fa-circle-notch fa-spin"></i><span>Cargando resumen de la plataforma…</span></div>` : ''}
            ${renderTabContent()}
          </main>
        </div>
        ${renderModal()}
      `;
    }

    function renderTabs() {
      const grupos = [
        { label: 'Resumen', icon: 'fa-chart-pie', ids: ['dashboard'] },
        { label: 'Organización', icon: 'fa-sitemap', ids: ['usuarios', 'clientes', 'partidos', 'candidatos'] },
        { label: 'Territorio y padrón', icon: 'fa-map-marked-alt', ids: ['geografia', 'padron', 'mapa'] },
        { label: 'Operación electoral', icon: 'fa-vote-yea', ids: ['elecciones', 'transporte', 'veedores'] },
        { label: 'Sistema', icon: 'fa-sliders-h', ids: ['aplicaciones', 'gamificacion', 'sesiones', 'auditoria'] },
      ];
      const tabs = [
        { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard' },
        { id: 'usuarios', icon: 'fa-users', label: 'Usuarios' },
        { id: 'clientes', icon: 'fa-handshake', label: 'Clientes CRM' },
        { id: 'partidos', icon: 'fa-flag', label: 'Partidos' },
        { id: 'candidatos', icon: 'fa-user-tie', label: 'Candidatos' },
        { id: 'geografia', icon: 'fa-map-marked-alt', label: 'Geografía' },
        { id: 'padron', icon: 'fa-users', label: 'Padrón' },
        { id: 'mapa', icon: 'fa-map-marker-alt', label: 'Mapa en Vivo' },
        { id: 'elecciones', icon: 'fa-vote-yea', label: 'Elecciones' },
        { id: 'transporte', icon: 'fa-truck', label: 'Transporte' },
        { id: 'veedores', icon: 'fa-eye', label: 'Veedores' },
        { id: 'aplicaciones', icon: 'fa-th-large', label: 'Aplicaciones' },
        { id: 'gamificacion', icon: 'fa-trophy', label: 'Gamificación' },
        { id: 'sesiones', icon: 'fa-shield-alt', label: 'Seguridad y sesiones' },
        { id: 'auditoria', icon: 'fa-clipboard-list', label: 'Auditoría' },
      ];
      const renderTab = t =>
        `<button onclick="switchTab('${t.id}')" aria-current="${state.tab === t.id ? 'page' : 'false'}" class="tab-btn ${state.tab === t.id ? 'tab-active' : 'tab-inactive'} lg:!w-full lg:!text-left lg:!px-3 lg:!py-2.5 lg:!rounded-xl">
          <i class="fas ${t.icon} mr-1"></i>${t.label}
        </button>`;
      return grupos.map((grupo, indice) => {
        const grupoActivo = grupo.ids.includes(state.tab);

      try {

        const p = await apiGetRuta('/api/permisos/lista').catch(() => ({ permisos: [] }));

    function nuevoUsuario() {
      state.modal = 'nuevoUsuario';
      render();
    }

    async function guardarUsuario() {
      const ced = limpiarCedula(document.getElementById('f_cedula')?.value || '');
      const nombre = document.getElementById('f_nombre')?.value || '';
      const email = document.getElementById('f_email')?.value || '';
      const password = document.getElementById('f_password')?.value || '';
      const rol = document.getElementById('f_rol')?.value || '';
      if (!ced || !nombre || !password) { alert('Complete cédula, nombre y contraseña.'); return; }
      try {
        const d = await apiPostRuta('/api/usuarios/crear', { cedula: ced, nombre, email, contrasena: password, roles: rol ? [{ rol }] : [] });
        if (d.success) { alert('Usuario creado.'); state.modal = null; cargarUsuarios(); }
        else alert('Error: ' + (d.error || 'No se pudo crear'));
      } catch(e) { alert('Error: ' + e.message); }
    }

    function editarUsuario(ced) {
      const u = state.usuarios.find(x => x.cedula === ced);
      if (!u) return;
      state.usuarioEditando = u;
      state.modal = 'editarUsuario';
      render();
    }

    async function toggleUsuario(ced, activo) {
      try {
        await apiPostRuta('/api/usuarios/toggle', { cedula: ced, activo: activo ? 1 : 0 });
        await cargarUsuarios();
      } catch(e) { alert('Error: ' + e.message); }
    }

    async function resetearPassword(ced) {
      const np = prompt('Nueva contraseña para ' + ced + ':');
      if (!np) return;
      try {
        await apiPostRuta('/api/usuarios/resetear_password', { cedula: ced, contrasena: np });
        alert('Contraseña actualizada.');
      } catch(e) { alert('Error: ' + e.message); }
    }

        state.departamentos = d.departamentos || [];

      if (!state.partidos.length) cargarPartidos();

    async function guardarCliente() {
      const value = id => document.getElementById(id)?.value?.trim() || '';
      const isEdit = state.modal === 'editarCliente';
      const body = {cedula: isEdit ? state.modalData.cedula : value('f_cliente_cedula'), nombre:value('f_cliente_nombre'),
        apellido:value('f_cliente_apellido'), email:value('f_cliente_email'), telefono:value('f_cliente_telefono'),
        tipo:value('f_cliente_tipo'), categoria:value('f_cliente_categoria'), partido_id:value('f_cliente_partido')||null,
        departamento_id:value('f_cliente_departamento')||null, distrito_id:value('f_cliente_distrito')||null,
        unidad_organizacion_id:value('f_cliente_unidad')||null,
        candidato_nombre:value('f_cliente_candidato'), candidato_cargo:value('f_cliente_cargo'), locales:value('f_cliente_locales')};
      if (!body.nombre || !body.tipo || !body.categoria || (!isEdit && (!body.cedula || !value('f_cliente_password')))) {

        state.modal = null; state.modalData = null;
        await cargarClientes();
        if (isEdit) await verCliente(body.cedula);

      const cliente = state.clientes.find(x => x.cedula === ced) || state.clienteDetalle;

      if (!confirm(`¿Confirmas ${verb} al cliente ${ced}?`)) return;
      try {
        const d = await apiPost('toggle_cliente', {cedula:ced});
        if (!d.success) { alert(d.detail || d.error || 'No se pudo cambiar el estado.'); return; }
        if (state.clienteDetalle?.cedula === ced) state.clienteDetalle.activo = d.activo;

    function nuevaEleccion(datos = {}) {
      const tipos = state.tiposEleccion || [];
      const opciones = tipos.map(t => `<option value="${Number(t.id)}" ${Number(datos.tipo_eleccion_id) === Number(t.id) ? 'selected' : ''}>${escapeHtml(t.nombre)}</option>`).join('');
      const sugerido = datos.nombre || '';
      const contenido = `<form id="formEleccion" class="space-y-3" onsubmit="event.preventDefault();guardarEleccion()"><label class="block text-xs font-bold">Nombre<input id="eleccionNombre" class="input mt-1" required maxlength="120" value="${escapeHtml(sugerido)}" placeholder="Ej.: Elecciones Municipales 2026"></label><label class="block text-xs font-bold">Tipo<select id="eleccionTipo" class="input mt-1" required>${opciones}</select></label><label class="block text-xs font-bold">Período<input id="eleccionPeriodo" class="input mt-1" maxlength="30" value="${escapeHtml(datos.periodo || '')}" placeholder="2026-2031"></label><label class="block text-xs font-bold">Fecha<input id="eleccionFecha" type="date" class="input mt-1" value="${escapeHtml(datos.fecha_eleccion || '')}"></label><p class="text-[11px] text-slate-500">Las internas son eventos separados. Puedes crear una interna por partido luego de crear la elección principal.</p><div class="flex justify-end gap-2 pt-2"><button type="button" onclick="state.modal=null;render()" class="btn-secondary">Cancelar</button><button class="btn-primary" ${state.eleccionProcesando ? 'disabled' : ''}>${state.eleccionProcesando ? 'Guardando…' : 'Guardar elección'}</button></div></form>`;
      abrirModal('Nueva elección', contenido);
    }

    async function guardarEleccion() {
      if (state.eleccionProcesando) return;
      const payload = { nombre: document.getElementById('eleccionNombre')?.value.trim(), tipo_eleccion_id: Number(document.getElementById('eleccionTipo')?.value), periodo: document.getElementById('eleccionPeriodo')?.value.trim(), fecha_eleccion: document.getElementById('eleccionFecha')?.value, estado: 'previa', activo: true };
      state.eleccionProcesando = true;
      try {
        const d = await apiPostRuta('/api/elecciones/crear', payload);
        if (!d.success) throw new Error(d.error || 'No se pudo crear la elección');
        state.modal = null; state.mensaje = 'Elección creada.'; state.msgTipo = 'info'; await cargarElecciones();
      } catch (e) { alert('No se pudo crear la elección: ' + e.message); }
      finally { state.eleccionProcesando = false; render(); }
    }

    async function duplicarEleccion(id) {
      const original = state.elecciones.find(e => Number(e.id) === Number(id));
      if (!original) return;
      nuevaEleccion({ ...original, nombre: `${original.nombre} (copia)` , fecha_eleccion: '' });
    }

    async function toggleEleccion(id) {
      const e = state.elecciones.find(x => Number(x.id) === Number(id));
      if (!e) return;
      const accion = Number(e.activo) ? 'bloquear' : 'habilitar';
      if (!confirm(`¿${accion[0].toUpperCase() + accion.slice(1)} “${e.nombre}”?`)) return;
      try {
        const d = await apiPostRuta(`/api/elecciones/${id}/estado`, { activo: !Number(e.activo) });
        if (!d.success) throw new Error(d.error || 'No se pudo cambiar el estado');
        await cargarElecciones();
      } catch (err) { alert('No se pudo actualizar: ' + err.message); }
    }

    async function eliminarEleccion(id) {
      const e = state.elecciones.find(x => Number(x.id) === Number(id));
      if (!e || !confirm(`¿Eliminar “${e.nombre}”? Si tiene resultados u otros datos vinculados, el servidor rechazará el borrado.`)) return;
      try {
        const d = await apiPostRuta(`/api/elecciones/${id}/eliminar`, {});
        if (!d.success) throw new Error(d.error || 'No se pudo eliminar');
        await cargarElecciones();
      } catch (err) { alert('No se pudo eliminar: ' + err.message); }
    }

    async function cargarElecciones() {
      try {
        const d = await apiGet('elecciones');
        state.elecciones = d.elecciones || d || [];
        const t = await apiGet('tipos_eleccion').catch(() => ({ tipos_eleccion: [] }));
        state.tiposEleccion = t.tipos || t.tipos_eleccion || [];
      } catch(e) { state.elecciones = []; state.mensaje = 'No se pudieron cargar las elecciones: ' + e.message; state.msgTipo = 'error'; }
      render();
    }

        const response = await fetch('/api/auditoria/exportar', { headers: sessionHeaders() });
        if (!response.ok) throw new Error(`Error HTTP ${response.status}`);
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a'); link.href = url; link.download = 'auditoria.csv'; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch(e) { alert('Error: ' + e.message); }
    }

    // ============ TAB: MAPA EN VIVO ============
    let mapaLeaflet = null;
    let marcadores = {};
    let mapaContenedor = null;
    let mapaRefreshTimer = null;
    let capasMapa = { locales: null, conductores: null, votantes: null };
    const mapaCapasVisibles = { locales: true, conductores: true, votantes: true };

    function renderTabMapa() {
      return `
        <div class="fade-in">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-black"><i class="fas fa-map-marker-alt mr-1 text-amber-500"></i> Mapa Geográfico Completo</h2>
            <div class="flex gap-2">
              <span class="badge badge-green" id="mapa-status">Conectando...</span>
              <button onclick="actualizarMapa()" class="btn-secondary"><i class="fas fa-sync-alt mr-1"></i>Actualizar</button>
            </div>
          </div>
          <!-- Controles de capa -->
          <div class="flex flex-wrap gap-2 mb-2">
            <label class="flex items-center gap-1 text-xs font-bold cursor-pointer">
              <input type="checkbox" id="capa-locales" ${mapaCapasVisibles.locales ? 'checked' : ''} onchange="toggleCapa('locales')" class="accent-green-600">
              <span class="w-3 h-3 bg-green-500 rounded-sm inline-block"></span> Locales de votación
            </label>
            <label class="flex items-center gap-1 text-xs font-bold cursor-pointer">
              <input type="checkbox" id="capa-conductores" ${mapaCapasVisibles.conductores ? 'checked' : ''} onchange="toggleCapa('conductores')" class="accent-blue-500">
              <span class="w-3 h-3 bg-blue-500 rounded-full inline-block"></span> Conductores
            </label>
            <label class="flex items-center gap-1 text-xs font-bold cursor-pointer">
              <input type="checkbox" id="capa-votantes" ${mapaCapasVisibles.votantes ? 'checked' : ''} onchange="toggleCapa('votantes')" class="accent-amber-500">
              <span class="w-3 h-3 bg-amber-500 rounded-full inline-block"></span> Votantes con ubicación
            </label>
          </div>
          <div class="card p-0 overflow-hidden">
            <div id="mapa-leaflet" style="width:100%;height:600px;"></div>
          </div>
          <div class="grid grid-cols-3 gap-2 mt-2">
            <div class="card p-2 text-center"><div class="stat-value text-green-600" id="mapa-total-locales">0</div><div class="text-[10px] text-slate-400">Locales</div></div>
            <div class="card p-2 text-center"><div class="stat-value text-blue-600" id="mapa-total-conductores">0</div><div class="text-[10px] text-slate-400">Conductores</div></div>
            <div class="card p-2 text-center"><div class="stat-value text-amber-600" id="mapa-total-votantes">0</div><div class="text-[10px] text-slate-400">Votantes</div></div>
          </div>
          <div class="card mt-3">
            <h3 class="text-sm font-black mb-2"><i class="fas fa-list mr-1"></i>Vehículos activos</h3>
            <div class="overflow-x-auto">
              <table class="admin-table">
                <thead><tr><th>Conductor</th><th>Placa</th><th>Estado</th><th>Lat</th><th>Lng</th><th>Velocidad</th><th>Hora</th></tr></thead>
                <tbody id="mapa-tabla">
                  <tr><td colspan="7" class="text-center text-slate-400 py-4"><i class="fas fa-spinner fa-spin mr-1"></i>Cargando...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>`;
    }

    function toggleCapa(tipo) {
      const capa = capasMapa[tipo];
      const control = document.getElementById(`capa-${tipo}`);
      if (!capa || !mapaLeaflet || !control) return;
      mapaCapasVisibles[tipo] = control.checked;
      if (control.checked) mapaLeaflet.addLayer(capa); else mapaLeaflet.removeLayer(capa);
    }

    function initMapa() {
      const contenedor = document.getElementById('mapa-leaflet');
      if (!contenedor || !window.L) return;
      if (mapaLeaflet && mapaContenedor !== contenedor) {
        mapaLeaflet.remove(); mapaLeaflet = null;
        capasMapa = { locales: null, conductores: null, votantes: null };
      }
      if (!mapaLeaflet) {
        mapaLeaflet = L.map(contenedor).setView([-25.2637, -57.5759], 6); // Paraguay
        mapaContenedor = contenedor;
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap'
        }).addTo(mapaLeaflet);
      }
      setTimeout(() => mapaLeaflet?.invalidateSize(), 50);
      actualizarMapa();
      if (!mapaRefreshTimer) mapaRefreshTimer = setInterval(() => {
        if (document.getElementById('mapa-leaflet')) actualizarMapa();
      }, 10000);
    }

    async function actualizarMapa() {
      try {
        const d = await apiGetRuta('/api/mapa/datos_geograficos');
        if (!d.success) throw new Error(d.error || 'Error al cargar datos');
        
        // Actualizar contadores
        document.getElementById('mapa-total-locales').textContent = d.total_locales || 0;
        document.getElementById('mapa-total-conductores').textContent = d.total_conductores || 0;
        document.getElementById('mapa-total-votantes').textContent = d.total_votantes || 0;
        document.getElementById('mapa-status').textContent = 'Actualizado';
        
        // Limpiar capas anteriores
        if (capasMapa.locales) { mapaLeaflet.removeLayer(capasMapa.locales); }
        if (capasMapa.conductores) { mapaLeaflet.removeLayer(capasMapa.conductores); }
        if (capasMapa.votantes) { mapaLeaflet.removeLayer(capasMapa.votantes); }
        
        // Capa 1: Locales de votación (verde)
        const puntosLocales = (d.locales || []).map(l => [l.lat, l.lng]);
        capasMapa.locales = L.layerGroup((d.locales || []).map(l => 
          L.marker([l.lat, l.lng], { icon: L.divIcon({ className: '', html: '<div style="background:#22c55e;width:12px;height:12px;border-radius:3px;border:2px solid #09090b;"></div>', iconSize: [12, 12] }) })
            .bindPopup(`<b>🏫 ${l.nombre}</b><br>${l.direccion || ''}`)
        ));
        
        // Capa 2: Conductores (azul)
        const puntosConductores = (d.conductores || []).map(c => [c.lat, c.lng]);
        capasMapa.conductores = L.layerGroup((d.conductores || []).map(c => 
          L.circleMarker([c.lat, c.lng], { radius: 8, fillColor: '#3b82f6', color: '#1e40af', weight: 2, fillOpacity: 0.8 })
            .bindPopup(`<b>🚗 ${c.nombre}</b><br>Placa: ${c.placa || '—'}<br>Vel: ${c.velocidad || 0} km/h`)
        ));
        
        // Capa 3: Votantes con ubicación (ámbar)
        const puntosVotantes = (d.votantes || []).map(v => [v.lat, v.lng]);
        capasMapa.votantes = L.layerGroup((d.votantes || []).map(v => 
          L.circleMarker([v.lat, v.lng], { radius: 6, fillColor: '#f59e0b', color: '#92400e', weight: 1, fillOpacity: 0.7 })
            .bindPopup(`<b>👤 ${v.nombre}</b><br>CC: ${v.cedula}`)
        ));
        Object.keys(capasMapa).forEach(toggleCapa);
        
        // Ajustar vista a todos los puntos
        const todosLosPuntos = [...puntosLocales, ...puntosConductores, ...puntosVotantes];
        if (todosLosPuntos.length > 0) {
          mapaLeaflet.fitBounds(todosLosPuntos, { padding: [30, 30] });
        }
        
        // Actualizar tabla de vehículos
        const tbody = document.getElementById('mapa-tabla');
        if (tbody && d.conductores) {
          tbody.innerHTML = d.conductores.map(c => `
            <tr>
              <td>${c.nombre || '—'}</td>
              <td>${c.placa || '—'}</td>
              <td>${c.estado || '—'}</td>
              <td>${c.lat?.toFixed(6) || '—'}</td>
              <td>${c.lng?.toFixed(6) || '—'}</td>
              <td>${c.velocidad || 0} km/h</td>
              <td>${c.timestamp || '—'}</td>
            </tr>
          `).join('') || '<tr><td colspan="7" class="text-center text-slate-400 py-4">Sin vehículos activos</td></tr>';
        }
      } catch(e) {
        const status = document.getElementById('mapa-status');
        if (status) { status.textContent = 'Error: ' + e.message; status.className = 'badge badge-red'; }
      }
    }
    // ============ MODAL ============
    function renderModal() {
      if (!state.modal) return '';
      if (state.modal === 'nuevoUsuario') {
        const roles = state.rolesDisponibles.roles || state.rolesDisponibles || [];
        return `
          <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onclick="if(event.target===this){state.modal=null;render();}">
            <div class="bg-white rounded-2xl p-6 w-full max-w-md fade-in">
              <h3 class="font-black text-lg mb-4"><i class="fas fa-user-plus mr-1 text-amber-500"></i>Nuevo Usuario</h3>
              <div class="space-y-3">
                <div><label class="text-xs font-bold">Cédula</label><input id="f_cedula" class="input" placeholder="Cédula"></div>
                <div><label class="text-xs font-bold">Nombre</label><input id="f_nombre" class="input" placeholder="Nombre completo"></div>
                <div><label class="text-xs font-bold">Email</label><input id="f_email" class="input" placeholder="email@ejemplo.com"></div>
                <div><label class="text-xs font-bold">Contraseña</label><input id="f_password" type="password" class="input" placeholder="Contraseña"></div>
                <div><label class="text-xs font-bold">Rol</label>
                  <select id="f_rol" class="input">
                    <option value="">Seleccionar rol</option>
                    ${roles.map(r => `<option value="${r.rol || r.codigo || r}">${r.nombre || r}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="flex gap-2 mt-4">
                <button onclick="guardarUsuario()" class="btn-primary flex-1"><i class="fas fa-save mr-1"></i>Guardar</button>
                <button onclick="state.modal=null;render()" class="btn-secondary flex-1">Cancelar</button>
              </div>
            </div>
          </div>`;
      }
      if (state.modal === 'editarUsuario') {
        const u = state.usuarioEditando || {};
        const roles = state.rolesDisponibles.roles || state.rolesDisponibles || [];
        return `
          <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onclick="if(event.target===this){state.modal=null;render();}">
            <div class="bg-white rounded-2xl p-6 w-full max-w-md fade-in">
              <h3 class="font-black text-lg mb-4"><i class="fas fa-edit mr-1 text-amber-500"></i>Editar Usuario</h3>
              <div class="space-y-3">
                <div><label class="text-xs font-bold">Cédula</label><input class="input" value="${u.cedula || ''}" disabled></div>
                <div><label class="text-xs font-bold">Nombre</label><input id="f_nombre" class="input" value="${u.nombre || ''}"></div>
                <div><label class="text-xs font-bold">Rol</label>
                  <select id="f_rol" class="input">
                    ${roles.map(r => `<option value="${r.rol || r.codigo || r}" ${u.rol === (r.rol || r.codigo || r) ? 'selected' : ''}>${r.nombre || r}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="flex gap-2 mt-4">
                <button onclick="guardarEditarUsuario('${u.cedula}')" class="btn-primary flex-1"><i class="fas fa-save mr-1"></i>Guardar</button>
                <button onclick="state.modal=null;render()" class="btn-secondary flex-1">Cancelar</button>
              </div>
            </div>
          </div>`;
      }
      if (state.modal === 'nuevoCliente' || state.modal === 'editarCliente') {
        const edit = state.modal === 'editarCliente';
        const c = state.modalData || {};
        const input = (id,label,value='',type='text',required=false) => `<label class="block text-[11px] font-bold text-slate-600">${label}${required?' *':''}<input id="${id}" class="input mt-1" type="${type}" value="${escapeHtml(value)}" ${required?'required':''}></label>`;
        return `<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-3" onclick="if(event.target===this){state.modal=null;render();}"><div class="bg-white rounded-2xl p-5 w-full max-w-2xl max-h-[92vh] overflow-y-auto fade-in">
          <div class="flex items-center justify-between mb-4"><h3 class="font-black text-lg"><i class="fas fa-${edit?'edit':'user-plus'} mr-1 text-amber-500"></i>${edit?'Editar cliente':'Alta de cliente'}</h3><button onclick="state.modal=null;render()" class="btn-secondary">Cerrar</button></div>
          <div class="grid sm:grid-cols-2 gap-3">
            ${!edit?input('f_cliente_cedula','Cédula','', 'text', true):`<div><label class="block text-[11px] font-bold text-slate-600">Cédula</label><div class="input mt-1 bg-slate-50">${escapeHtml(c.cedula)}</div></div>`}
            ${input('f_cliente_nombre','Nombre',c.nombre||'', 'text', true)}${input('f_cliente_apellido','Apellido',c.apellido||'')}
            ${input('f_cliente_email','Email',c.email||'','email')}${input('f_cliente_telefono','Teléfono',c.telefono||'','tel')}
            <label class="block text-[11px] font-bold text-slate-600">Tipo *<select id="f_cliente_tipo" class="input mt-1">${['general','departamental','municipal','seccional','pc','admin'].map(v=>`<option value="${v}" ${(c.tipo||'municipal')===v?'selected':''}>${v}</option>`).join('')}</select></label>
            <label class="block text-[11px] font-bold text-slate-600">Categoría *<select id="f_cliente_categoria" class="input mt-1">${['partido','movimiento','candidato'].map(v=>`<option value="${v}" ${(c.categoria||'partido')===v?'selected':''}>${v}</option>`).join('')}</select></label>
            <label class="block text-[11px] font-bold text-slate-600">Partido<select id="f_cliente_partido" class="input mt-1"><option value="">Sin asignar</option>${state.partidos.map(p=>`<option value="${p.id}" ${String(c.partido_id||'')===String(p.id)?'selected':''}>${escapeHtml(p.sigla||p.nombre_oficial)}</option>`).join('')}</select></label>
            <label class="block text-[11px] font-bold text-slate-600">Departamento<select id="f_cliente_departamento" class="input mt-1"><option value="">Sin asignar</option>${state.departamentos.map(d=>`<option value="${d.id}" ${String(c.departamento_id||'')===String(d.id)?'selected':''}>${escapeHtml(d.nombre)}</option>`).join('')}</select></label>
            <label class="block text-[11px] font-bold text-slate-600">Distrito<select id="f_cliente_distrito" class="input mt-1"><option value="">Sin asignar</option>${state.distritos.filter(d=>!c.departamento_id||String(d.departamento_id)===String(c.departamento_id)).map(d=>`<option value="${d.id}" ${String(c.distrito_id||'')===String(d.id)?'selected':''}>${escapeHtml(d.nombre)}</option>`).join('')}</select></label>
            ${input('f_cliente_unidad','ID de unidad operativa',c.unidad_organizacion_id||'','number')}
            ${input('f_cliente_candidato','Candidato/a',c.candidato_nombre||'')}${input('f_cliente_cargo','Cargo',c.candidato_cargo||'')}
            ${input('f_cliente_locales','Local/es de votación',c.locales||'')}
            ${!edit?input('f_cliente_password','Contraseña inicial','','password',true):''}
          </div><p class="text-[10px] text-slate-400 mt-2">Los campos con * son obligatorios. El alta respeta las validaciones del servidor.</p>
          <div class="flex gap-2 mt-4"><button onclick="guardarCliente()" class="btn-primary flex-1"><i class="fas fa-save mr-1"></i>${edit?'Guardar cambios':'Crear cliente'}</button><button onclick="state.modal=null;render()" class="btn-secondary">Cancelar</button></div>
        </div></div>`;
      }
      if (state.modal === 'nuevoPartido' || state.modal === 'editarPartido') {
        const edit=state.modal==='editarPartido', p=state.modalData||{};
        const field=(id,label,value='',type='text')=>`<label class="block text-[11px] font-bold text-slate-600">${label}<input id="${id}" class="input mt-1" type="${type}" value="${escapeHtml(value)}"></label>`;
        return `<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-3" onclick="if(event.target===this){state.modal=null;render();}"><div class="bg-white rounded-2xl p-5 w-full max-w-xl"><h3 class="font-black text-lg mb-4">${edit?'Editar partido':'Alta de partido'}</h3><div class="grid sm:grid-cols-2 gap-3">${field('f_partido_codigo','Código *',p.codigo_partido||'')}${field('f_partido_nombre','Nombre oficial *',p.nombre_oficial||'')}${field('f_partido_sigla','Sigla',p.sigla||'')}${field('f_partido_color','Color',p.color_principal_hex||'#333333')}${field('f_partido_lista','Número de lista',p.numero_lista||'','number')}<label class="block text-[11px] font-bold text-slate-600">Ámbito<select id="f_partido_ambito" class="input mt-1">${['Nacional','Departamental','Municipal','Distrital'].map(x=>`<option ${p.ambito===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="block text-[11px] font-bold text-slate-600 sm:col-span-2">Descripción<textarea id="f_partido_descripcion" class="input mt-1" rows="2">${escapeHtml(p.descripcion_corta||'')}</textarea></label></div><div class="flex gap-2 mt-4"><button onclick="guardarPartido()" class="btn-primary flex-1">Guardar</button><button onclick="state.modal=null;render()" class="btn-secondary">Cancelar</button></div></div></div>`;
      }
      if (state.modal === 'nuevoCandidato') {
        const field=(id,label,value='',type='text')=>`<label class="block text-[11px] font-bold text-slate-600">${label}<input id="${id}" class="input mt-1" type="${type}" value="${escapeHtml(value)}"></label>`;
        return `<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-3" onclick="if(event.target===this){state.modal=null;render();}"><div class="bg-white rounded-2xl p-5 w-full max-w-xl max-h-[90vh] overflow-y-auto"><h3 class="font-black text-lg mb-4">Alta de candidato electo</h3><div class="grid sm:grid-cols-2 gap-3">${field('f_cand_nombre','Nombre completo *')}<label class="block text-[11px] font-bold text-slate-600">Cargo<select id="f_cand_cargo" class="input mt-1"><option value="concejal">Concejal</option><option value="intendente">Intendente</option></select></label><label class="block text-[11px] font-bold text-slate-600">Partido *<select id="f_cand_partido" class="input mt-1"><option value="">Seleccionar</option>${state.partidos.map(p=>`<option value="${p.id}">${escapeHtml(p.sigla||p.nombre_oficial)}</option>`).join('')}</select></label><label class="block text-[11px] font-bold text-slate-600">Departamento<select id="f_cand_depto" class="input mt-1"><option value="">Sin asignar</option>${state.departamentos.map(d=>`<option value="${d.id}">${escapeHtml(d.nombre)}</option>`).join('')}</select></label><label class="block text-[11px] font-bold text-slate-600">Distrito<select id="f_cand_distrito" class="input mt-1"><option value="">Sin asignar</option>${state.distritos.map(d=>`<option value="${d.id}">${escapeHtml(d.nombre)}${d.departamento_id?' · Depto '+d.departamento_id:''}</option>`).join('')}</select></label>${field('f_cand_lista','Número de lista','0','number')}${field('f_cand_lista_nombre','Nombre de lista')}${field('f_cand_orden','Orden','0','number')}${field('f_cand_periodo','Periodo','2026-2030')}${field('f_cand_cliente','Cédula del cliente asociado')}</div><p class="text-[10px] text-amber-700 mt-2">Este endpoint crea el registro con estado “electo”. Confirma que corresponde antes de guardar.</p><div class="flex gap-2 mt-4"><button onclick="guardarCandidato()" class="btn-primary flex-1">Crear candidato</button><button onclick="state.modal=null;render()" class="btn-secondary">Cancelar</button></div></div></div>`;
      }
      return '';
    }

    async function guardarEditarUsuario(ced) {
      const nombre = document.getElementById('f_nombre')?.value || '';
      const rol = document.getElementById('f_rol')?.value || '';
      try {
        await apiPostRuta('/api/usuarios/editar', { cedula: ced, nombre, rol });
        alert('Usuario actualizado.');
        state.modal = null;
        cargarUsuarios();
      } catch(e) { alert('Error: ' + e.message); }
    }

    // ============ INIT ============
    if (state.autenticado) cargaInicial();
    else render();
  </script>
</body>
</html>
