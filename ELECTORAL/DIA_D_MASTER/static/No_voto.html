<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIA D MASTER - Registro de No Votantes</title>
    <script src="vendor/tailwind.js"></script>
    <link href="vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  <script src="party_theme.js"></script>
    <script src="auth.js?v=2"></script>
  <link rel="stylesheet" id="tema-cliente" href="tema-cliente.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
    <div id="app"></div>

    <script>
        const API_URL = '/api';
        const USER_SESSION_KEY = 'seccional40_user';

        function getSessionUser() {
            try { return JSON.parse(sessionStorage.getItem(USER_SESSION_KEY)); } catch { return null; }
        }
        function getNivel() {
            const u = getSessionUser();
            return u ? (u.nivel || '') : '';
        }
        function estaAutenticado() {
            return getSessionUser() !== null;
        }
        
        let state = {
            autenticado: estaAutenticado(),
            cargando: false,
            padron: [],
            consultaResultado: null,
            mensaje: ''
        };

        async function login() {
            const cedulaInput = document.getElementById('cedulaLogin');
            const passwordInput = document.getElementById('passwordLogin');
            const cedula = cedulaInput ? cedulaInput.value.replace(/[.\s,-]/g, '').trim() : '';
            const password = passwordInput ? passwordInput.value.trim() : '';
            if (!cedula || !password) { alert('Ingrese cédula y contraseña.'); return; }
            try {
                const resp = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'login', cedula: cedula, password: password }) });
                const data = await resp.json();
                if (!data.success) { alert(data.error || 'Credenciales inválidas'); return; }
                sessionStorage.setItem(USER_SESSION_KEY, JSON.stringify(data.usuario));
                state.autenticado = true;
                state.usuario = data.usuario;
                cargarPadron();
            } catch (e) {
                alert('Error de conexión: ' + e.message);
            }
        }

        function getBackendAccessError() {
            return 'Backend no disponible. Verifique que el servidor esté corriendo.';
        }

        async function fetchJsonOrThrow(url, options) {
            const response = await fetch(url, options);
            const text = await response.text();
            const contentType = (response.headers.get('content-type') || '').toLowerCase();
            const trimmed = text.trim().toLowerCase();

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            if (contentType.includes('text/html') || trimmed.startsWith('<!doctype html') || trimmed.startsWith('<html')) {
                throw new Error(getBackendAccessError());
            }

            try {
                return JSON.parse(text);
            } catch (error) {
                throw new Error('Respuesta invalida del backend.');
            }
        }

        async function cargarPadron() {
            state.cargando = true;
            state.mensaje = 'Cargando padrón...';
            render();
            
            try {
                const padronApiData = await fetchJsonOrThrow(API_URL + '?action=padron&v=' + Date.now());
                const electoresData = padronApiData.electores || [];
                
                const registros = [];
                for (const elector of electoresData) {
                    registros.push({
                        secc: '',
                        num: '',
                        local: elector.local || '',
                        mesa: parseInt(elector.mesa) || 0,
                        orden: parseInt(elector.orden) || 0,
                        cedula: elector.cedula,
                        apellido: elector.apellido,
                        nombre: elector.nombre,
                        nombreCompleto: elector.nombreCompleto,
                        dirigente: elector.dirigente || ''
                    });
                }
                
                state.padron = registros;
                state.cargando = false;
                state.mensaje = `Padrón cargado: ${registros.length} electores`;
            } catch (error) {
                console.error('Error:', error);
                state.cargando = false;
                state.mensaje = 'Error cargando padrón';
            }
            render();
        }

        function buscarCedula() {
            const input = document.getElementById('cedulaInput');
            const cedula = input ? input.value.replace(/\D/g, '').trim() : '';
            
            if (!cedula) {
                state.consultaResultado = null;
                render();
                return;
            }
            
            const encontrado = state.padron.find(p => p.cedula === cedula);
            
            if (encontrado) {
                state.consultaResultado = {
                    encontrado: true,
                    cedula: encontrado.cedula,
                    nombre: encontrado.nombreCompleto,
                    mesa: encontrado.mesa,
                    orden: encontrado.orden,
                    local: encontrado.local,
                    dirigente: encontrado.dirigente || 'Sin dirigente'
                };
            } else {
                state.consultaResultado = {
                    encontrado: false,
                    cedula: cedula
                };
            }
            render();
        }

        async function registrarNoVoto() {
            if (!state.consultaResultado || !state.consultaResultado.encontrado) {
                alert('Primero busque una cédula válida');
                return;
            }
            
            const motivoSelect = document.getElementById('motivoSelect');
            const observacionInput = document.getElementById('observacionInput');
            const motivo = motivoSelect ? motivoSelect.value : 'Otro';
            const observacion = observacionInput ? observacionInput.value.trim() : '';
            const nombreCompleto = state.consultaResultado.nombre || '';
            
            const data = {
                estado: 'no_voto',
                cedula: state.consultaResultado.cedula,
                mesa: state.consultaResultado.mesa || '',
                orden: state.consultaResultado.orden || '',
                motivo: motivo,
                observacion: observacion || motivo
            };
            
            // Enviar a Google Sheets
            if (API_URL && API_URL !== '') {
                try {
                    console.log('Enviando no-voto:', data);
                    
                    const result = await apiPost({
                        action: 'registrar',
                        estado: 'no_voto',
                        cedula: data.cedula,
                        mesa: data.mesa,
                        orden: data.orden,
                        motivo: data.motivo,
                        observacion: data.observacion
                    });
                    console.log('Respuesta:', result);
                    
                    if (result.success) {
                        state.mensaje = `✅ Registrado: ${nombreCompleto}`;
                    } else {
                        state.mensaje = `⚠️ Error: ${result.error}`;
                    }
                } catch (e) {
                    console.error('Error enviando:', e);
                    state.mensaje = `⚠️ Error de conexión: ${e.message}`;
                }
            } else {
                state.mensaje = '⚠️ API_URL no configurada';
            }
            state.consultaResultado = null;
            
            // Limpiar inputs
            if (document.getElementById('cedulaInput')) document.getElementById('cedulaInput').value = '';
            if (document.getElementById('observacionInput')) document.getElementById('observacionInput').value = '';
            
            render();
        }

        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="bg-white rounded-[2rem] p-8 md:p-12 shadow-2xl border border-slate-100 max-w-md w-full text-center">
                        <div class="w-20 h-20 bg-gradient-to-br from-slate-900 to-black border border-amber-500/40 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-amber-500/10 text-amber-400">
                            <i class="fas fa-user-slash text-white text-3xl"></i>
                        </div>
                        <h1 class="text-3xl font-black text-slate-900 uppercase tracking-tighter mb-2">NO VOTO</h1>
                        <p class="text-slate-500 text-sm mb-8">Registro de personas que no votarán</p>
                        
                        <div class="space-y-4">
                            <div class="relative">
                                <i class="fas fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" id="cedulaLogin" placeholder="Cédula" 
                                    class="w-full pl-12 pr-4 py-4 text-lg font-bold border-2 border-slate-200 rounded-2xl focus:border-[#c5a059] focus:outline-none transition-all text-center"
                                    onkeypress="if(event.key === 'Enter') document.getElementById('passwordLogin').focus()">
                            </div>
                            <div class="relative">
                                <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="password" id="passwordLogin" placeholder="Contraseña" 
                                    class="w-full pl-12 pr-4 py-4 text-lg font-bold border-2 border-slate-200 rounded-2xl focus:border-[#c5a059] focus:outline-none transition-all text-center"
                                    onkeypress="if(event.key === 'Enter') login()">
                            </div>
                            <button onclick="login()" class="w-full py-4 bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-black rounded-2xl shadow-lg shadow-amber-500/20 transition-all shadow-lg">
                                ACCEDER
                            </button>
                        </div>
                        
                        <p class="text-xs text-slate-400 mt-6">Sistema Privado - Uso Autorizado</p>
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            
            if (!state.autenticado) {
                app.innerHTML = renderLogin();
                return;
            }
            
            app.innerHTML = `
                <header class="bg-slate-950 text-white sticky top-0 z-40 shadow-xl border-b border-amber-500/20">
                    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
                        <div class="flex items-center gap-3">
                            <div class="p-2.5 bg-gradient-to-br from-amber-500/20 to-black border border-amber-500/30 rounded-xl text-amber-400">
                                <i class="fas fa-user-slash text-white text-xl"></i>
                            </div>
                            <div>
                                <h1 class="text-xl font-black uppercase tracking-tight leading-none text-white">DIA D MASTER</h1>
                                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest opacity-80">Registro No Votantes</p>
                            </div>
                        </div>
                        
                        <!-- MENÚ DE NAVEGACIÓN -->
                        <div class="flex flex-wrap items-center gap-2 bg-slate-900/90 px-3 py-1.5 rounded-xl border border-amber-500/30">
                          <span class="text-[10px] text-amber-400 font-bold uppercase mr-2">📍 ${sessionStorage.getItem('seccional40_escuela') || 'Esc. ...'}</span>
                          <span class="text-[10px] text-amber-400 font-bold uppercase mr-2">Colegio:</span>
                          <a href="acceso.html" class="px-2 py-1 hover:bg-slate-800 hover:text-amber-400 rounded-lg text-[10px] font-bold text-slate-300 transition-all">Votación</a>
                          <a href="mesas.html" class="px-2 py-1 hover:bg-slate-800 hover:text-amber-400 rounded-lg text-[10px] font-bold text-slate-300 transition-all">Mesas</a>
                          <a href="No_voto.html" class="px-2 py-1 bg-gradient-to-r from-amber-500 to-amber-600 rounded-lg text-[10px] font-black text-slate-950 shadow-sm">No Voto</a>
                          <a href="padron_unificado.html" class="px-2 py-1 hover:bg-slate-800 hover:text-amber-400 rounded-lg text-[10px] font-bold text-slate-300 transition-all">Padrón</a>
                          <span class="text-[10px] text-slate-600 mx-1">|</span>
                          <span class="text-[10px] text-slate-400 font-bold uppercase">PC:</span>
                          <a href="anomalias.html" class="px-2 py-1 hover:bg-slate-800 hover:text-amber-400 rounded-lg text-[10px] font-bold text-slate-300 transition-all">Anomalías</a>
                          <a href="escrutinio.html" class="px-2 py-1 hover:bg-slate-800 hover:text-amber-400 rounded-lg text-[10px] font-bold text-slate-300 transition-all">Escrutinio</a>
                          <a href="asistencia.html" class="px-2 py-1 hover:bg-slate-800 hover:text-amber-400 rounded-lg text-[10px] font-bold text-slate-300 transition-all">Seguimiento</a>
                        </div>
                        
                        <div class="text-right">
                            <p class="text-xs text-red-200">Total electores: ${state.padron.length}</p>
                        </div>
                    </div>
                </header>

                <main class="max-w-3xl mx-auto p-4 md:p-6">
                    ${state.cargando ? `
                        <div class="text-center py-12">
                            <div class="inline-block w-12 h-12 border-4 border-red-200 border-t-red-600 rounded-full animate-spin mb-4"></div>
                            <p class="text-slate-500 font-bold">${state.mensaje}</p>
                        </div>
                    ` : `
                        <div class="animate-in">
                            <!-- BARRA DE BÚSQUEDA -->
                            <div class="bg-white rounded-[2rem] p-4 shadow-xl border border-slate-100 mb-4">
                                <div class="flex flex-col sm:flex-row gap-3 items-center">
                                    <div class="flex-1 relative w-full">
                                        <i class="fas fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                        <input type="text" id="cedulaInput" placeholder="Ingrese cédula del elector" 
                                            class="w-full pl-12 pr-4 py-3 text-lg font-bold border-2 border-slate-100 rounded-xl focus:border-[#c5a059] focus:outline-none transition-all"
                                            onkeypress="if(event.key === 'Enter') buscarCedula()">
                                    </div>
                                    <button onclick="buscarCedula()" class="px-8 py-3 bg-red-600 hover:bg-red-700 text-white font-black rounded-xl transition-all shadow-lg flex items-center gap-2 whitespace-nowrap">
                                        <i class="fas fa-search"></i> BUSCAR
                                    </button>
                                </div>
                                
                                ${state.consultaResultado ? renderResultado() : ''}
                            </div>
                            
                            <!-- MENSAJE -->
                            ${state.mensaje ? `
                                <div class="bg-red-50 border-2 border-red-100 rounded-xl p-4 mb-4 animate-in">
                                    <p class="font-bold text-red-800 text-center">${state.mensaje}</p>
                                </div>
                            ` : ''}
                        </div>
                    `}
                </main>
            `;
        }

        function renderResultado() {
            const r = state.consultaResultado;
            
            if (!r.encontrado) {
                return `
                    <div class="mt-4 bg-red-50 border-2 border-red-100 rounded-xl p-4 flex items-center gap-3 animate-in">
                        <div class="p-2 bg-red-100 rounded-full text-red-600">
                            <i class="fas fa-times-circle text-xl"></i>
                        </div>
                        <div>
                            <p class="font-black text-red-800 text-sm">Cédula no encontrada</p>
                            <p class="text-xs text-red-600">${r.cedula} no está en el padrón</p>
                        </div>
                    </div>
                `;
            }
            
            return `
                <div class="mt-4 bg-white border-2 border-red-100 rounded-xl p-4 animate-in">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="p-2 bg-red-100 rounded-full text-red-600">
                            <i class="fas fa-user text-xl"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-black text-red-800 text-lg">${r.nombre}</p>
                            <div class="flex gap-3 text-xs mt-1">
                                <span class="text-red-600 font-bold">Cédula: ${r.cedula}</span>
                                <span class="font-bold text-slate-500">Mesa: ${r.mesa}</span>
                                <span class="font-bold text-slate-500">Orden: ${r.orden}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Motivo</label>
                            <select id="motivoSelect" class="w-full px-4 py-3 text-base font-bold border-2 border-slate-200 rounded-xl focus:border-[#c5a059] focus:outline-none transition-all bg-white">
                                <option value="Enfermedad">Enfermedad</option>
                                <option value="Viaje">Viaje</option>
                                <option value="Fallecido">Fallecido</option>
                                <option value="Trabajo">Trabajo</option>
                                <option value="Desinterés">Desinterés</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Observación (opcional)</label>
                            <textarea id="observacionInput" rows="2" placeholder="Ej: Se fue de viaje al exterior, está internado, etc."
                                class="w-full px-4 py-3 text-base font-bold border-2 border-slate-200 rounded-xl focus:border-[#c5a059] focus:outline-none transition-all resize-none"></textarea>
                        </div>
                        
                        <button onclick="registrarNoVoto()" class="w-full py-4 bg-red-600 hover:bg-red-700 text-white font-black rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                            <i class="fas fa-save"></i> REGISTRAR NO VOTO
                        </button>
                    </div>
                </div>
            `;
        }

        const user = getSessionUser();
        if (user) {
            state.autenticado = true;
            state.usuario = user;
        }
        if (state.autenticado) {
            cargarPadron();
        } else {
            render();
        }
    </script>
</body>
</html>
