<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directorio de Candidatos</title>
<script src="vendor/tailwind.js"></script>
<style>
.card-candidat { transition: all .2s; }
.card-candidat:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
.cargo-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.cargo-intendente { background: #dbeafe; color: #1e40af; }
.cargo-concejal { background: #dcfce7; color: #166534; }
</style>
</head>
<body class="bg-gray-100 min-h-screen">

<header class="bg-white shadow-md">
  <div class="max-w-6xl mx-auto px-4 py-6">
    <h1 class="text-3xl font-black text-gray-800">Directorio de Candidatos</h1>
    <p class="text-sm text-gray-500 mt-1">Sistema Electoral DIA D MASTER</p>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">

  <!-- Filtros -->
  <div class="card bg-white rounded-xl shadow p-4 mb-6 flex flex-wrap gap-4 items-center">
    <input type="text" id="filtro-nombre" class="input flex-1 min-w-[200px] px-4 py-2 border rounded-lg" placeholder="Buscar por nombre..." oninput="filtrar()">
    <select id="filtro-cargo" class="px-4 py-2 border rounded-lg" onchange="filtrar()">
      <option value="">Todos los cargos</option>
      <option value="intendente">Intendente</option>
      <option value="concejal">Concejal</option>
    </select>
    <select id="filtro-partido" class="px-4 py-2 border rounded-lg" onchange="filtrar()">
      <option value="">Todos los partidos</option>
    </select>
    <div class="text-sm text-gray-500" id="contador"></div>
  </div>

  <!-- Grid de candidatos -->
  <div id="grid-candidatos" class="grid md:grid-cols-3 gap-4">
    <p class="text-gray-400 text-center py-8 col-span-3">Cargando candidatos...</p>
  </div>

</main>

<footer class="bg-white border-t mt-12 py-6">
  <div class="max-w-6xl mx-auto px-4 text-center text-sm text-gray-500">
    <p>Directorio de Candidatos — Sistema Electoral DIA D MASTER</p>
  </div>
</footer>

<script>
let todosLosCandidatos = [];

async function cargarCandidatos() {
  const r = await fetch('/api/candidatos/listing');
  const d = await r.json();
  if (!d.success) {
    document.getElementById('grid-candidatos').innerHTML = '<p class="text-red-400 text-center py-8 col-span-3">Error cargando candidatos</p>';
    return;
  }
  todosLosCandidatos = d.candidatos;
  
  // Llenar filtro de partidos
  const selectPartido = document.getElementById('filtro-partido');
  const partidos = [...new Set(d.candidatos.map(c => c.partido_nombre).filter(Boolean))].sort();
  for (const p of partidos) {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    selectPartido.appendChild(opt);
  }
  
  renderCandidatos(d.candidatos);
}

function renderCandidatos(candidatos) {
  const grid = document.getElementById('grid-candidatos');
  document.getElementById('contador').textContent = `${candidatos.length} candidatos`;
  
  if (!candidatos.length) {
    grid.innerHTML = '<p class="text-gray-400 text-center py-8 col-span-3">No se encontraron candidatos</p>';
    return;
  }
  
  grid.innerHTML = candidatos.map(c => `
    <a href="${c.url}" class="card-candidat bg-white rounded-xl shadow p-5 block">
      <div class="flex items-start justify-between mb-3">
        <div>
          <h3 class="font-bold text-gray-800">${c.nombre}</h3>
          <p class="text-xs text-gray-500 mt-1">${c.distrito || ''} · ${c.departamento || ''}</p>
        </div>
        <span class="cargo-badge ${c.cargo === 'intendente' ? 'cargo-intendente' : 'cargo-concejal'}">${c.cargo}</span>
      </div>
      
      <div class="flex items-center gap-2 mb-3">
        ${c.partido_color ? `<span class="w-3 h-3 rounded-full" style="background:${c.partido_color}"></span>` : ''}
        <span class="text-sm text-gray-600">${c.partido_nombre || 'Independiente'}</span>
      </div>
      
      <div class="flex items-center justify-between text-xs text-gray-500">
        <span>${c.lista || ''}</span>
        <span>${c.tiene_perfil ? '✓ Perfil completo' : 'Sin perfil'}</span>
      </div>
      
      ${c.simpatizantes > 0 ? `<div class="mt-2 text-xs text-blue-600 font-semibold">${c.simpatizantes} simpatizantes</div>` : ''}
    </a>
  `).join('');
}

function filtrar() {
  const nombre = document.getElementById('filtro-nombre').value.toLowerCase();
  const cargo = document.getElementById('filtro-cargo').value;
  const partido = document.getElementById('filtro-partido').value;
  
  const filtrados = todosLosCandidatos.filter(c => {
    if (nombre && !c.nombre.toLowerCase().includes(nombre)) return false;
    if (cargo && c.cargo !== cargo) return false;
    if (partido && (c.partido_nombre || '') !== partido) return false;
    return true;
  });
  
  renderCandidatos(filtrados);
}

// Carga inicial
cargarCandidatos();
</script>
</body>
</html>
