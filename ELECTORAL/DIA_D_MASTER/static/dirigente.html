  if (marcadorSolicitud) { marcadorSolicitud = null; }
  setTimeout(initMapaSolicitud, 50);
  cargarDireccionPadron(sol.votante_cedula);
}

// Muestra la ultima direccion que el padron tiene registrada para este votante, para que
// el dirigente no tenga que escribirla de memoria ni preguntarsela de nuevo.
async function cargarDireccionPadron(cedula) {
  const box = document.getElementById('solDireccionPadron');
  if (!box) return;
  box.classList.add('hidden');
  box.innerHTML = '';
  try {
    const d = await apiGet({ action: 'validar_cedula_candidato', cedula });
    if (!d.success || !d.encontrado || !d.direccion) return;
    box.classList.remove('hidden');
    box.innerHTML = `
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-2.5">
        <p class="text-[9px] font-black uppercase tracking-wider text-slate-400 mb-0.5"><i class="fas fa-address-book mr-1"></i>Dirección en el Padrón</p>
        <p class="text-xs font-bold text-slate-700">${esc_(d.direccion)}</p>
        <button type="button" onclick="document.getElementById('solUbicacion').value = ${JSON.stringify(d.direccion)}"
          class="mt-1.5 text-[10px] font-black text-blue-600 hover:text-blue-800">
          <i class="fas fa-arrow-up mr-1"></i>Usar esta dirección
        </button>
      </div>`;
  } catch (e) { /* silent */ }
}

function initMapaSolicitud() {
  const el = document.getElementById('mapaSolicitudTransporte');
  if (!el || typeof L === 'undefined') return;
  if (mapaSolicitud) { mapaSolicitud.remove(); mapaSolicitud = null; marcadorSolicitud = null; }
  mapaSolicitud = L.map('mapaSolicitudTransporte').setView([-25.2637, -57.5759], 13); // Asunción
  // Sin tiles externos: la app funciona 100% offline, sin depender de internet para el mapa.
  mapaSolicitud.on('click', (e) => {
    coordsSolicitud = e.latlng;
    if (marcadorSolicitud) marcadorSolicitud.setLatLng(coordsSolicitud);
    else marcadorSolicitud = L.marker(coordsSolicitud).addTo(mapaSolicitud);
  });
}

function cerrarSolicitarTransporte() {
  document.getElementById('modalTransporte').classList.add('hidden');
  editandoSolicitudId = null;
}

async function enviarSolicitudTransporte() {
  const cedula = document.getElementById('solVotanteCedula').value;
  const nombre = document.getElementById('solVotanteNombre').value;
  const hora = document.getElementById('solHora').value;
  const direccionTexto = document.getElementById('solUbicacion').value.trim();
  const descripcion = document.getElementById('solDescripcion').value.trim();
  const msgEl = document.getElementById('solMensaje');
  // La direccion escrita y el pin del mapa se combinan: si solo marco el mapa, se guardan
  // las coordenadas; si escribio direccion, se guarda esa, agregando el pin si tambien lo puso.
  const ubicacion = coordsSolicitud
    ? `${direccionTexto || 'Ubicación marcada en el mapa'} (lat:${coordsSolicitud.lat.toFixed(5)}, lng:${coordsSolicitud.lng.toFixed(5)})`
    : direccionTexto;

  if (!hora) { msgEl.textContent = '⚠️ Indicá la hora de recogida'; msgEl.classList.remove('hidden'); return; }
  if (!ubicacion) { msgEl.textContent = '⚠️ Indicá la dirección o marcá el lugar en el mapa'; msgEl.classList.remove('hidden'); return; }

  if (!state.dirigente) { msgEl.textContent = '⚠️ Dirigente no autenticado'; msgEl.classList.remove('hidden'); return; }

  msgEl.classList.add('hidden');
  try {
    if (editandoSolicitudId) {
      const r = await fetch('/api/editar_recogida', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          dirigente_cedula: state.dirigente.cedula,
          solicitud_id: editandoSolicitudId,
          hora_recogida: hora,
          ubicacion: ubicacion,
          descripcion: descripcion
        })
      });
      const d = await r.json();
      if (!d.success) {
        msgEl.textContent = '⚠️ ' + (d.error || 'Error al editar');
        msgEl.classList.remove('hidden');
        return;
      }
      msgEl.textContent = '✅ Solicitud actualizada';
      msgEl.className = 'text-sm font-bold text-emerald-600 text-center mt-2';
      msgEl.classList.remove('hidden');
      editandoSolicitudId = null;
      await cargarMisSolicitudes();
      setTimeout(cerrarSolicitarTransporte, 1500);
      return;
    }

    const d = await apiPost({
      action: 'solicitar_recogida',
      dirigente_cedula: state.dirigente.cedula,
      dirigente_nombre: state.dirigente.nombre || '',
      votante_cedula: cedula,
      votante_nombre: nombre,
      hora_recogida: hora,
      ubicacion: ubicacion,
      descripcion: descripcion
    });
    // Fallback: if the action isn't found in the legacy POST handler,
    // try the dedicated endpoint
    if (!d.success || d.accion !== 'solicitado') {
      const r2 = await fetch('/api/solicitar_recogida', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          dirigente_cedula: state.dirigente.cedula,
          dirigente_nombre: state.dirigente.nombre || '',
          votante_cedula: cedula,
          votante_nombre: nombre,
          hora_recogida: hora,
          ubicacion: ubicacion,
          descripcion: descripcion
        })
      });
      const d2 = await r2.json();
      if (!d2.success) {
        msgEl.textContent = '⚠️ ' + (d2.error || 'Error al solicitar');
        msgEl.classList.remove('hidden');
        return;
      }
    }
    msgEl.textContent = '✅ Solicitud enviada a logística';
    msgEl.className = 'text-sm font-bold text-emerald-600 text-center mt-2';
    msgEl.classList.remove('hidden');
    await cargarMisSolicitudes();
    setTimeout(cerrarSolicitarTransporte, 2000);
  } catch(e) {
    msgEl.textContent = '⚠️ Error: ' + e.message;
    msgEl.classList.remove('hidden');
  }
}
</script>

<!-- MODAL SOLICITAR TRANSPORTE -->

      </div>
      <div id="solDireccionPadron" class="hidden"></div>
      <div>
        <label class="text-[10px] font-black uppercase tracking-wider text-slate-500 block mb-1">Dirección / Ubicación</label>
        <input id="solUbicacion" type="text" placeholder="Ej: Av. Mariscal López casi 25 de Mayo" class="w-full border-2 border-slate-200 rounded-xl p-3 text-sm font-semibold focus:border-blue-500 focus:outline-none transition-colors">
      </div>
      <div>
        <label class="text-[10px] font-black uppercase tracking-wider text-slate-500 block mb-1">o marcá el lugar en el mapa</label>

        <label class="text-[10px] font-black uppercase tracking-wider text-slate-500 block mb-1">Referencia (opcional)</label>

      </div>
      <p id="solMensaje" class="text-sm font-bold text-red-500 text-center mt-1 hidden"></p>
      <button onclick="enviarSolicitudTransporte()" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold rounded-xl transition-all active:scale-[0.98] shadow-lg">
        <i class="fas fa-paper-plane mr-2"></i> Enviar solicitud
      </button>
    </div>
  </div>
</div>
