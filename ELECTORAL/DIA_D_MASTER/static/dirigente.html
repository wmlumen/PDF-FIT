    @keyframes slideInRight { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
    .scroll-thin::-webkit-scrollbar { width: 4px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
    .badge { @apply inline-block px-2.5 py-0.5 rounded-full text-[10px] font-black tracking-wide; }

    @media (max-width: 640px) {

<script src="config.js"></script>
    <script src="auth.js"></script>
<script>
const API_URL = '/api';
const STATUS_MAP = {
  'posible': { label: 'Posible', icon: 'fa-clock', color: 'text-amber-600', bg: 'bg-amber-50', border: 'border-amber-200' },
  'buscar': { label: 'Necesita que le busquen', icon: 'fa-car', color: 'text-blue-600', bg: 'bg-blue-50', border: 'border-blue-200' },
  'vendra_solo': { label: 'Vendrá Solo/a', icon: 'fa-walking', color: 'text-green-600', bg: 'bg-green-50', border: 'border-green-200' },
  'no_responde': { label: 'No Responde', icon: 'fa-phone-slash', color: 'text-red-600', bg: 'bg-red-50', border: 'border-red-200' },
  'confirmado': { label: 'Voto Seguro ✓', icon: 'fa-check-circle', color: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-200' }
};

let state = {
  offline: !navigator.onLine,
  autenticado: isLoggedIn(),
  dirigente: null,
  cargando: false,
  mensaje: '', msgTipo: 'info',
  loginPaso: 1, loginCedula: '', loginNombreEncontrado: '',
  mostrarRegistro: false,
  regForm: { step: 1, cedula: '', nombre: '', nombreEncontrado: '', yaEsDirigente: false, telefonoPrefijo: '+595', telefono: '', email: '', password: '', confirmar: '', enviando: false, error: '' },
  mostrarRecuperar: false,
  recForm: { cedula: '', telefonoPrefijo: '+595', telefono: '', email: '', enviando: false },
  mostrarPerfil: false,
  // Búsqueda
  busqueda: { cedula: '', apellido: '', nombre: '', depart: '', distrito: '', resultados: [], buscando: false, vacio: false, soloNoVotaron: false },
  departamentos: [],
  distritos: [],
  distritosZona: [],
  zonas: [],
  // Mis Posibles
  misPosibles: [],
  asignarCand: null,
  resumen: { posible: 0, buscar: 0, vendra_solo: 0, no_responde: 0, confirmado: 0 },
  tab: 'lista', // 'lista' | 'buscar' | 'seguimiento' | 'candidatos' | 'transporte' | 'cargar' | 'actividad' | 'tareas'
  sinVotantes: false,
  cargarForm: { tipo: 'voto_seguro', cedula: '', nombre: '', email: '', enContrado: false, buscando: false, enviando: false },
  cargarArchivo: { nombreArchivo: '', filas: null, procesando: false, confirmando: false, resultados: null, error: '', arrastrando: false },
  solicitudesDesvinculo: [],
  solicitudesVinculo: [],
  actividadVotantes: [],
  mesasEstado: [],
  tareas: [],
  tareaForm: { titulo: '', descripcion: '', fecha_hora: '', votante_cedula: '', votante_nombre: '' },
  vinculoForm: { dirigente_cedula: '', enviando: false },
  filtroStatus: 'todos',
  seguimiento: null,
  misSolicitudes: [],
  movilidad: null,
  verPersonasABuscar: false,
  subMapaActivo: null, // { conductor_nombre, lat, lng, placa }
  // Candidatos
  candidatosDisponibles: [],
  misCandidatos: [],
  plantillaWhatsapp: '',
  plantillaWhatsappGeneral: '',
  plantillaWhatsappPropia: '',
  partidoId: null,
  showCandidatos: false,
  panelCandidatos: [],  // candidatos con sus dirigentes vinculados
  jerarquia: { arbol: [] },
  jerarquiaExpand: {},  // track which nodes are expanded
  candidatoVista: 'asignar',  // 'asignar' | 'jerarquia'
  ordenVistaCandidatos: 'lista',  // 'lista' | 'partido' | 'mas_votados'
  listasCand: [],
  distritosCand: [],
  candSel: { departamentoId: '', distritoId: '', listaNro: '', cargoTab: 'intendente' },
  // Mi Local (seguimiento operativo de un local electoral especifico)
  local: {
    filtro: { distrito: '', seccional: '', local: '' },
    modoAuto: false, localActual: null,  // true cuando se eligio desde los chips detectados automaticamente
    distritosGeo: [], seccionalesGeo: [], localesGeo: [],
    misLocales: [], misLocalesCargado: false,
    dashboard: null, cargando: false, error: '',
    // Mis Sub-Dirigentes: equipo reclutado por este dirigente, con su local asignado y rendimiento
    subdirigentes: [], subdirigentesCargado: false,
    asignandoSub: null,  // { cedula, distrito, seccional, local, distritosGeo, seccionalesGeo, localesGeo }
    // Ubicacion GPS marcada del local elegido (mapa "Dónde está tu local")
    coordLocal: null, coordLocalCargando: false,  // { lat, lng } | null
    // Traslados (busqueda/ida/vuelta) de TODOS mis votantes, para seguirles el trayecto
    // sin preguntarle a logistica — a diferencia del conductor, que solo ve lo suyo.
    trasladosVotantes: []
  }
};

function limpiarCedula(c) { return (c||'').replace(/[.\s,-]/g,'').trim(); }
function formatearFecha(iso) {
  if (!iso) return '';
  const partes = iso.split(' ');
  if (partes.length < 1) return iso;
  const fecha = partes[0];
  const [y, m, d] = fecha.split('-');
  if (!y || !m || !d) return iso;
  return `${d}/${m}/${y}`;
}

function formatearCC(ced) { if (!ced) return ced; return String(ced).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }

function headersSesion() {
  const u = getSessionUser();
  return (u && u.session_id) ? { 'x-session-id': u.session_id } : {};
}
async function apiGet(params) {
  // La contraseña nunca va en la URL (se filtra en logs/historial) — si viene en params,
  // se saca de la query y se manda como header X-Password, como ya espera el backend.
  const headers = { ...headersSesion() };
  if (params && params.password) {
    headers['X-Password'] = params.password;
    params = { ...params };
    delete params.password;
  }
  const r = await fetch(API_URL+'?'+new URLSearchParams(params)+'&v='+Date.now(), { headers });
  const txt = await r.text();
  const ct = (r.headers.get('content-type') || '').toLowerCase();
  if (ct.includes('text/html') || txt.trim().startsWith('<!doctype')) throw new Error('Backend no disponible');
  return JSON.parse(txt);
}
async function apiPost(data) {
  const u = getSessionUser();
  if (u) { data.cedula_auth = u.cedula; data.password_auth = sessionStorage.getItem('user_pw') || ''; }
  const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'application/json', ...headersSesion()}, body:JSON.stringify(data) });
  return r.json();
}

function n(v) { return v || 0; }

// ============ LOGIN ============
async function login() {
  const ci = document.getElementById('cedulaInput'), pi = document.getElementById('passInput');
  const ced = state.loginCedula || limpiarCedula(ci ? ci.value : ''), pw = pi ? pi.value : '';
  if (!ced || !pw) { alert('Ingrese cédula y contraseña.'); return; }
  try {
    const d = await apiGet({ action:'login', cedula:ced, password:pw });
    if (d.success && d.usuario) {
      sessionStorage.setItem('user_pw', pw);
      state.dirigente = d.usuario; state.autenticado = true;
      sessionStorage.setItem(AUTH_SHARED_KEY, JSON.stringify(state.dirigente));
      if (d.usuario.requiere_cambio_clave) {
        await promptCambioClave(d.usuario.cedula, pw);
      }
      await cargaInicial();
    } else { alert('Credenciales incorrectas.'); }
  } catch(e) { alert('Error: '+e.message); }
}

// ============ REGISTRO GRATUITO (wizard de 4 pasos) ============
function toggleRegistro(mostrar) {
  state.mostrarRegistro = mostrar;
  if (mostrar) {
    state.regForm = { step: 1, cedula: '', nombre: '', nombreEncontrado: '', yaEsDirigente: false, telefonoPrefijo: '+595', telefono: '', email: '', password: '', confirmar: '', enviando: false, error: '' };
    _yendoAlPanel = false;
  }
  render();
}

function mostrarErrorRegistro(msg) {
  state.regForm.error = msg;
  render();
}

// Paso 1: cédula -> busca en el padrón sin perder el foco del input (se actualiza
// el saludo directamente en el DOM, igual que en login/recuperar, en vez de re-renderizar).
let _buscarPadronTimer = null;
function onCedulaRegistroInput() {
  const ci = document.getElementById('regCedula');
  const ced = limpiarCedula(ci ? ci.value : '');
  const saludoBox = document.getElementById('regSaludoBox');
  const nombreManualWrap = document.getElementById('regNombreManualWrap');
  state.regForm.cedula = ced;
  state.regForm.error = '';
  clearTimeout(_buscarPadronTimer);
  if (!/^\d{5,8}$/.test(ced)) {
    state.regForm.nombreEncontrado = '';
    state.regForm.yaEsDirigente = false;
    if (saludoBox) { saludoBox.classList.add('hidden'); saludoBox.innerHTML = ''; }
    if (nombreManualWrap) nombreManualWrap.classList.add('hidden');
    return;
  }
  _buscarPadronTimer = setTimeout(async () => {
    try {
      const d = await apiGet({ action:'validar_cedula_candidato', cedula:ced });
      const nombreCompleto = d.success && d.encontrado ? [d.nombre, d.apellido].filter(Boolean).join(' ').trim() : '';
      state.regForm.nombreEncontrado = nombreCompleto;
      state.regForm.yaEsDirigente = !!d.ya_es_dirigente;
      if (state.regForm.yaEsDirigente && saludoBox) {
        saludoBox.innerHTML = `
          <div class="pop-in flex items-start gap-3 bg-slate-50 border-2 border-slate-200 rounded-2xl px-4 py-3.5">
            <div class="w-9 h-9 rounded-full bg-slate-700 text-white flex items-center justify-center flex-shrink-0 text-sm">
              <i class="fas fa-circle-info"></i>
            </div>
            <div class="text-sm font-bold text-slate-700 leading-snug">
              ${nombreCompleto ? `¡Hola, ${nombreCompleto}!<br>` : ''}
              <span class="font-semibold">Esta cédula ya tiene una cuenta de Dirigente.</span>
              <button type="button" onclick="irALoginDesdeRegistro('${ced}')" class="block mt-1.5 text-[var(--gold-dark)] hover:underline">Iniciar sesión en su lugar →</button>
            </div>
          </div>`;
        saludoBox.classList.remove('hidden');
        if (nombreManualWrap) nombreManualWrap.classList.add('hidden');
      } else if (nombreCompleto && saludoBox) {
        saludoBox.innerHTML = `
          <div class="pop-in flex items-start gap-3 bg-gradient-to-br from-amber-50 to-amber-100 border-2 border-amber-200 rounded-2xl px-4 py-3.5">
            <div class="w-9 h-9 rounded-full bg-amber-500 text-white flex items-center justify-center flex-shrink-0 text-sm shadow-md shadow-amber-500/30">
              <i class="fas fa-hand-sparkles"></i>
            </div>
            <p class="text-sm font-bold text-amber-900 leading-snug">¡Hola, ${nombreCompleto}! 👋<br>
              <span class="font-semibold text-amber-800">¡Qué bueno tenerte por acá! Estás a un paso de sumarte como <strong>Dirigente</strong> y empezar a liderar tu equipo. 🚀</span></p>
          </div>`;
        saludoBox.classList.remove('hidden');
        if (nombreManualWrap) nombreManualWrap.classList.add('hidden');
      } else {
        if (saludoBox) { saludoBox.classList.add('hidden'); saludoBox.innerHTML = ''; }
        if (nombreManualWrap) nombreManualWrap.classList.remove('hidden');
      }
    } catch (e) {
      if (nombreManualWrap) nombreManualWrap.classList.remove('hidden');
    }
  }, 400);
}

function irALoginDesdeRegistro(cedula) {
  state.mostrarRegistro = false;
  state.loginPaso = 1;
  state.loginCedula = cedula;
  render();
}

function avanzarRegistroPaso1() {
  const rf = state.regForm;
  const ci = document.getElementById('regCedula');
  const ni = document.getElementById('regNombreManual');
  rf.cedula = limpiarCedula(ci ? ci.value : '');
  if (!/^\d{5,8}$/.test(rf.cedula)) { mostrarErrorRegistro('Ingresá una cédula válida (5 a 8 números, sin puntos ni guiones).'); return; }
  if (rf.yaEsDirigente) { mostrarErrorRegistro('Esta cédula ya tiene una cuenta. Iniciá sesión en su lugar.'); return; }
  rf.nombre = rf.nombreEncontrado || (ni ? ni.value.trim() : '');
  if (!rf.nombre) { mostrarErrorRegistro('Ingresá tu nombre y apellido.'); return; }
  rf.error = '';
  rf.step = 2;
  render();
}

function volverRegistroPaso(n) {
  state.regForm.error = '';
  state.regForm.step = n;
  render();
}

function avanzarRegistroPaso2() {
  const rf = state.regForm;
  const pi = document.getElementById('regPassword'), pci = document.getElementById('regPasswordConfirmar');
  rf.password = pi ? pi.value : '';
  rf.confirmar = pci ? pci.value : '';
  if (rf.password.length < 4) { mostrarErrorRegistro('La contraseña debe tener al menos 4 caracteres.'); return; }
  if (rf.password !== rf.confirmar) { mostrarErrorRegistro('Las dos contraseñas no coinciden.'); return; }
  rf.error = '';
  rf.step = 3;
  render();
}

async function avanzarRegistroPaso3() {
  const rf = state.regForm;
  const pfi = document.getElementById('regTelefonoPrefijo'), ti = document.getElementById('regTelefono'), ei = document.getElementById('regEmail');
  rf.telefonoPrefijo = (pfi ? pfi.value : '+595').trim() || '+595';
  rf.telefono = (ti ? ti.value : '').replace(/\D/g, '');
  rf.email = (ei ? ei.value : '').trim();
  if (!rf.telefono || rf.telefono.length < 6) { mostrarErrorRegistro('Ingresá tu número de teléfono: lo vas a necesitar para recuperar tu cuenta.'); return; }
  if (!rf.email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(rf.email)) { mostrarErrorRegistro('Ingresá un email válido: lo vas a necesitar para recuperar tu cuenta.'); return; }
  await registrarDirigente();
}

function renderSaludoCard(nombre) {
  if (!nombre) return '';
  return `
    <div class="pop-in inline-flex items-center gap-2.5 bg-gradient-to-br from-amber-50 to-amber-100 border-2 border-amber-200 rounded-2xl px-4 py-2.5 mx-auto">
      <div class="w-7 h-7 rounded-full bg-amber-500 text-white flex items-center justify-center flex-shrink-0 text-xs shadow-md shadow-amber-500/30"><i class="fas fa-hand-sparkles"></i></div>
      <p class="text-sm font-bold text-amber-900">¡Hola, ${nombre}!</p>
    </div>`;
}

const _buscarPadronTimers = {};
function mostrarNombrePorCedula(cedulaInputId, nombreBoxId, timerKey, stateField) {
  const ci = document.getElementById(cedulaInputId);
  const nombreBox = document.getElementById(nombreBoxId);
  const ced = limpiarCedula(ci ? ci.value : '');
  clearTimeout(_buscarPadronTimers[timerKey]);
  if (!nombreBox) return;
  if (!/^\d{5,8}$/.test(ced)) {
    nombreBox.innerHTML = ''; nombreBox.classList.add('hidden');
    if (stateField) state[stateField] = '';
    return;
  }
  _buscarPadronTimers[timerKey] = setTimeout(async () => {
    try {
      const d = await apiGet({ action:'validar_cedula_candidato', cedula:ced });
      const nombreCompleto = d.success && d.encontrado ? [d.nombre, d.apellido].filter(Boolean).join(' ').trim() : '';
      if (stateField) state[stateField] = nombreCompleto;
      if (nombreCompleto) {
        nombreBox.innerHTML = renderSaludoCard(nombreCompleto);
        nombreBox.classList.remove('hidden');
        nombreBox.classList.add('text-center');
      } else {
        nombreBox.innerHTML = '';
        nombreBox.classList.add('hidden');
      }
    } catch (e) { /* si falla la búsqueda, no se muestra nombre pero el flujo sigue funcionando */ }
  }, 400);
}

function onCedulaLoginInput() {
  mostrarNombrePorCedula('cedulaInput', 'loginNombreEncontrado', 'login', 'loginNombreEncontrado');
}

function onCedulaRecuperarInput() {
  mostrarNombrePorCedula('recCedula', 'recNombreEncontrado', 'recuperar');
}

async function registrarDirigente() {
  const rf = state.regForm;
  const telefonoCompleto = rf.telefono ? (rf.telefonoPrefijo + rf.telefono) : '';
  rf.enviando = true; rf.error = ''; render();
  try {
    const d = await apiPost({ action:'registrar_dirigente', cedula:rf.cedula, nombre:rf.nombre,
      telefono:telefonoCompleto, email:rf.email, password:rf.password });
    rf.enviando = false;
    if (d.success) {
      sessionStorage.setItem('user_pw', rf.password);
      rf.step = 4; // Paso 4: bienvenida, antes de pasar al panel
      render();
      setTimeout(finalizarRegistroIrPanel, 1800);
    } else {
      rf.error = d.error || 'No se pudo completar el registro.';
      render();
    }
  } catch(e) { rf.enviando = false; rf.error = 'Error de conexión: '+e.message; render(); }
}

let _yendoAlPanel = false;
async function finalizarRegistroIrPanel() {
  if (_yendoAlPanel) return;
  _yendoAlPanel = true;
  const rf = state.regForm;
  try {
    const d2 = await apiGet({ action:'login', cedula:rf.cedula, password:rf.password });
    state.mostrarRegistro = false;
    if (d2.success && d2.usuario) {
      state.dirigente = d2.usuario; state.autenticado = true;
      sessionStorage.setItem(AUTH_SHARED_KEY, JSON.stringify(state.dirigente));
      state.regForm = { step: 1, cedula: '', nombre: '', nombreEncontrado: '', yaEsDirigente: false, telefonoPrefijo: '+595', telefono: '', email: '', password: '', confirmar: '', enviando: false, error: '' };
      await cargaInicial();
    } else {
      render();
    }
  } catch(e) {
    _yendoAlPanel = false;
    mostrarErrorRegistro('Tu cuenta se creó, pero no se pudo ingresar automáticamente. Probá iniciar sesión.');
  }
}

// ============ MOSTRAR/OCULTAR CONTRASEÑA ============
function togglePasswordVisibility(inputId, btnEl) {
  const input = document.getElementById(inputId);
  if (!input) return;
  const mostrando = input.type === 'password';
  input.type = mostrando ? 'text' : 'password';
  const icon = btnEl.querySelector('i');
  if (icon) { icon.classList.toggle('fa-eye', !mostrando); icon.classList.toggle('fa-eye-slash', mostrando); }
}

// ============ MI PERFIL (completar teléfono/email faltantes) ============
function togglePerfil(mostrar) {
  state.mostrarPerfil = mostrar;
  state.perfilError = '';
  render();
}

async function guardarContactoDirigente() {
  const ti = document.getElementById('perfilTelefono'), ei = document.getElementById('perfilEmail');
  const telefono = (ti ? ti.value : '').trim();
  const email = (ei ? ei.value : '').trim();
  if (!telefono && !email) { state.perfilError = 'Ingresá al menos un dato para guardar.'; render(); return; }
  state.perfilGuardando = true; state.perfilError = ''; render();
  try {
    const d = await apiPost({ action: 'actualizar_contacto_dirigente', telefono, email });
    state.perfilGuardando = false;
    if (d.success) {
      state.dirigente.telefono = d.telefono;
      state.dirigente.email = d.email;
      sessionStorage.setItem(AUTH_SHARED_KEY, JSON.stringify(state.dirigente));
      state.mensaje = 'Datos de contacto actualizados.'; state.msgTipo = 'ok';
      state.mostrarPerfil = false;
      render();
    } else {
      state.perfilError = d.error || 'No se pudo guardar.';
      render();
    }
  } catch (e) { state.perfilGuardando = false; state.perfilError = 'Error de conexión: ' + e.message; render(); }
}

function renderPerfilModal() {
  const d = state.dirigente;
  return `
    <div class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/50" onclick="if(event.target===this) togglePerfil(false)">
      <div class="pop-in bg-white rounded-[2rem] p-7 md:p-9 shadow-2xl max-w-md w-full">

function toggleRecuperar(mostrar) {

async function recuperarPassword() {
  const rf = state.recForm;
  const ci = document.getElementById('recCedula'), pfi = document.getElementById('recTelefonoPrefijo'),
        ti = document.getElementById('recTelefono'), ei = document.getElementById('recEmail');
  rf.cedula = limpiarCedula(ci ? ci.value : '');
  rf.telefonoPrefijo = (pfi ? pfi.value : '+595').trim() || '+595';
  rf.telefono = (ti ? ti.value : '').replace(/\D/g, '');
  rf.email = (ei ? ei.value : '').trim();
  if (!rf.cedula || (!rf.telefono && !rf.email)) { alert('Completá tu cédula y al menos tu teléfono o tu email.'); return; }
  const telefonoCompleto = rf.telefono ? (rf.telefonoPrefijo + rf.telefono) : '';
  rf.enviando = true; render();
  try {
    const r = await fetch('/api/recuperar_password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cedula: rf.cedula, telefono: telefonoCompleto, email: rf.email })
    });
    const d = await r.json();
    rf.enviando = false;
    if (d.success) {
      const canales = [];
      if (d.enviado_sms) canales.push('SMS/WhatsApp');
      if (d.enviado_email) canales.push('email');
      const envioTexto = canales.length ? ('Se envió por: ' + canales.join(' y ') + '.') : 'No se pudo enviar por SMS ni email en este entorno (faltan credenciales de Twilio/SMTP), pero la contraseña ya es válida.';
      alert('Contraseña restablecida. Tu nueva contraseña temporal es: ' + d.nueva_contrasena + '\n' + envioTexto);
      state.mostrarRecuperar = false;
      state.recForm = { cedula: '', telefonoPrefijo: '+595', telefono: '', email: '', enviando: false };
      render();
    } else {
      alert(d.error || 'No se pudo restablecer la contraseña. Verificá que la cédula y el teléfono o email coincidan con los de tu registro.');
      render();
    }
  } catch(e) { rf.enviando = false; alert('Error de conexión: '+e.message); render(); }
}

async function cargarMovilidad() {
  if (!state.dirigente) return;
  try {
    const r = await fetch(`/api/dirigente/movilidad?cedula=${encodeURIComponent(state.dirigente.cedula)}&v=${Date.now()}`).then(x => x.json());
    state.movilidad = r.success ? r : null;

  } catch (e) { state.movilidad = null; }
  render();
  if (state.tab === 'transporte') setTimeout(initMapaUbicacionDirigente, 50);
}

function initMapaUbicacionDirigente() {
  const el = document.getElementById('mapaUbicacionDirigente');
  if (!el || typeof L === 'undefined' || mapaUbicacionDirigente) return;
  const centro = coordsUbicacionDirigente ? [coordsUbicacionDirigente.lat, coordsUbicacionDirigente.lng] : [-25.2637, -57.5759];
  mapaUbicacionDirigente = L.map('mapaUbicacionDirigente').setView(centro, 14);
  // Sin tiles externos: la app funciona 100% offline, sin depender de internet para el mapa.
  if (coordsUbicacionDirigente) marcadorUbicacionDirigente = L.marker(centro).addTo(mapaUbicacionDirigente);
  mapaUbicacionDirigente.on('click', (e) => {
    coordsUbicacionDirigente = e.latlng;
    if (marcadorUbicacionDirigente) marcadorUbicacionDirigente.setLatLng(coordsUbicacionDirigente);
    else marcadorUbicacionDirigente = L.marker(coordsUbicacionDirigente).addTo(mapaUbicacionDirigente);
  });
}

function usarGPSUbicacionDirigente() {
  if (!navigator.geolocation) { state.mensaje = '⚠️ Tu navegador no soporta geolocalización'; state.msgTipo = 'error'; render(); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      coordsUbicacionDirigente = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (mapaUbicacionDirigente) {
        mapaUbicacionDirigente.setView([coordsUbicacionDirigente.lat, coordsUbicacionDirigente.lng], 15);
        if (marcadorUbicacionDirigente) marcadorUbicacionDirigente.setLatLng(coordsUbicacionDirigente);
        else marcadorUbicacionDirigente = L.marker(coordsUbicacionDirigente).addTo(mapaUbicacionDirigente);
      }
      state.mensaje = '📍 Ubicación GPS marcada. Tocá "Guardar ubicación marcada" para confirmar.'; state.msgTipo = 'ok'; render();
    },
    (err) => { state.mensaje = '⚠️ No se pudo obtener tu ubicación: ' + err.message; state.msgTipo = 'error'; render(); },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function esc_(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

// Los teléfonos se cargan en formato local paraguayo ("0994 340 472"). wa.me y tel:
// necesitan el número internacional completo (sin el 0 inicial, con 595 adelante);
// si se manda el número local tal cual, WhatsApp no reconoce la cuenta y muestra la
// pantalla genérica de "descargar/usar WhatsApp Web" en vez del chat.
function telInternacional(telefono) {
  let d = String(telefono || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('595')) return d;
  if (d.startsWith('0')) d = d.slice(1);
  return '595' + d;
}

  if (!confirm('¿Cancelar esta solicitud de transporte?')) return;
  try {

      body: JSON.stringify({ solicitud_id: solicitudId, dirigente_cedula: state.dirigente.cedula })

async function verConductorSubMapa(rutaId) {
  // Try to find the conductor for this ruta
  try {
    const r = await fetch('/api/conductor/lista?v=' + Date.now()).then(r => r.json());
    const conductores = r.conductores || [];
    // We need to find which conductor is assigned to this ruta
    // Fetch ruta details
    const rutaResp = await fetch('/api?action=rutas&v=' + Date.now()).then(r => r.json());
    const rutas = (rutaResp.rutas || []).filter(rt => rt.id === rutaId);
    if (rutas.length === 0) { alert('Ruta no encontrada'); return; }
    const ruta = rutas[0];
    const cedCond = ruta.cedula_conductor || '';
    if (!cedCond) { alert('Esta ruta no tiene conductor asignado aún'); return; }

    // Get last location of the conductor
    const ubiResp = await fetch('/api/conductor/ultima_ubicacion?cedula=' + encodeURIComponent(cedCond) + '&v=' + Date.now()).then(r => r.json());
    if (!ubiResp.success) { alert('Conductor sin ubicación GPS disponible'); return; }
    const ubi = ubiResp.ubicacion;

    state.subMapaActivo = {
      conductor_nombre: ubi.conductor_nombre || cedCond,
      lat: ubi.lat, lng: ubi.lng,
      placa: ubi.placa || '',
      origen: ubi.viaje_origen || ruta.origen || '',
      destino: ubi.viaje_destino || ruta.destino || ''
    };
    render();
    setTimeout(() => {
      const el = document.getElementById('submapa-conductor');
      if (!el) return;
      const mapa = L.map(el).setView([ubi.lat, ubi.lng], 15);
      // Sin tiles externos: la app funciona 100% offline, sin depender de internet para el mapa.
      document.getElementById('submapa-info').textContent = `${ubi.conductor_nombre || cedCond} · ${ubi.placa || ''}${state.subMapaActivo.origen ? ` · ${state.subMapaActivo.origen} → ${state.subMapaActivo.destino}` : ''}`;
      L.marker([ubi.lat, ubi.lng]).addTo(mapa)
        .bindPopup(`<strong>${ubi.conductor_nombre}</strong><br>${ubi.placa}`)
        .openPopup();
      setTimeout(() => mapa.invalidateSize(), 200);
      document.getElementById('submapa-modal').classList.remove('hidden');
    }, 100);
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

async function buscarPadron() {
  const rawCed = document.getElementById('bCedula')?.value || '';
  const ced = limpiarCedula(rawCed);
  const ape = document.getElementById('bApellido')?.value || '';
  const nom = document.getElementById('bNombre')?.value || '';
  const depto = document.getElementById('bDepart')?.value || '';
  const dist = document.getElementById('bDistrito')?.value || '';

  const soloNV = document.getElementById('bSoloNV')?.checked || false;
      state.busqueda.cedula = ced; state.busqueda.apellido = ape; state.busqueda.nombre = nom;
      state.busqueda.depart = depto; state.busqueda.distrito = dist;
      state.busqueda.soloNoVotaron = soloNV;
      state.busqueda.buscando = true; state.busqueda.resultados = []; state.busqueda.vacio = false;
  render();

  try {
    // Detect multiple cedulas: split by space, comma, semicolon, or dash
    const separators = /[\s,;–—-]+/;
    const partes = rawCed.split(separators).map(s => s.trim().replace(/[.\s]/g,'')).filter(s => s.length >= 3);
    const multiples = partes.length > 1;

    if (multiples) {
      // Bulk search: call buscar_elector for each cedula in parallel
      const promises = partes.map(async (c) => {
        try {
          const d = await apiGet({ action:'buscar_elector', cedula:c });
          return d.success ? d.elector : null;
        } catch(e) { return null; }
      });
      const results = await Promise.all(promises);
      state.busqueda.resultados = results.filter(r => r !== null);
      state.busqueda.vacio = state.busqueda.resultados.length === 0;
      if (state.busqueda.resultados.length > 0) {
        state.mensaje = '✅ ' + state.busqueda.resultados.length + ' electores encontrados de ' + partes.length; state.msgTipo = 'ok';
      } else {
        state.mensaje = '⚠️ Ninguna cédula encontrada'; state.msgTipo = 'warn';
      }
    } else {
      // Normal multi-field search
      const params = { action:'buscar_padron', cedula:ced, dirigente:ape, nombre:nom };
      if (depto) { params.mesa = parseInt(depto); }
      if (dist) { params.orden = dist; }
      if (soloNV) { params.estado = 'no_votaron'; }
      const d = await apiGet(params);
      state.busqueda.resultados = d.electores || [];
      state.busqueda.vacio = d.total === 0;
    }
  } catch(e) {
    state.mensaje = 'Error al buscar: '+e.message; state.msgTipo = 'error';
  }
  state.busqueda.buscando = false; render();
}

function limpiarBusqueda() {
  state.busqueda = { cedula:'', apellido:'', nombre:'', depart:'', distrito:'', resultados:[], buscando:false, vacio:false, soloNoVotaron:false };
  ['bCedula','bApellido','bNombre'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  ['bDepart','bDistrito'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  const cb = document.getElementById('bSoloNV'); if(cb) cb.checked = false;
  render();
}

}

function cargosDisponibles() {
  const cargos = [...new Set((state.misCandidatos || []).map(mc => mc.cargo))];
  return cargos;
}

function candidatosDelCargo(cargo) {
  return (state.misCandidatos || []).filter(mc => mc.cargo === cargo);
}

function cargoEsAmbiguo(cargo) {
  return candidatosDelCargo(cargo).length > 1;
}

async function agregarPosible(el) {
  if (!state.dirigente) return;
  // Check if already in list
  if (state.misPosibles.find(p => p.votante_cedula === el.cedula)) {
    state.mensaje = '⚠️ ' + el.nombreCompleto + ' ya está en tu lista'; state.msgTipo = 'warn'; render(); return;
  }
  // Un voto puede destinarse a varios cargos a la vez (Intendente Y Concejal). Por
  // cada cargo: si hay un único candidato se asigna solo; si hay dos o más, se
  // toma la elección hecha en el selector correspondiente.
  const cargos = cargosDisponibles();
  const candidatoIds = [];
  for (const cargo of cargos) {
    const delCargo = candidatosDelCargo(cargo);
    if (delCargo.length === 1) {
      candidatoIds.push(delCargo[0].candidato_id);
    } else if (delCargo.length > 1) {
      const sel = document.getElementById('cand-sel-' + el.cedula + '-' + cargo);
      const val = sel && sel.value ? parseInt(sel.value) : null;
      if (val) candidatoIds.push(val);
    }
  }
  try {
    const d = await apiPost({
      action:'posible_voto',
      dirigente_cedula:state.dirigente.cedula,
      votante_cedula:el.cedula,
      votante_nombre:el.nombreCompleto,
      votante_apellido:el.apellido,
      votante_mesa:el.mesa,
      votante_orden:el.orden,
      votante_departamento:el.departamento || '',
      votante_distrito:el.distrito || '',
      votante_zona:el.zona || '',
      candidatos:candidatoIds
    });
    if (d.success) {
      state.mensaje = '✅ ' + el.nombreCompleto + ' agregado a PosiblesVotos'; state.msgTipo = 'ok';
      await cargarMisPosibles();
    } else {
      state.mensaje = '⚠️ ' + (d.error || 'Error'); state.msgTipo = 'warn';
    }
  } catch(e) {
    state.mensaje = '⚠️ Error: '+e.message; state.msgTipo = 'error';
  }
  render();
}

  if (estadoBox) {
    estadoBox.innerHTML = '<span class="text-slate-400"><i class="fas fa-spinner fa-spin mr-1"></i>Buscando en el padrón...</span>';
    estadoBox.classList.remove('hidden');
  }
  _buscarPadronTimerCargar = setTimeout(async () => {
    try {
      const d = await apiGet({ action:'validar_cedula_candidato', cedula:ced });
      const nombreCompleto = d.success && d.encontrado ? [d.nombre, d.apellido].filter(Boolean).join(' ').trim() : '';
      if (f.cedula !== ced) return; // la cédula ya cambió mientras esperábamos la respuesta
      if (nombreCompleto) {
        f.nombre = nombreCompleto; f.enContrado = true;
        f.mesa = d.mesa || ''; f.orden = d.orden || '';
        f.departamento = d.departamento || ''; f.distrito = d.distrito || ''; f.zona = d.zona || '';
        if (estadoBox) estadoBox.innerHTML = '<span class="text-emerald-600 font-bold"><i class="fas fa-check-circle mr-1"></i>' + nombreCompleto + '</span>';
        if (btn) btn.disabled = false;
      } else {
        if (estadoBox) estadoBox.innerHTML = '<span class="text-red-500 font-bold"><i class="fas fa-circle-exclamation mr-1"></i>No está en el padrón — no se puede cargar.</span>';
      }
    } catch (e) {
      if (estadoBox) estadoBox.innerHTML = '<span class="text-red-500 font-bold">Error buscando en el padrón.</span>';
    }
  }, 400);
}

async function enviarCargarPorCedula() {
  const f = state.cargarForm;
  const ced = f.cedula;
  const nombre = f.nombre;
  if (!f.enContrado || !ced || !nombre) { alert('La cédula tiene que estar en el padrón para poder cargarla.'); return; }
  // Importante: leer los selectores de candidato ANTES de re-renderizar (el
  // render siguiente recrea el formulario entero y perdería la selección hecha).
  const esVotante = f.tipo === 'voto_seguro' || f.tipo === 'voto_posible';
  const candidatoIds = [];
  if (esVotante) {
    for (const cargo of cargosDisponibles()) {
      const delCargo = candidatosDelCargo(cargo);
      if (delCargo.length === 1) {
        candidatoIds.push(delCargo[0].candidato_id);
      } else if (delCargo.length > 1) {
        const sel = document.getElementById('cargarCandSel-' + cargo);
        const val = sel && sel.value ? parseInt(sel.value) : null;
        if (val) candidatoIds.push(val);
      }
    }
  }
  f.enviando = true; render();
  try {
    if (esVotante) {
      // Reutiliza las mismas acciones que el flujo de búsqueda en padrón, pero con
      // datos cargados a mano (sin depender de que la persona esté en el padrón).
      const add = await apiPost({
        action: 'posible_voto',
        dirigente_cedula: state.dirigente.cedula,
        votante_cedula: ced,
        votante_nombre: nombre,
        votante_mesa: f.mesa || '',
        votante_orden: f.orden || '',
        votante_departamento: f.departamento || '',
        votante_distrito: f.distrito || '',
        votante_zona: f.zona || '',
        candidatos: candidatoIds
      });
      if (!add.success && !/ya está/i.test(add.error || '')) {
        state.mensaje = '⚠️ ' + (add.error || 'Error'); state.msgTipo = 'warn';
      } else if (f.tipo === 'voto_posible') {
        // Voto Posible: queda cargado sin confirmar todavía.
        state.mensaje = '✅ ' + nombre + ' cargado como Voto Posible'; state.msgTipo = 'ok';
        state.cargarForm = { tipo: 'voto_posible', cedula: '', nombre: '', email: '', enContrado: false, buscando: false, enviando: false };
        await cargarMisPosibles();
      } else {
        const conf = await apiPost({
          action: 'confirmar_voto_seguro',
          dirigente_cedula: state.dirigente.cedula,
          votante_cedula: ced
        });
        if (conf.success) {
          state.mensaje = '✅ ' + nombre + ' cargado como Voto Seguro'; state.msgTipo = 'ok';
          state.cargarForm = { tipo: 'voto_seguro', cedula: '', nombre: '', email: '', enContrado: false, buscando: false, enviando: false };
          await cargarMisPosibles();
        } else {
          state.mensaje = '⚠️ ' + (conf.error || 'Error'); state.msgTipo = 'warn';
        }
      }
    } else {
      // Sub-dirigente: hereda automáticamente el PC/candidato del dirigente que lo carga.
      // Si se carga el mail, el sistema le crea la cuenta y le avisa por correo.
      if (!f.email || !/.+@.+\..+/.test(f.email)) {
        state.mensaje = '⚠️ Cargá el mail del sub-dirigente para crearle la cuenta'; state.msgTipo = 'warn';
        f.enviando = false; render(); return;
      }
      const d = await apiPost({
        action: 'dirigente_crear_subdirigente',
        cedula: ced,
        nombre: nombre,
        email: f.email,
        tipo: 'dirigente'
      });
      if (d.success) {
        state.mensaje = d.email_enviado
          ? `✅ ${nombre} cargado como dirigente. Le enviamos la cuenta a ${f.email}`
          : `✅ ${nombre} cargado como dirigente. Su contraseña inicial es: ${d.password_default} (no se pudo enviar el mail)`;
        state.msgTipo = 'ok';
        state.cargarForm = { tipo: 'sub_dirigente', cedula: '', nombre: '', email: '', enContrado: false, buscando: false, enviando: false };
      } else {
        state.mensaje = '⚠️ ' + (d.error || 'Error'); state.msgTipo = 'warn';
      }
    }
  } catch (e) {
    state.mensaje = '⚠️ Error: ' + e.message; state.msgTipo = 'error';
  }
  f.enviando = false;
  render();
}

function onDropArchivoCarga(event) {
  event.preventDefault(); event.stopPropagation();
  const dz = document.getElementById('dropzoneArchivo');
  if (dz) dz.classList.remove('border-amber-400', 'bg-amber-50');
  const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
  if (file) onSeleccionArchivoCarga(file);
}

async function onSeleccionArchivoCarga(file) {
  if (!file) return;
  const a = state.cargarArchivo;
  a.error = ''; a.procesando = true; a.nombreArchivo = file.name;
  render();
  try {
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch(API_URL + '/dirigente/parsear_archivo', { method: 'POST', body: fd });
    const d = await r.json();
    a.procesando = false;
    if (d.success) {
      a.filas = d.filas;
    } else {
      a.error = d.error || 'No se pudo leer el archivo.';
    }
  } catch (e) {
    a.procesando = false;
    a.error = 'Error de conexión: ' + e.message;
  }
  render();
}

function cancelarPreviewArchivo() {
  state.cargarArchivo = { nombreArchivo: '', filas: null, procesando: false, confirmando: false, resultados: null, error: '', arrastrando: false };

async function confirmarCargaMasiva() {
  const a = state.cargarArchivo;
  const f = state.cargarForm;
  a.confirmando = true; render();
  try {
    const r = await fetch(API_URL + '/dirigente/cargar_masivo', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tipo: f.tipo, filas: a.filas, cedula_auth: state.dirigente.cedula, password_auth: sessionStorage.getItem('dirigente_pw') || sessionStorage.getItem('user_pw') || '' })
    });
    const dd = await r.json();
    a.confirmando = false;
    if (dd.success) {
      a.resultados = { ok: dd.ok, total: dd.total, filas: dd.resultados };
    } else {
      a.error = dd.detail || dd.error || 'No se pudo completar la carga.';
      a.filas = null;
    }
  } catch (e) {
    a.confirmando = false;
    a.error = 'Error de conexión: ' + e.message;
  }
  render();
}

function descargarExcelDirigente() {

  const url = API_URL + '/dirigente/exportar_excel?cedula=' + encodeURIComponent(u.cedula) + '&password=' + encodeURIComponent(pw);
  window.location.href = url;

          class="py-2.5 rounded-2xl font-black text-[11px] transition-all ${state.tab==='tareas' ? 'bg-slate-900 text-gold-light border border-gold-subtle shadow-lg' : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-50'}">
          <i class="fas fa-tasks mr-1"></i> Tareas
        </button>
      </div>

      ${state.tab === 'buscar' ? renderBuscar() : state.tab === 'seguimiento' ? renderSeguimiento() : state.tab === 'candidatos' ? renderCandidatos() : state.tab === 'transporte' ? renderTransporte() : state.tab === 'cargar' ? renderCargarPorCedula() : state.tab === 'local' ? renderOperativoLocal() : state.tab === 'actividad' ? renderActividadVotantes() : state.tab === 'tareas' ? renderTareas() : renderLista()}
    </main>`;
}

function filtrarPor(key) {
  if (state.filtroStatus === key) {

async function eliminarCandidato(candidatoId) {
  const c = state.misCandidatos.find(c => c.candidato_id === candidatoId);
  if (!confirm('¿Quitar ' + (c?.nombre || 'este candidato') + '?')) return;
  try {
    const d = await apiPost({ action:'eliminar_candidato', dirigente_cedula:state.dirigente.cedula, candidato_id:candidatoId });
    if (d.success) {
      state.mensaje = '🗑️ Candidato removido'; state.msgTipo = 'ok';
      await cargarCandidatos();
    } else {
      state.mensaje = '⚠️ ' + (d.error || 'Error'); state.msgTipo = 'warn'; render();
    }
  } catch(e) { state.mensaje = '⚠️ Error: '+e.message; state.msgTipo = 'error'; render(); }
}

  const nom = prompt(`Nombre del ${pcLabel} / Grupo:`);

  const zona = prompt('Zona (opcional):') || '';

// ============ TELÉFONO ============
async function guardarTelefono(cedula) {
  const input = document.getElementById('tel-' + cedula);
  if (!input) return;
  const tel = input.value.replace(/\D/g, '');
  // No guardar si está vacío y no había nada antes (evita llamadas inútiles al abrir)
  if (!tel) return;
  if (tel.length < 8 || tel.length > 15) {
    input.value = tel;
    return;
  }
  // Si el valor no cambió respecto a lo guardado, no hacemos nada
  const actual = (state.misPosibles.find(x => String(x.votante_cedula) === String(cedula)) || {}).telefono || '';
  if (actual === tel) return;
  try {
    const r = await apiPost({
      action: 'guardar_telefono_votante',
      dirigente_cedula: state.dirigente.cedula,
      votante_cedula: cedula,
      telefono: tel
    });
    if (r.success) {
      // Actualizar el item en TODAS las fuentes de estado para que el cambio
      // se refleje al instante (botones SP/CP, enlace WhatsApp, botón Llamar).
      const upd = (arr) => { const it = arr && arr.find(x => String(x.votante_cedula) === String(cedula)); if (it) it.telefono = r.telefono; };
      if (state.misPosibles) upd(state.misPosibles);
      if (state.seguimiento && state.seguimiento.items) upd(state.seguimiento.items);
      // Re-renderizar para activar los botones con color
      render();
    }
  } catch (e) {
    // Silencioso: si falla la red, el usuario puede reintentar al salir del campo
    console.error('Error guardando teléfono:', e);
  }
}

// ============ WHATSAPP ============
function enviarWhatsApp(item, conPublicidad) {
  // Este votante tiene sus propios candidatos destinados, uno por cargo (no se le manda
  // publicidad de TODOS los candidatos que apoya el dirigente, solo los que le corresponden).
  const candidatosDelVotante = (item.candidatos && item.candidatos.length) ? item.candidatos : state.misCandidatos;
  const int = candidatosDelVotante.filter(c => c.cargo === 'intendente');
  const con = candidatosDelVotante.filter(c => c.cargo === 'concejal');

  const candidatos = conPublicidad ? [...int, ...con].map(c => {
    const cargo = c.cargo === 'intendente' ? 'Intendencia' : 'Junta Municipal';
    const meta = [c.lista_nro != null && c.lista_nro !== '' ? `Lista ${c.lista_nro}` : '', c.orden != null && c.orden !== '' ? `Opción ${c.orden}` : ''].filter(Boolean).join(' · ');
    return `- *${cargo}:* ${c.nombre}${meta ? ` (${meta})` : ''}`;
  }).join('\n') : '';
  const bloqueCandidatos = candidatos ? `*Candidaturas que apoyás*\n${candidatos}` : '';
  const urlConsulta = new URL('/consulta_mesa.html', location.origin).toString();
  const valores = {nombre: item.votante_nombre || 'Hola', mesa: item.votante_mesa || 'No disponible',
    orden: item.votante_orden || 'No disponible', local: [item.votante_departamento, item.votante_distrito, item.votante_zona].filter(Boolean).join(' · ') || 'Consulta el enlace',
    url_consulta: urlConsulta, candidatos: bloqueCandidatos};
  const plantilla = state.plantillaWhatsapp || state.plantillaWhatsappGeneral ||
    'Hola {nombre}, te compartimos tus datos para la jornada electoral.\n\n*Tu lugar de votación*\n{local}\n\n*Mesa:* {mesa} · *Orden:* {orden}\n\n*Consultá dónde votás:*\n{url_consulta}\n\n{candidatos}\n\nGracias por participar.';
  const txt = plantilla.replace(/\{(nombre|mesa|orden|local|url_consulta|candidatos)\}/g, (_, key) => valores[key])
    .replace(/\n{3,}/g, '\n\n').trim();

  const url = (item.telefono && item.telefono.length >= 8)
    ? 'https://wa.me/' + telInternacional(item.telefono) + '?text=' + encodeURIComponent(txt)
    : 'https://wa.me/?text=' + encodeURIComponent(txt);
  window.open(url, '_blank');
}

async function cargarPlantillaWhatsapp() {
  try {
    const partidoId = state.dirigente?.partido_id || state.partidoId || '';
    const cedulaDirigente = state.dirigente?.cedula || '';
    // Cadena completa: si el dirigente tiene su propio mensaje (plantilla_dirigente), ese es el
    // que se usa al mandar; si no, hereda del partido, y si tampoco hay, del institucional.
    // state.plantillaWhatsapp queda como el mensaje YA RESUELTO (plantilla_activa) para enviar;
    // state.plantillaWhatsappPropia es solo lo que el dirigente cargó él mismo (para el editor).
    const d = await apiGet({action:'whatsapp_plantilla_votacion', id:partidoId, dirigente:cedulaDirigente});
    if (d.success) {
      state.plantillaWhatsapp = d.plantilla_activa || '';
      state.plantillaWhatsappGeneral = d.plantilla_general || '';
      state.plantillaWhatsappPropia = d.plantilla_dirigente || '';
    }
  } catch (_) { /* usa plantilla institucional embebida de reserva */ }
}

async function editarPlantillaWhatsapp() {
  if (!state.plantillaWhatsapp) await cargarPlantillaWhatsapp();
  // Si ya tenés tu propio mensaje cargado, se edita ese; si no, arranca mostrando el heredado
  // (del partido o institucional) como punto de partida, pero al guardar queda como TU PROPIO
  // mensaje — ya no pisa el del partido ni el de ningún otro dirigente.
  const actual = state.plantillaWhatsappPropia || state.plantillaWhatsapp || '';
  const cuerpo = prompt('Editá TU mensaje (no afecta el del partido ni el de otros dirigentes). Variables: {nombre}, {mesa}, {orden}, {local}, {url_consulta}, {candidatos}. Formato WhatsApp: *negrita*, _cursiva_, ~tachado~, - lista y URL completa para enlace.', actual);
  if (cuerpo == null || !cuerpo.trim()) return;
  const r = await apiPost({action:'whatsapp_plantilla_guardar', alcance:'dirigente', cuerpo:cuerpo.trim()});
  if (!r.success) { alert(r.detail || r.error || 'No se pudo guardar la plantilla.'); return; }
  state.plantillaWhatsapp = cuerpo.trim(); state.plantillaWhatsappPropia = cuerpo.trim();
  alert('Tu mensaje de WhatsApp quedó guardado.');
}

// Le pide al votante (sin que necesite cuenta en el sistema) que comparta su ubicación
// y vea la hora de recogida / el conductor, mandándole un enlace público por WhatsApp.
async function enviarLinkUbicacion(item) {
  // Abrir la pestaña ANTES del await: si se abre después, el navegador pierde el
  // permiso de popup que da el click original y la bloquea en silencio (sobre todo en celular).
  const win = window.open('', '_blank');
  try {
    const r = await fetch('/api/votante/link_ubicacion', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dirigente_cedula: state.dirigente.cedula, posible_voto_id: item.id })
    });
    const res = await r.json();
    if (!res.success) { if (win) win.close(); alert(res.error || 'No se pudo generar el enlace'); return; }
    const linkCorto = res.link_corto || res.link;
    const txt = `🗳️ *DIA D MASTER*\n\nHola ${item.votante_nombre || ''}, te vamos a ayudar a llegar a votar.\n\nCompartí tu ubicación acá para que te vayamos a buscar:\n\n👉 ${linkCorto}`;
    const url = (item.telefono && item.telefono.length >= 8)
      ? 'https://wa.me/' + telInternacional(item.telefono) + '?text=' + encodeURIComponent(txt)
      : 'https://wa.me/?text=' + encodeURIComponent(txt);
    if (win) win.location.href = url; else window.open(url, '_blank');
  } catch (e) { if (win) win.close(); alert('Error: ' + e.message); }
}

function buscarConcejalEnArbol(candidatoId) {
  const arbol = state.jerarquia?.arbol || [];
  for (const intendente of arbol) {
    const con = (intendente.concejales || []).find(c => c.id === candidatoId);
    if (con) return con;
  }
  return null;
}

function renderGruposConcejal(con) {
  if (!con) return '<div class="px-4 pb-3 text-[10px] text-slate-400 italic">Cargando equipos...</div>';
  return '<div class="border-t border-slate-100 px-4 py-3 space-y-2">'+
    (con.grupos.length === 0 ? '<p class="text-[10px] text-slate-400 italic">Sin equipos (PC) todavía.</p>' : '')+
    con.grupos.map(g => {
      const gk = 'grp_' + g.id;
      const expGrp = !!state.jerarquiaExpand[gk];

            '<button onclick="var e=document.getElementById(&apos;addDir_'+g.id+'&apos;);asignarDirigenteGrupo('+g.id+',e.value.replace(/[^0-9]/g,&apos;&apos;));e.value=&apos;&apos;"'+
            ' class="px-2 py-1 bg-purple-600 text-white text-[10px] font-black rounded-lg">+</button>'+

  '</div>';
}

// Jerarquía simplificada: primero el Intendente, después los Concejales con
// quien trabaja este dirigente, y al lado el número de votos que les destinó
// (votantes cargados por este dirigente y vinculados a ese candidato).
function renderJerarquia() {
  const mis = state.misCandidatos || [];
  const intendente = mis.find(c => c.cargo === 'intendente');
  const concejales = mis.filter(c => c.cargo === 'concejal');

  if (mis.length === 0) {
    return `
      <div class="text-center py-10 text-slate-400 bg-white rounded-2xl border border-slate-100">
        <i class="fas fa-users-slash text-3xl mb-2"></i>
        <p class="font-bold text-sm">Todavía no asignaste candidatos</p>
        <p class="text-xs mt-1">Andá a "Asignar Candidatos" para elegir con quién vas a trabajar.</p>
      </div>`;
  }

  const badgeVotos = (votos) => `
    <div class="text-center flex-shrink-0 bg-emerald-50 rounded-xl px-3 py-1.5">
      <p class="text-lg font-black text-emerald-600 leading-none">${votos}</p>
      <p class="text-[7px] font-black text-emerald-500 uppercase tracking-wide">votos</p>
    </div>`;

  const cardIntendente = intendente ? `
    <div class="bg-white rounded-2xl shadow-md border-l-4 p-4 flex items-center justify-between gap-3" style="border-left-color:${intendente.lista_color}">
      <div class="min-w-0 flex-1">
        <p class="font-black text-slate-900 text-base truncate"><i class="fas fa-star text-yellow-500 mr-1.5"></i>${intendente.nombre}</p>
        <p class="text-[10px] text-slate-500 mt-0.5 ml-5">Intendente · Lista ${intendente.lista_nro} · ${intendente.lista_nombre || ''}</p>
      </div>
      ${badgeVotos(intendente.votos_destinados)}
    </div>` : `
    <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-center text-xs text-amber-700 font-bold">
      Todavía no asignaste un intendente. Andá a "Asignar Candidatos".
    </div>`;

  const cardConcejal = (c) => {
    const nodoArbol = buscarConcejalEnArbol(c.candidato_id);
    const ck = 'con_' + c.candidato_id;
    const exp = !!state.jerarquiaExpand[ck];
    return `
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-3 flex items-center justify-between gap-3 cursor-pointer hover:bg-slate-50" onclick="toggleNodo('${ck}')">
        <div class="min-w-0 flex-1">
          <p class="font-black text-slate-900 text-sm truncate"><i class="fas fa-user text-purple-500 mr-1.5"></i>${c.nombre}</p>
          <p class="text-[10px] text-slate-500 mt-0.5 ml-5">Concejal · Lista ${c.lista_nro} · ${c.lista_nombre || ''}</p>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          ${badgeVotos(c.votos_destinados)}
          <i class="fas fa-chevron-${exp ? 'up' : 'down'} text-slate-300 text-xs"></i>
        </div>
      </div>
      ${exp ? renderGruposConcejal(nodoArbol) : ''}
    </div>`;
  };

  return `
    <div class="fade-in space-y-4">
      <div>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">1 · Intendente</p>
        ${cardIntendente}
      </div>
      <div>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">2 · Concejales con los que trabajás ${concejales.length ? `(${concejales.length})` : ''}</p>
        <div class="space-y-2">
          ${concejales.length === 0 ? '<p class="text-xs text-slate-400 italic px-1">Todavía no asignaste concejales.</p>' : concejales.map(cardConcejal).join('')}
        </div>
      </div>
    </div>`;
}

// ============ MI LOCAL (seguimiento operativo de un local electoral especifico) ============
// Al abrir la pestaña, en vez de obligar a buscar el local a mano entre todo el pais,
// se detecta automaticamente el/los locales donde el dirigente ya tiene votos cargados
// (cruzando posible_votos con el padron) y se muestra directo el que tiene mas votos.
async function abrirMiLocal() {
  const L = state.local;
  if (L.misLocalesCargado) { render(); return; }
  L.misLocalesCargado = true;
  const miCedula = state.dirigente?.cedula || '';
  try {
    const d = await apiGet({ action: 'mis_locales_votos', dirigente: miCedula });
    if (d.success) L.misLocales = d.locales || [];
  } catch (e) { /* silent */ }
  cargarSubdirigentes();
  cargarTareas();
  cargarMesasEstado();
  cargarTrasladosVotantes();
  if (L.misLocales.length > 0) {
    await aplicarLocalSugerido(L.misLocales[0]);
  } else {
    // No hay locales con votantes: mostrar mensaje, NO datos nacionales
    L.sinVotantes = true;
    L.cargando = false;
    render();
  }
}

// ============ MIS SUB-DIRIGENTES (equipo, local delegado y rendimiento) ============
async function cargarSubdirigentes() {
  const L = state.local;

  try {
    const d = await apiGet({ action: 'mis_subdirigentes', dirigente: miCedula });

  L.subdirigentesCargado = true;

}

// ============ TRASLADOS DE MIS VOTANTES (busqueda/ida/vuelta — vista de solo lectura) ============
async function cargarTrasladosVotantes() {
  try {
    const r = await fetch('/api/transporte/viajes_de_mis_votantes?dirigente_cedula=' + encodeURIComponent(state.dirigente?.cedula || ''));
    const d = await r.json();
    if (d.success) {
      // Agrupar por votante: cada uno con sus hasta-3 tramos, en orden busqueda->ida->vuelta.
      const porVotante = {};
      const orden = { busqueda: 0, ida: 1, vuelta: 2 };
      (d.viajes || []).forEach(v => {
        if (!porVotante[v.votante_cedula]) porVotante[v.votante_cedula] = { votante_nombre: v.votante_nombre, tramos: [] };
        porVotante[v.votante_cedula].tramos.push(v);
      });
      Object.values(porVotante).forEach(p => p.tramos.sort((a, b) => orden[a.tipo] - orden[b.tipo]));
      state.local.trasladosVotantes = Object.values(porVotante);
    }
  } catch (e) { /* silent */ }
  render();
}

async function guardarAsignacionLocalSub() {
  const a = state.local.asignandoSub;
  if (!a.distrito || !a.seccional || !a.local) { alert('Elegí distrito, seccional y local.'); return; }
  const localObj = a.localesGeo.find(l => String(l.id) === String(a.local));
  const localNombre = localObj ? localObj.nombre : a.local_nombre;
  try {
    const d = await apiPost({
      action: 'asignar_local_subdirigente', dirigente_cedula: state.dirigente?.cedula || '',
      subdirigente_cedula: a.cedula, distrito: a.distrito, sec_loc: a.seccional, local: a.local,
      local_nombre: localNombre
    });
    if (!d.success) { alert(d.error || 'No se pudo asignar el local'); return; }
    state.local.asignandoSub = null;
    await cargarSubdirigentes();
  } catch (e) { alert('Error: ' + e.message); }
}

async function asignarSeguimientoSub(subCedula, subNombre) {
  if (!confirm(`¿Pasarle a ${subNombre} el seguimiento de tus votantes en su local asignado?`)) return;
  try {
    const d = await apiPost({
      action: 'asignar_seguimiento_subdirigente',
      dirigente_cedula: state.dirigente?.cedula || '',
      subdirigente_cedula: subCedula
    });
    if (!d.success) { alert(d.error || 'No se pudo asignar el seguimiento'); return; }
    state.mensaje = d.transferidos > 0
      ? `✅ Le pasaste ${d.transferidos} votante(s) a ${subNombre}`
      : `No tenías votantes propios en el local de ${subNombre}`;
    state.msgTipo = d.transferidos > 0 ? 'ok' : 'info';
    await cargarSubdirigentes();
    await cargarMisPosibles();
  } catch (e) { alert('Error: ' + e.message); }
}

async function aplicarLocalSugerido(loc) {
  // El nombre del local de votación NO es único en este padrón (se repite para
  // cientos de sitios distintos), así que el local se identifica siempre por su
  // combinación real distrito+seccional+local, nunca por el nombre solo.
  const L = state.local;
  L.filtro = { distrito: String(loc.distrito), seccional: String(loc.sec_loc), local: String(loc.local) };
  L.modoAuto = true;
  L.localActual = loc;
  await cargarLocalDashboard();
}

async function cargarLocalDashboard() {
  const L = state.local;
  L.cargando = true; L.error = '';
  render();
  try {
    const miCedula = state.dirigente?.cedula || '';
    const fg = L.filtro;
    const params = { action: 'dashboard', cedula: miCedula };
    if (fg.distrito) params.distrito_filtro = fg.distrito;
    if (fg.seccional) params.sec_loc_filtro = fg.seccional;
    if (fg.local) params.local_filtro = fg.local;
    const d = await apiGet(params);
    L.dashboard = d;
    L.cargando = false;
    if (!L.modoAuto && !L.distritosGeo.length) cargarLocalDistritos();
    cargarLocalPanelPolitico();
    if (fg.distrito && fg.seccional && fg.local) cargarCoordLocal();
    else L.coordLocal = null;
  } catch (e) {
    L.cargando = false;
    L.error = 'Error cargando datos: ' + e.message;
  }
  render();
}

// ============ UBICACIÓN GPS DEL LOCAL ("Dónde está tu local") ============
let mapaLocalVotacion = null;
async function cargarCoordLocal() {
  const L = state.local;
  const fg = L.filtro;
  L.coordLocalCargando = true;
  L.coordLocal = null;
  mapaLocalVotacion = null;
  render();
  try {
    const d = await apiGet({ action: 'local_coordenadas', distrito_filtro: fg.distrito, sec_loc_filtro: fg.seccional, local_filtro: fg.local });
    if (d.success) L.coordLocal = { lat: d.lat, lng: d.lng };
  } catch (e) { /* silent */ }
  L.coordLocalCargando = false;
  render();
  if (L.coordLocal) setTimeout(initMapaLocalVotacion, 50);
}

function initMapaLocalVotacion() {
  const el = document.getElementById('mapaLocalVotacion');
  if (!el || typeof window.L === 'undefined' || !state.local.coordLocal || mapaLocalVotacion) return;
  const centro = [state.local.coordLocal.lat, state.local.coordLocal.lng];
  mapaLocalVotacion = window.L.map('mapaLocalVotacion').setView(centro, 17);

  // Mapa real (calles/satélite), con selector de capa estilo Uber. Necesita internet
  // para los tiles; si no hay conexión, queda la cuadrícula de fondo como respaldo.
  const calles = window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  });
  const satelite = window.L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Tiles © Esri'
  });
  calles.addTo(mapaLocalVotacion);
  window.L.control.layers({ 'Calles': calles, 'Satélite': satelite }, null, { position: 'topright' }).addTo(mapaLocalVotacion);

  window.L.marker(centro).addTo(mapaLocalVotacion).bindPopup(state.local.localActual?.local_nombre || 'Local electoral').openPopup();
}

function marcarCoordLocalGPS() {
  if (!navigator.geolocation) { state.mensaje = '⚠️ Tu navegador no soporta geolocalización'; state.msgTipo = 'error'; render(); return; }
  const fg = state.local.filtro;
  if (!fg.distrito || !fg.seccional || !fg.local) return;
  state.local.coordLocalCargando = true; render();
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      try {
        const d = await apiPost({
          action: 'guardar_local_coordenadas',
          dirigente_cedula: state.dirigente?.cedula || '',
          distrito: fg.distrito, sec_loc: fg.seccional, local: fg.local,
          lat: pos.coords.latitude, lng: pos.coords.longitude
        });
        if (!d.success) { state.mensaje = '⚠️ ' + (d.error || 'No se pudo guardar'); state.msgTipo = 'warn'; }
        else { state.mensaje = '📍 Ubicación del local guardada'; state.msgTipo = 'ok'; }
      } catch (e) { state.mensaje = '⚠️ Error: ' + e.message; state.msgTipo = 'error'; }
      state.local.coordLocalCargando = false;
      await cargarCoordLocal();
    },
    (err) => {
      state.local.coordLocalCargando = false;
      state.mensaje = '⚠️ No se pudo obtener tu ubicación: ' + err.message; state.msgTipo = 'error'; render();
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function cargarLocalPanelPolitico() {
  const box = document.getElementById('localPanelPolitico');
  if (!box) return;
  try {

    }
    let totalDirigentes = 0, totalPosibles = 0, totalConfirmados = 0;
    d.arbol.forEach(it => {
      totalDirigentes += it.total_dirigentes || 0;
      totalPosibles += it.total_posibles || 0;
      totalConfirmados += it.total_confirmados || 0;
    });
    const pct = totalPosibles > 0 ? Math.round((totalConfirmados / totalPosibles) * 100) : 0;
    box.innerHTML = `
      <div class="col-span-1 bg-gradient-to-br from-slate-900 to-black border border-amber-500/30 rounded-xl p-4 text-white">
        <p class="text-[10px] font-black uppercase tracking-wide mb-1 text-slate-400">Listas / Intendentes</p>
        <p class="text-3xl font-black text-amber-400">${d.total_intendentes}</p>
        <p class="text-xs text-slate-400 line-clamp-2">${d.arbol.map(i => i.lista_nombre || ('Lista ' + i.lista_nro)).join(', ')}</p>
      </div>
      <div class="col-span-1 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl p-4 text-white">
        <p class="text-[10px] font-black uppercase tracking-wide mb-1">Dirigentes en campo</p>
        <p class="text-3xl font-black">${totalDirigentes}</p>
        <p class="text-xs opacity-80">${d.arbol.reduce((a,b)=>a+(b.total_concejales||0),0)} Concejales · ${d.arbol.reduce((a,b)=>a+(b.total_grupos||0),0)} PCs</p>
      </div>

async function cargarActividadVotantes() {
  if (!state.dirigente) return;
  try {
    const d = await apiGetRuta('/api/actividad_votantes?cedula=' + state.dirigente.cedula);
    state.actividadVotantes = d.actividad || [];
  } catch(e) {}
}

function renderActividadVotantes() {
  const items = state.actividadVotantes || [];
  if (!items.length) return '<div class="card text-center text-slate-400 py-6">Sin actividad reciente</div>';
  const icono = { voto: 'fa-check', votante: 'fa-user', recogida: 'fa-truck' };
  const color = { voto: 'text-green-600', votante: 'text-amber-600', recogida: 'text-blue-600' };
  return `
    <div class="space-y-2 fade-in">
      ${items.map(i => `
        <div class="card !p-3 flex items-center gap-3">
          <i class="fas ${icono[i.tipo] || 'fa-circle'} ${color[i.tipo] || 'text-slate-400'}"></i>
          <div class="flex-1 min-w-0">
            <div class="text-xs font-bold text-slate-800 truncate">${i.nombre || 'Votante'} <span class="text-slate-400">(#${i.cedula})</span></div>

          </div>
          <div class="text-[10px] text-slate-400 whitespace-nowrap">${(i.timestamp || '').slice(5, 16)}</div>
        </div>
      `).join('')}
    </div>`;
}

async function cargarMesasEstado() {

    state.mesasEstado = d.mesas || [];

// ============ BLOC DE TAREAS ============
async function cargarTareas() {
  if (!state.dirigente) return;
  try {
    const d = await apiGetRuta('/api/tareas?cedula=' + state.dirigente.cedula);
    state.tareas = d.tareas || [];
  } catch(e) {}
}

async function crearTarea() {
  const f = state.tareaForm;
  if (!f.titulo || !f.fecha_hora) { alert('Título y fecha/hora son requeridos'); return; }
  try {
    await apiPostRuta('/api/tareas/crear', {
      dirigida_cedula: state.dirigente.cedula,
      titulo: f.titulo,
      descripcion: f.descripcion,
      fecha_hora: f.fecha_hora,
      votante_cedula: f.votante_cedula,
      votante_nombre: f.votante_nombre
    });
    state.tareaForm = { titulo: '', descripcion: '', fecha_hora: '', votante_cedula: '', votante_nombre: '' };
    await cargarTareas();
    render();
  } catch(e) { alert('Error: ' + e.message); }
}

async function completarTarea(id) {
  try {
    await apiPostRuta('/api/tareas/completar', { tarea_id: id, dirigida_cedula: state.dirigente.cedula });
    await cargarTareas();
    render();
  } catch(e) { alert('Error: ' + e.message); }
}

async function eliminarTarea(id) {
  if (!confirm('¿Eliminar esta tarea?')) return;
  try {
    await apiPostRuta('/api/tareas/eliminar', { tarea_id: id, dirigida_cedula: state.dirigente.cedula });
    await cargarTareas();
    render();
  } catch(e) { alert('Error: ' + e.message); }
}

                        ${pctPosible > 0 ? `<div class="h-full bg-amber-400" style="width:${pctPosible}%" title="Posibles"></div>` : ''}
                        ${pctBuscar > 0 ? `<div class="h-full bg-red-400" style="width:${pctBuscar}%" title="Buscar / No responde"></div>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : '<p class="text-[10px] text-slate-400 text-center py-2">Sin votantes cargados en mesas. Cargá votantes para ver el estado por mesa.</p>'}
              </div>
            ` : ''}
          </div>
        </div>

        <!-- PANEL POLÍTICO -->
        <div class="bg-white rounded-2xl p-4 shadow-md border border-slate-100">

async function marcarNoVoto(item) {
  if (!confirm('¿Confirmar NO VOTO para ' + item.votante_nombre + '?')) return;
  try {
    const d = await apiPost({
      action:'registrar', estado:'no_voto',
      cedula:item.votante_cedula, nombre:item.votante_nombre,
      mesa:item.votante_mesa, orden:item.votante_orden,
      dirigente:state.dirigente.cedula, dirigenteNombre:state.dirigente.nombre,
      origen:'dirigente_'+state.dirigente.cedula
    });
    if (d.success) {
      state.mensaje = '❌ No Voto registrado: ' + item.votante_nombre; state.msgTipo = 'ok';
      await cargarMisPosibles(); await cargarSeguimiento();
    } else {
      state.mensaje = '⚠️ ' + (d.error || 'Error'); state.msgTipo = 'warn';
    }
  } catch(e) { state.mensaje = '⚠️ Error: '+e.message; state.msgTipo = 'error'; }
  render();
}

// ============ TAB: SEGUIMIENTO ============
function renderSeguimiento() {
  const s = state.seguimiento;

  }

  const pctPendiente = Math.round(((total - s.votaron - s.noVotaron) / total) * 100);

  const renderItem = (it, showVotoInfo) => {
    const ef = it.estado_final || it.status;
    let icon, color, bg, label;

    else if (ef === 'no_voto') { icon='fa-times-circle'; color='text-slate-600'; bg='bg-slate-100'; label='No Votó'; }
    else if (ef === 'en_proceso') { icon='fa-sync-alt fa-spin'; color='text-blue-600'; bg='bg-blue-50'; label='En Proceso'; }
    else if (ef === 'no_responde') { icon='fa-phone-slash'; color='text-red-600'; bg='bg-red-50'; label='No Responde'; }
    else { icon='fa-clock'; color='text-amber-600'; bg='bg-amber-50'; label='Pendiente'; }

    return `

              <p class="font-black text-slate-900 text-sm truncate">${it.votante_nombre || '—'}</p>
              <span class="badge whitespace-nowrap ${bg} ${color}">${label}</span>

            <div class="flex flex-wrap gap-1 mt-0.5">
              <span class="badge bg-red-100 text-red-700">Mesa ${it.votante_mesa || '—'}</span>
              <span class="badge bg-slate-100 text-slate-600">Ord. ${it.votante_orden || '—'}</span>
              ${it.votante_departamento ? `<span class="badge bg-blue-100 text-blue-700">${it.votante_departamento}</span>` : ''}
            </div>
            ${showVotoInfo && it.voto_timestamp ? `<p class="text-[10px] text-slate-400 mt-1"><i class="far fa-clock mr-1"></i>${new Date(it.voto_timestamp+'Z').toLocaleString('es-PY')}</p>` : ''}
          </div>
        </div>
      </div>`;
  };

  const faltan = [...(s.listas?.enProceso || []), ...(s.listas?.pendientes || []), ...(s.listas?.noResponden || [])];
  const votaron = s.listas?.votaron || [];
  const noVotaron = s.listas?.noVotaron || [];

  return `
    <div class="fade-in space-y-3">

      <!-- ═══ BARRA DE PROGRESO GENERAL ═══ -->
      <div class="bg-white rounded-2xl p-5 shadow-md border border-slate-100">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-black text-slate-800 uppercase tracking-tight">
            <i class="fas fa-chart-line text-emerald-500 mr-1.5"></i> Cumplimiento
          </h3>
          <span class="text-xs font-black text-slate-400">${s.votaron}/${total}</span>
        </div>
        <!-- Barra de progreso apilada -->
        <div class="w-full h-4 bg-slate-100 rounded-full overflow-hidden flex">
          <div class="bg-green-500 h-full transition-all duration-700" style="width:${pctVotaron}%" title="Votaron ${pctVotaron}%"></div>
          <div class="bg-red-400 h-full transition-all duration-700" style="width:${Math.round((s.noVotaron/total)*100)}%" title="No votaron"></div>
          <div class="bg-amber-300 h-full transition-all duration-700" style="width:${pctPendiente}%" title="Pendiente"></div>
        </div>
        <div class="flex justify-between mt-2 text-[9px] font-bold">
          <span class="text-green-600"><i class="fas fa-check-circle mr-0.5"></i>${pctVotaron}% Votó</span>
          <span class="text-red-500"><i class="fas fa-times-circle mr-0.5"></i>${s.noVotaron} No</span>
          <span class="text-amber-500"><i class="fas fa-clock mr-0.5"></i>${pctPendiente}% Falta</span>
        </div>
      </div>

      <!-- ═══ TARJETAS DE ESTADO ═══ -->
      <div class="grid grid-cols-5 gap-1.5">
        ${[
          { key:'pendientes', val:s.pendientes, icon:'fa-clock', color:'amber', label:'Pend.' },
          { key:'enProceso', val:s.enProceso, icon:'fa-sync-alt', color:'blue', label:'Proceso' },
          { key:'noResponden', val:s.noResponden, icon:'fa-phone-slash', color:'red', label:'No Resp.' },
          { key:'noVotaron', val:s.noVotaron, icon:'fa-times-circle', color:'slate', label:'No Vot.' },
          { key:'votaron', val:s.votaron, icon:'fa-check-circle', color:'green', label:'Votaron' }
        ].map(f => `
          <div class="bg-white rounded-xl p-2 text-center border border-${f.color}-200 shadow-sm">
            <div class="text-base md:text-lg font-black text-${f.color}-600">${f.val}</div>
            <div class="text-[7px] md:text-[9px] font-black text-${f.color}-500 uppercase tracking-wide mt-0.5">
              <i class="fas ${f.icon} mr-0.5"></i>${f.label}

          </div>

      </div>

      <!-- ═══ PIPELINE VISUAL ═══ -->
      <div class="bg-white rounded-2xl p-4 shadow-md border border-slate-100">

            { st:'vendra_solo', icon:'fa-walking', label:'Solo/a', color:'emerald', count:0 },
            { st:'no_responde', icon:'fa-phone-slash', label:'No Resp.', color:'red', count:s.noResponden },
            { st:'confirmado', icon:'fa-check-circle', label:'Seguro ✓', color:'green', count:0 },
            { st:'voto', icon:'fa-check-double', label:'Votó 🗳️', color:'green', count:s.votaron },
            { st:'no_voto', icon:'fa-ban', label:'No Votó', color:'slate', count:s.noVotaron }
          ].map(f => `
            <div class="flex-shrink-0 w-20 md:w-24 bg-${f.color}-50 rounded-xl p-2 text-center border border-${f.color}-200">

      <!-- ═══ YA VOTARON ═══ -->
      <div class="bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden">
        <div class="bg-gradient-to-r from-green-600 to-emerald-500 px-4 py-3 flex items-center justify-between">

          <span class="bg-white text-green-700 font-black px-2.5 py-0.5 rounded-full text-xs">${votaron.length}</span>
        </div>

          ${votaron.length === 0 ? `
            <div class="text-center py-8 text-slate-400"><i class="fas fa-inbox text-3xl mb-2"></i><p class="font-bold">Nadie ha votado aún</p></div>
          ` : votaron.map(it => renderItem(it, true)).join('')}
        </div>
      </div>

      <!-- ═══ NO VOTARON ═══ -->
      ${noVotaron.length > 0 ? `
      <div class="bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden">
        <div class="bg-gradient-to-r from-slate-500 to-slate-400 px-4 py-3 flex items-center justify-between">

}

function renderMensaje() {

    : state.msgTipo === 'warn' ? 'bg-amber-50 border-amber-200 text-amber-800'
    : 'bg-green-50 border-green-200 text-green-800';
  return `
    <div class="${cls} border-2 rounded-xl p-4 mb-4 fade-in flex justify-between items-center">
      <p class="font-bold text-sm">${state.mensaje}</p>
      <button onclick="state.mensaje='';render()" class="text-current opacity-50 hover:opacity-100 ml-4"><i class="fas fa-times"></i></button>
    </div>`;
}

// ============ AUTO REFRESH ============
let refreshTimer = null;
function startAutoRefresh() {
  stopAutoRefresh();
  refreshTimer = setInterval(() => {
    if (state.autenticado && state.tab === 'lista') {
      cargarMisPosibles();
    } else if (state.autenticado && state.tab === 'seguimiento') {
      cargarSeguimiento();
    }
  }, 30000); // cada 30s
}
function stopAutoRefresh() { if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; } }

// ============ LOGIN DIRECTO DESDE ENLACE DE EMAIL (recuperar contraseña) ============
async function intentarLoginDesdeEnlace() {
  const params = new URLSearchParams(window.location.search);
  const rc = params.get('rc'), rp = params.get('rp');
  if (!rc || !rp) return false;
  // Limpia los parámetros de la URL para no dejar la contraseña visible ahí.
  window.history.replaceState({}, '', window.location.pathname);
  state.loginCedula = rc;
  state.loginPaso = 2;
  state.cargando = true;
  render();
  try {
    const d = await apiGet({ action:'login', cedula:rc, password:rp });
    if (d.success && d.usuario) {
      sessionStorage.setItem('user_pw', rp);
      state.dirigente = d.usuario; state.autenticado = true;
      sessionStorage.setItem(AUTH_SHARED_KEY, JSON.stringify(state.dirigente));
      if (d.usuario.requiere_cambio_clave) await promptCambioClave(d.usuario.cedula, rp);
      await cargaInicial();
      startAutoRefresh();
    } else {
      state.cargando = false;
      state.mensaje = 'El enlace venció o ya se usó. Ingresá tu cédula y contraseña manualmente.';
      state.msgTipo = 'warn';
      render();
    }
  } catch (e) {
    state.cargando = false;
    render();
  }
  return true;
}

// ============ INIT ============
(function init() {
  const user = getSessionUser();
  if (user) { state.dirigente = user; state.autenticado = true; cargaInicial(); startAutoRefresh(); return; }
  intentarLoginDesdeEnlace().then(vinoDeEnlace => { if (!vinoDeEnlace) render(); });
})();
