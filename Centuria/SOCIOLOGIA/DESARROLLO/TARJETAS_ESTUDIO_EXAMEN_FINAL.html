<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas de Estudio - Examen Final - Sociología - Centuria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap');

        :root {
            --color-primary: #28a745;
            --color-secondary: #1e1e1e;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f8fafc;
        }

        .font-title {
            font-family: 'Playfair Display', serif;
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 500px;
            height: 300px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 2px solid #e2e8f0;
        }

        .card-front {
            background-color: white;
            color: var(--color-secondary);
            flex-direction: column;
        }

        .card-back {
            background-color: var(--color-primary);
            color: white;
            transform: rotateY(180deg);
            flex-direction: column;
        }

        .card-back .answer-label {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .unit-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .unit-1 { background: #fee2e2; color: #991b1b; }
        .unit-2 { background: #dbeafe; color: #1e40af; }
        .unit-3 { background: #e9d5ff; color: #6b21a8; }
        .unit-4 { background: #fef3c7; color: #92400e; }
        .unit-5 { background: #d1fae5; color: #065f46; }
        .unit-6 { background: #fce7f3; color: #9d174d; }
    </style>
</head>

<body class="p-4 md:p-8">

    <header class="max-w-4xl mx-auto mb-10 text-center border-b-2 pb-6 border-green-500">
        <div class="font-bold text-3xl tracking-tighter mb-1 font-title text-gray-800">
            INSTITUTO SUPERIOR <span class="text-red-600">CENTURIA</span>
        </div>
        <h2 class="text-xl font-bold uppercase text-green-600">Tarjetas de Repaso: Examen Final</h2>
        <p class="text-sm text-gray-500 italic">Unidades 1, 2, 3, 4, 5 y 6: Sociologia Completa</p>
    </header>

    <main class="max-w-4xl mx-auto">

        <div class="flex flex-col items-center mb-12">
            <div id="card-counter" class="mb-4 text-sm font-bold text-gray-400 uppercase tracking-widest">Tarjeta 1 de 60</div>

            <div class="card-container" id="flashcard" onclick="this.classList.toggle('flipped')">
                <div class="card-inner">
                    <div class="card-front">
                        <span id="unit-badge" class="unit-badge unit-1">Unidad 1</span>
                        <p id="question-text" class="text-xl font-bold">Cargando pregunta...</p>
                    </div>
                    <div class="card-back">
                        <span class="answer-label">Respuesta</span>
                        <p id="answer-text" class="text-lg">Cargando respuesta...</p>
                    </div>
                </div>
            </div>

            <div class="flex gap-4 mt-8">
                <button onclick="prevCard()"
                    class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-6 rounded-full transition">
                    <i class="fas fa-arrow-left mr-2"></i> Anterior
                </button>
                <button onclick="nextCard()"
                    class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-full shadow-lg transition">
                    Siguiente <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>
            <p class="mt-4 text-xs text-gray-400 italic"><i class="fas fa-mouse-pointer mr-1"></i> Haz clic en la tarjeta para ver la respuesta</p>
        </div>

        <div class="flex justify-center gap-2 mb-8 flex-wrap">
            <button onclick="filterByUnit(1)" class="unit-btn px-4 py-2 rounded-full text-xs font-bold bg-red-100 text-red-700 hover:bg-red-200 transition">Unidad 1</button>
            <button onclick="filterByUnit(2)" class="unit-btn px-4 py-2 rounded-full text-xs font-bold bg-blue-100 text-blue-700 hover:bg-blue-200 transition">Unidad 2</button>
            <button onclick="filterByUnit(3)" class="unit-btn px-4 py-2 rounded-full text-xs font-bold bg-purple-100 text-purple-700 hover:bg-purple-200 transition">Unidad 3</button>
            <button onclick="filterByUnit(4)" class="unit-btn px-4 py-2 rounded-full text-xs font-bold bg-yellow-100 text-yellow-700 hover:bg-yellow-200 transition">Unidad 4</button>
            <button onclick="filterByUnit(5)" class="unit-btn px-4 py-2 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 hover:bg-emerald-200 transition">Unidad 5</button>
            <button onclick="filterByUnit(6)" class="unit-btn px-4 py-2 rounded-full text-xs font-bold bg-pink-100 text-pink-700 hover:bg-pink-200 transition">Unidad 6</button>
            <button onclick="filterByUnit(0)" class="unit-btn px-4 py-2 rounded-full text-xs font-bold bg-gray-100 text-gray-700 hover:bg-gray-200 transition active">Todas</button>
        </div>

        <div class="text-center no-print">
            <a href="../index.html" class="text-gray-400 hover:text-green-600 text-sm font-bold transition">
                <i class="fas fa-home mr-1"></i> Volver al Dashboard
            </a>
        </div>
    </main>

    <script>
        const cardsData = [
            // UNIDAD 1: TEORIA SOCIOLOGICA (10 preguntas)
            { q: "¿Qué autor es considerado el padre del Positivismo y de la sociología científica?", a: "Augusto Comte.", unit: 1 },
            { q: "¿En qué consiste la Ley de los Tres Estados de Comte?", a: "Teologico (magico-religioso), Metafisico (filosofico-abstracto) y Positivo (cientifico-racional).", unit: 1 },
            { q: "¿Qué es la 'Estatica Social' según Comte?", a: "Estudio del orden social: la familia, la cooperacion y los vinculos que mantienen la cohesion social.", unit: 1 },
            { q: "¿Cómo define Durkheim el 'Hecho Social'?", a: "Maneras de actuar, pensar y sentir que son externas al individuo, con poder coercitivo y generalidad en la sociedad.", unit: 1 },
            { q: "¿Qué es la 'Solidaridad Mecanica' en Durkheim?", a: "Solidaridad basada en la similitud entre individuos en sociedades tradicionales, con conciencia colectiva fuerte.", unit: 1 },
            { q: "¿Qué es la 'Solidaridad Organica' en Durkheim?", a: "Solidaridad basada en la diferenciacion e interdependencia funcional en sociedades modernas complejas.", unit: 1 },
            { q: "¿Qué es el metodo 'Verstehen' de Max Weber?", a: "La comprension interpretativa del sentido subjetivo que el actor da a su accion social.", unit: 1 },
            { q: "¿Cuáles son los 4 tipos de Accion Social según Weber?", a: "Racional con fines, Racional con valores, Afectiva y Tradicional.", unit: 1 },
            { q: "¿Cuál es el motor de la historia para Karl Marx?", a: "La lucha de clases y el conflicto por el control de los medios de produccion economica.", unit: 1 },
            { q: "¿Qué es la 'Alienacion' en Marx?", a: "Separacion del trabajador de su producto, del proceso de trabajo, de su naturaleza humana y de los demas.", unit: 1 },

            // UNIDAD 2: ECONOMIA Y PERSPECTIVA ECONOMICA (10 preguntas)
            { q: "¿Qué es el 'Homo Economicus'?", a: "Modelo economico que asume el humano es un actor puramente racional que busca maximizar beneficios y minimizar costos.", unit: 2 },
            { q: "¿Qué propone el modelo del 'Homo Sociologicus'?", a: "Que las decisiones economicas estan influenciadas por normas sociales, valores, roles y la presion del grupo.", unit: 2 },
            { q: "¿Qué es la 'Incrustacion Social' (Embeddedness) de Polanyi?", a: "La idea de que la economia no esta aislada, sino sumergida en redes de relaciones sociales, confianza y normas.", unit: 2 },
            { q: "¿Qué es el 'Capital Social' según Putnam?", a: "Recursos como informacion, favores y oportunidades obtenidos a traves de redes de contactos y confianza interpersonal.", unit: 2 },
            { q: "¿Qué es la 'Institucion' en sentido sociologico?", a: "Patrones de comportamiento estables, normas, valores y practicas organizadas que estructuran la vida social.", unit: 2 },
            { q: "¿Qué es el 'Institucionalismo'?", a: "Corriente teorica que enfatiza el papel de las instituciones en dar forma al comportamiento y la organizacion social.", unit: 2 },
            { q: "¿Qué es la 'Economia Informal'?", a: "Actividades economicas realizadas fuera de los canales oficiales, sin regulacion ni proteccion estatal.", unit: 2 },
            { q: "¿Qué es la 'Globalizacion' economica?", a: "Proceso de interconexion de las economias nacionales a traves de flujos de comercio, inversion y tecnologia.", unit: 2 },
            { q: "¿Qué es el 'Neoliberalismo'?", a: "Corriente economica que promueve la libertad de mercado, la privatizacion y la reduccion del intervencion estatal.", unit: 2 },
            { q: "¿Qué es el 'Mercado' en sociologia economica?", a: "Espacio social donde ocurren intercambios regulados por oferta, demanda, normas y relaciones de poder.", unit: 2 },

            // UNIDAD 3: CULTURA Y SOCIALIZACION (10 preguntas)
            { q: "¿Qué es la 'Cultura' en sociologia?", a: "Conjunto de conocimientos, creencias, normas, valores, simbolos y practicas heredadas y compartilhidas por una sociedad.", unit: 3 },
            { q: "¿Qué diferencia hay entre Cultura Material e Inmaterial?", a: "Material: objetos tangibles (herramientas, tecnologia). Inmaterial: intangibles (valores, normas, lengua, creencias).", unit: 3 },
            { q: "¿Qué es la 'Socializacion'?", a: "Proceso de aprendizaje e internalizacion de normas, valores, roles y cultura de una sociedad por los individuos.", unit: 3 },
            { q: "¿Qué es la 'Socializacion Primaria'?", a: "Proceso en la primera infancia (familia) donde se internaliza el lenguaje, valores basicos y la identidad personal.", unit: 3 },
            { q: "¿Qué es la 'Socializacion Secundaria'?", a: "Proceso en la edad adulta donde se aprenden normas, valores y roles de instituciones especificas (escuela, trabajo).", unit: 3 },
            { q: "¿Qué es el 'Etnocentrismo'?", a: "Tendencia a juzgar otras culturas usando los estandares de la propia, asumiendo su superioridad.", unit: 3 },
            { q: "¿Qué es el 'Relativismo Cultural'?", a: "Enfoque que busca comprender las practicas culturales desde su propio contexto, sin juzgarlas segun criterios ajenos.", unit: 3 },
            { q: "¿Qué es la 'Cultura de Masas'?", a: "Produccion cultural estandarizada destinada a grandes audiencias, desarrollada por industrias culturales modernas.", unit: 3 },
            { q: "¿Qué es la 'Identidad Social'?", a: "Sentido de pertenencia a grupos sociales (etnicos, nacionales, de genero) que influye en la autodefinicion del individuo.", unit: 3 },
            { q: "¿Qué son las 'Normas Sociales'?", a: "Reglas explicitas o implicitas que definen los comportamientos apropiados en una situacion social determinada.", unit: 3 },

            // UNIDAD 4: EL HOMBRE COMO SER SOCIAL (10 preguntas)
            { q: "¿Qué son los 'Grupos Sociales'?", a: "Conjuntos de personas que interactuan regularmente y comparten identidad, normas y objetivos comunes.", unit: 4 },
            { q: "¿Qué diferencia hay entre Grupo Primario y Grupo Secundario?", a: "Primario: vinculos afectivos cercanos (familia, amigos). Secundario: formales y utilitarios (empresas, organizaciones).", unit: 4 },
            { q: "¿Qué son las 'Instituciones Sociales'?", a: "Sistemas de pautas sociales estandarizadas que regulan el comportamiento y satisfacen necesidades sociales basicas.", unit: 4 },
            { q: "¿Qué es la 'Institucion Total' segun Goffman?", a: "Lugar donde individuos son aislados del resto de la sociedad y viven una vida cerrada y controlada (carceles, hospitales).", unit: 4 },
            { q: "¿Qué es el 'Individualismo' en sociologia?", a: "Perspectiva que enfatiza la autonomia del individuo y su capacidad de tomar decisiones independientes del grupo.", unit: 4 },
            { q: "¿Qué es el 'Colectivismo'?", a: "Perspectiva que enfatiza la interdependencia del individuo con el grupo y la primacia de los objetivos colectivos.", unit: 4 },
            { q: "¿Qué es la 'Integracion Social'?", a: "Proceso por el cual el individuo se incorpora a la sociedad, adoptando normas, valores y roles sociales.", unit: 4 },
            { q: "¿Qué es el 'Rol Social'?", a: "Conjunto de expectativas y comportamientos asociados a una posicion especifica en la estructura social.", unit: 4 },
            { q: "¿Qué es la 'Anomia' segun Durkheim?", a: "Estado de desintegracion social donde faltan normas claras, generando comportamiento desorientado y falta de direccion.", unit: 4 },
            { q: "¿Qué es la 'Desviacion Social'?", a: "Comportamiento que viola las normas y expectativas de una sociedad o grupo, generando sanciones negativas.", unit: 4 },

            // UNIDAD 5: LIBERTAD Y EXISTENCIA HUMANA (10 preguntas)
            { q: "¿Qué es la 'Agencia Humana'?", a: "Capacidad de los individuos para actuar independientemente y tomar decisiones libres, incluso dentro de limitaciones estructurales.", unit: 5 },
            { q: "¿Qué es la 'Estructura Social'?", a: "Las normas, instituciones y condiciones materiales que limitan o facultan las acciones individuales.", unit: 5 },
            { q: "¿Qué es el 'Determinismo Social'?", a: "Doctrina que sostiene que los individuos estan completamente determinados por factores sociales, economicos o biologicos.", unit: 5 },
            { q: "¿Qué es la 'Mala Fe' segun Sartre?", a: "Autoengaño donde el individuo se esconde detras de su rol o las circunstancias para evitar la responsabilidad de sus acciones.", unit: 5 },
            { q: "¿Qué es la 'Libertad Negativa' segun Berlin?", a: "Ausencia de interferencia externa. 'Libertad de...' poder actuar sin restricciones ajenas.", unit: 5 },
            { q: "¿Qué es la 'Libertad Positiva' segun Berlin?", a: "Capacidad de autodeterminacion y proyecto de vida. 'Libertad para...' realizarse como persona.", unit: 5 },
            { q: "¿Qué es la 'Seguridad Juridica'?", a: "Condicion donde existen normas claras, predecibles y aplicadas equitativamente, permitiendo libertad real.", unit: 5 },
            { q: "¿Qué es la 'Movilidad Social'?", a: "Capacidad de cambiar de posicion socioeconomica por merito propio, esfuerzo o circunstancias.", unit: 5 },
            { q: "¿Qué es el 'Pluralismo Institucional'?", a: "Existencia de multiples poderes e instituciones que evitan el monopolio del control estatal o corporativo.", unit: 5 },
            { q: "¿Qué es un 'Proyecto Existencial'?", a: "La vida como construccion continua de elecciones y responsabilidades que definen la identidad del individuo.", unit: 5 },

            // UNIDAD 6: CAMBIO Y CONFLICTO SOCIAL (10 preguntas)
            { q: "¿Qué es la 'Estratificacion Social'?", a: "Division de la sociedad en capas o estratos desiguales de poder, riqueza y prestigio.", unit: 6 },
            { q: "¿Qué son las 'Clases Sociales'?", a: "Grupos jerarquicos basados en la posicion economica y ocupacional, con acceso diferenciado a recursos y oportunidades.", unit: 6 },
            { q: "¿Qué es la 'Movilidad Social'?", a: "Movimiento de individuos entre diferentes posiciones en la estructura de clases (ascendente o descendente).", unit: 6 },
            { q: "¿Qué es la 'Movilidad Ascendente'?", a: "Ascenso de un individuo o grupo a una clase social mas alta por educacion, empleo o logros personales.", unit: 6 },
            { q: "¿Qué es la 'Movilidad Horizontal'?", a: "Cambio de posicion sin variar el nivel en la jerarquia social (mismo nivel, distinta ocupacion o lugar).", unit: 6 },
            { q: "¿Qué es la 'Modernizacion'?", a: "Transicion de sociedades tradicionales a industriales, burocraticas y tecnologicas.", unit: 6 },
            { q: "¿Qué es la 'Globalizacion'?", a: "Proceso de interconexion global que desdibuja fronteras economicas, culturales y politicas.", unit: 6 },
            { q: "¿Qué es el 'Conflicto Social'?", a: "Tension entre grupos por intereses opuestos, recursos limitados o poder, que puede generar cambio social.", unit: 6 },
            { q: "¿Qué es la 'Resistencia al Cambio'?", a: "Oposicion de grupos a innovaciones por intereses creados, inercia institucional o miedo a lo desconocido.", unit: 6 },
            { q: "¿Cómo se 'Canaliza' el Conflicto Social?", a: "A traves de instituciones (negociaciones, paritarias, leyes) que transforman tensiones en cambios pacficos.", unit: 6 }
        ];

        let currentIndex = 0;
        let filteredCards = [...cardsData];
        const cardElement = document.getElementById('flashcard');
        const qText = document.getElementById('question-text');
        const aText = document.getElementById('answer-text');
        const counterText = document.getElementById('card-counter');
        const unitBadge = document.getElementById('unit-badge');

        function updateCard() {
            cardElement.classList.remove('flipped');
            setTimeout(() => {
                qText.textContent = filteredCards[currentIndex].q;
                aText.textContent = filteredCards[currentIndex].a;
                counterText.textContent = `Tarjeta ${currentIndex + 1} de ${filteredCards.length}`;
                
                const unit = filteredCards[currentIndex].unit;
                unitBadge.className = `unit-badge unit-${unit}`;
                unitBadge.textContent = `Unidad ${unit}`;
            }, 150);
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % filteredCards.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + filteredCards.length) % filteredCards.length;
            updateCard();
        }

        function filterByUnit(unit) {
            if (unit === 0) {
                filteredCards = [...cardsData];
            } else {
                filteredCards = cardsData.filter(c => c.unit === unit);
            }
            currentIndex = 0;
            updateCard();
        }

        updateCard();
    </script>
</body>

</html>
