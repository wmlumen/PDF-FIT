<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Digital Interactiva | Informática Aplicada ICO3534</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e3799; --secondary: #4b7bec; --success: #20bf6b; --danger: #eb3b5a; --bg: #f5f6fa; --white: #ffffff; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .quiz-container { max-width: 900px; width: 100%; background: var(--white); padding: 40px; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.1); border-top: 10px solid var(--primary); }
        .header { text-align: center; border-bottom: 2px solid #eee; margin-bottom: 30px; padding-bottom: 20px; }
        .user-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 8px; color: var(--primary); }
        input, select { padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--secondary); outline: none; }
        .question-card { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 10px; background: white; cursor: pointer; text-align: left; transition: 0.2s; font-size: 1rem; }
        .option-btn:hover { background: #f0f7ff; border-color: var(--secondary); }
        .option-btn.selected { background: var(--secondary); color: white; border-color: var(--secondary); }
        .controls { display: flex; justify-content: space-between; margin-top: 30px; align-items: center; }
        button.main-btn { padding: 12px 30px; border: none; border-radius: 30px; background: var(--primary); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button.main-btn:hover { background: var(--secondary); transform: scale(1.05); }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: 0.3s; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f1f2f6; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h1>Evaluación Digital Interactiva</h1>
        <p>Motor de Certificación de Competencias • ICO3534</p>
    </div>

    <!-- Pantalla Inicial -->
    <div id="startScreen">
        <div class="user-fields">
            <div class="input-group"><label>Nombre del Alumno</label><input type="text" id="userName" placeholder="Nombre completo"></div>
            <div class="input-group"><label>Cédula de Identidad</label><input type="text" id="userCI" placeholder="C.I. N°"></div>
        </div>
        <div class="input-group" style="margin-bottom: 30px;">
            <label>Seleccione la Unidad / Clase a Evaluar</label>
            <select id="classSelect">
                <optgroup label="Bloque I: Fundamentos">
                    <option value="1">Clase 1: Los Sistemas (Teoría)</option>
                    <option value="2">Clase 2: Algoritmia y Lógica</option>
                    <option value="3">Clase 3: Procesadores de Texto Corporativos</option>
                    <option value="4">Clase 4: Planillas Electrónicas Avanzadas</option>
                </optgroup>
                <optgroup label="Bloque II: Contabilidad Digital">
                    <option value="5">Clase 5: Contabilidad y Computación</option>
                    <option value="6">Clase 6: Informática Contable (Archivos)</option>
                    <option value="7">Clase 7: SIC Modernos</option>
                    <option value="8">Clase 8: Marco Legal (DNIT/SIFEN)</option>
                    <option value="9">Clase 9: Comercio Electrónico</option>
                    <option value="10">Clase 10: EXAMEN PARCIAL</option>
                </optgroup>
                <optgroup label="Bloque III: Proyecto e Innovación">
                    <option value="11">Clase 11: Auditoría de Sistemas</option>
                    <option value="15">Clase 15: Inteligencia Artificial en Contabilidad</option>
                    <option value="23">Clase 23: PROYECTO FINAL / EXAMEN FINAL</option>
                </optgroup>
            </select>
        </div>
        <button class="main-btn" onclick="startQuiz()" style="width: 100%; font-size: 1.2rem;">GENERAR TEST ALEATORIO (20 PREGUNTAS)</button>
    </div>

    <!-- Pantalla de Preguntas -->
    <div id="quizScreen" style="display:none;">
        <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
        <h2 id="questionText" style="color: var(--primary); margin-bottom: 25px;"></h2>
        <div id="optionsContainer"></div>
        <div class="controls">
            <span id="questionCounter" style="font-weight: bold; color: var(--secondary);"></span>
            <button class="main-btn" onclick="nextQuestion()">Siguiente →</button>
        </div>
    </div>

    <!-- Pantalla de Resultados -->
    <div id="resultsScreen" style="display:none; text-align:center;">
        <h2 id="resultMsg">¡Evaluación Finalizada!</h2>
        <div id="scoreDisplay" style="font-size: 5rem; font-weight: 800; color: var(--success); margin: 20px 0;">0/20</div>
        <div id="userInfoDisplay" style="margin-bottom: 30px; font-weight: 600;"></div>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button class="main-btn" onclick="location.reload()">Nuevo Intento</button>
            <button class="main-btn" style="background:#636e72;" onclick="window.print()">Imprimir Constancia</button>
        </div>
    </div>

    <!-- Panel del Profesor -->
    <div id="teacherPanel" style="display:none; margin-top: 50px; border-top: 4px solid var(--primary); padding-top: 20px;">
        <h2 style="color: var(--primary);">📊 Panel de Control del Profesor</h2>
        <div class="stats-grid" id="statsDisplay" style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0;"></div>
        <table id="resultsTable"><thead><tr><th>Fecha</th><th>Alumno</th><th>C.I.</th><th>Unidad</th><th>Puntaje</th></tr></thead><tbody></tbody></table>
        <div style="margin-top: 20px; text-align: right;">
            <button onclick="clearData()" style="background:var(--danger); color:white; border:none; padding:10px; border-radius:5px; cursor:pointer;">Borrar Historial Completo</button>
        </div>
    </div>

    <div style="text-align: center; margin-top: 30px;">
        <button onclick="loginTeacher()" style="background:none; border:none; color:#ccc; cursor:pointer; font-size: 0.7rem;">Acceso Administrativo 🔒</button>
    </div>
</div>

<script>
    const questionBank = {
        "1": [
            { q: "¿Qué es un sistema contable bajo la TGS?", options: ["Un libro", "Un conjunto de elementos interrelacionados para producir información", "Una PC", "Un programa"], correct: 1 },
            { q: "¿Cuál es la función de la etapa de Colección?", options: ["Pagar impuestos", "Capturar el dato bruto", "Emitir balances", "Borrar archivos"], correct: 1 },
            { q: "¿Qué significa GIGO?", options: ["Grandes Ingresos", "Garbage In, Garbage Out", "Gestión Integral", "Nada"], correct: 1 },
            { q: "¿Qué es la entropía en un SIC?", options: ["Orden máximo", "Tendencia al desorden de los datos", "Velocidad de internet", "Un virus"], correct: 1 },
            { q: "¿Qué es la veracidad de la información?", options: ["Rapidez", "Que los datos coincidan plenamente con la realidad", "Que sea digital", "Que sea barata"], correct: 1 }
        ],
        "2": [
            { q: "¿Qué es un algoritmo?", options: ["Una duda", "Pasos lógicos para resolver un problema", "Un cable", "Un tipo de monitor"], correct: 1 },
            { q: "¿Qué instrucción se usa para validaciones binarias?", options: ["SUMAR", "SI / ENTONCES", "COPIAR", "NADA"], correct: 1 },
            { q: "El pseudocódigo sirve para:", options: ["Pagar salarios", "Planificar la lógica antes de programar", "Imprimir hojas", "Dibujar"], correct: 1 }
        ],
        "3": [
            { q: "¿Qué norma se usa para citas bibliográficas en reportes técnicos?", options: ["ISO 9001", "APA 7", "DNIT", "UNESCO"], correct: 1 },
            { q: "¿Cuál es el fin de la combinación de correspondencia?", options: ["Hacer una carta", "Automatizar envíos masivos personalizados", "Borrar mails", "Dibujar tablas"], correct: 1 }
        ],
        "4": [
            { q: "¿Qué función busca un valor en una matriz extensa?", options: ["SUMA", "BUSCARV", "PROMEDIO", "SI"], correct: 1 },
            { q: "Una tabla dinámica permite:", options: ["Escribir texto", "Resumir y analizar grandes volúmenes de datos", "Pintar celdas", "Hacer presentaciones"], correct: 1 }
        ],
        "5": [
            { q: "¿Cuál es la diferencia entre contabilidad y teneduría?", options: ["Ninguna", "La contabilidad es ciencia/análisis, la teneduría es el registro mecánico", "Son opuestos", "No existen"], correct: 1 },
            { q: "Según Fowler Newton, el computador es:", options: ["Un adorno", "Una herramienta para procesar la lógica contable", "El reemplazo del contador", "Una calculadora"], correct: 1 }
        ],
        "6": [
            { q: "¿Qué caracteriza a un archivo Maestro?", options: ["Cambia cada segundo", "Contiene datos permanentes de referencia", "Es basura", "No sirve"], correct: 1 },
            { q: "¿Qué es una Llave Primaria?", options: ["Un código repetido", "Un identificador único para cada registro", "Un password", "Un archivo"], correct: 1 }
        ],
        "7": [
            { q: "¿Qué significa que la información sea Oportuna?", options: ["Que llegue tarde", "Que esté disponible cuando se debe tomar la decisión", "Que sea gratuita", "Que sea colorida"], correct: 1 },
            { q: "¿Qué es un ERP?", options: ["Un virus", "Sistema de Planificación de Recursos Empresariales", "Una marca de PC", "Nada"], correct: 1 }
        ],
        "8": [
            { q: "¿Qué ley regula los Servicios de Confianza en Paraguay?", options: ["Ley 6822/21", "Ley del Deporte", "Código Civil", "Ley de Transito"], correct: 0 },
            { q: "¿Qué es el SIFEN?", options: ["Sistema de Facturación Electrónica Nacional", "Sistema de Seguros", "Software de Juegos", "Un banco"], correct: 0 },
            { q: "¿Qué es la Factura Electrónica e-Kuatia?", options: ["Un PDF", "Un archivo XML firmado digitalmente con validez legal", "Una foto", "Un mail"], correct: 1 }
        ],
        "9": [
            { q: "¿Qué es B2C?", options: ["Business to Connection", "Business to Consumer", "Back to Cash", "Nada"], correct: 1 },
            { q: "El dropshipping implica contablemente:", options: ["Gestionar ventas sin stock físico", "Es ilegal", "No se registra", "Es solo para ropa"], correct: 0 }
        ],
        "10": [
            { q: "¿Cuál es el fin de un examen parcial de Informática Aplicada?", options: ["Saber inglés", "Validar el conocimiento teórico-práctico del bloque I y II", "Perder el tiempo", "Ninguno"], correct: 1 }
        ],
        "11": [
            { q: "¿Qué es la Auditoría de Sistemas?", options: ["Reparar PCs", "Verificar que los controles del software sean efectivos", "Hacer asientos", "Vender software"], correct: 1 },
            { q: "¿Qué es la Trazabilidad?", options: ["Un dibujo", "Seguir el rastro de un dato desde el origen al reporte", "Un tipo de letra", "Nada"], correct: 1 }
        ],
        "15": [
            { q: "Función de la IA en la contabilidad:", options: ["Cargar folios", "Detectar anomalías y patrones sospechosos", "Limpiar teclados", "Reemplazar al dueño"], correct: 1 }
        ],
        "23": [
            { q: "¿Qué es el Proyecto Final de ICO3534?", options: ["Una redacción", "Integrar todos los sistemas en un caso de uso real", "Un dibujo", "Un examen oral"], correct: 1 }
        ]
    };

    let currentQuestions = [], currentIndex = 0, score = 0, selectedOption = null;

    function startQuiz() {
        const name = document.getElementById('userName').value;
        const ci = document.getElementById('userCI').value;
        const classId = document.getElementById('classSelect').value;
        if (!name || !ci) return alert("Ingrese sus datos para poder emitir la certificación.");
        
        let bank = questionBank[classId] || [];
        if (bank.length < 5) { // Fallback if questions are missing
            bank = [...bank, ...questionBank["1"]];
        }
        
        currentQuestions = bank.sort(() => Math.random() - 0.5).slice(0, 20);
        currentIndex = 0; score = 0;
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('quizScreen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('questionText').innerText = q.q;
        document.getElementById('questionCounter').innerText = `Pregunta ${currentIndex + 1} de ${currentQuestions.length}`;
        document.getElementById('progressBar').style.width = `${(currentIndex / currentQuestions.length) * 100}%`;
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        selectedOption = null;
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedOption = idx;
            };
            container.appendChild(btn);
        });
    }

    function nextQuestion() {
        if (selectedOption === null) return alert("Seleccione una respuesta.");
        if (selectedOption === currentQuestions[currentIndex].correct) score++;
        currentIndex++;
        if (currentIndex < currentQuestions.length) showQuestion();
        else finalizeQuiz();
    }

    function finalizeQuiz() {
        document.getElementById('quizScreen').style.display = 'none';
        document.getElementById('resultsScreen').style.display = 'block';
        document.getElementById('scoreDisplay').innerText = `${score}/${currentQuestions.length}`;
        document.getElementById('userInfoDisplay').innerText = `${document.getElementById('userName').value} - C.I. ${document.getElementById('userCI').value}`;
        saveResult();
    }

    function saveResult() {
        const result = {
            date: new Date().toLocaleString(),
            name: document.getElementById('userName').value,
            ci: document.getElementById('userCI').value,
            unit: document.getElementById('classSelect').options[document.getElementById('classSelect').selectedIndex].text,
            score: score + "/" + currentQuestions.length
        };
        const history = JSON.parse(localStorage.getItem('ico_scores') || '[]');
        history.push(result);
        localStorage.setItem('ico_scores', JSON.stringify(history));
    }

    function loginTeacher() {
        if (prompt("Clave de Acceso:") === "centuria2026") {
            document.getElementById('teacherPanel').style.display = 'block';
            loadStats();
        }
    }

    function loadStats() {
        const history = JSON.parse(localStorage.getItem('ico_scores') || '[]');
        const tbody = document.querySelector('#resultsTable tbody');
        tbody.innerHTML = '';
        history.forEach(h => {
            tbody.innerHTML += `<tr><td>${h.date}</td><td>${h.name}</td><td>${h.ci}</td><td>${h.unit}</td><td>${h.score}</td></tr>`;
        });
    }

    function clearData() { if(confirm("¿Borrar historial?")) { localStorage.removeItem('ico_scores'); loadStats(); } }
</script>

</body>
</html>
